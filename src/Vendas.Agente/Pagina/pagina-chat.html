      const variacao = (x, curto) => x.atual == null ? el('span', 'chat-delta', 'Sem vendas registadas')
        : x.parcial ? el('span', 'chat-delta', curto ? 'Incompleto' : 'Mês incompleto')
        : x.delta != null ? chipDelta(x.delta, s.anoAnt && !curto ? ' vs ' + s.anoAnt : '') : el('span');
      const botoes = [];
      const escolher = i => {
        const x = s.meses[i];
        botoes.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
        marca.style.left = X(i) + '%';
        [...rotulos.children].forEach((r, j) => r.classList.toggle('chat-rotulo--ativo', i === j));
        const bloco = (ano, v) => { const d = el('div'); d.append(el('small', '', String(ano)), el('span', '', v == null ? '—' : euros(v))); return d; };
        leitura.replaceChildren(el('strong', '', nomeMes(x)), bloco(x.a, x.atual));
        if (s.anoAnt) leitura.append(bloco(s.anoAnt, x.anterior));
        if (x.media) { const d = el('div'); d.append(el('small', '', 'Valor médio'), el('span', '', x.media)); leitura.append(d); }
        leitura.append(variacao(x));
      };
      s.meses.forEach((x, i) => {
        rotulos.append(el('span', '', MESES[x.m - 1].slice(0, 3).toLowerCase()));
        if (x.atual == null) return;                    // mês sem vendas: sem ponto
        const b = botaoEl('chat-ponto-mes' + (x.parcial ? ' chat-ponto-mes--parcial' : ''), '', () => escolher(i));
        b.dataset.i = i;
        b.style.left = X(i) + '%';
        b.style.top = Y(x.atual) + 'px';
        b.append(el('span'));
        b.setAttribute('aria-label', nomeMes(x) + ': ' + euros(x.atual) + (x.anterior != null ? ', ' + s.anoAnt + ': ' + euros(x.anterior) : '')
          + (x.parcial ? ', mês incompleto' : x.delta != null ? ', ' + textoDelta(x.delta) : ''));
        botoes.push(b);
        barras.append(b);
      });
      colunas.append(barras, rotulos);
      corpo.append(eixo, colunas);
      sec.append(cab, leitura, corpo);
      art.append(sec);

      // Começa no melhor mês
      let melhor = 0;
      s.meses.forEach((x, i) => { if ((x.atual || 0) > (s.meses[melhor].atual || 0)) melhor = i; });
      escolher(melhor);

      // Tabela de detalhe: os mesmos números, para ler ou copiar
      const tab = el('details', 'chat-bloco chat-meses');
      const grelha = el('div');
      grelha.setAttribute('role', 'table');
      grelha.setAttribute('aria-label', 'Detalhe por mês');
      // Colunas opcionais: ano anterior só com comparação, valor médio só quando vem em cada mês
      const comMedia = s.meses.some(x => x.media);
      const linha = (celulas, cabecalho) => {
        const l = el('div', 'chat-meses-linha' + (cabecalho ? ' chat-meses-cab' : ''));
        l.setAttribute('role', 'row');
        l.style.gridTemplateColumns = `minmax(0, 1fr) repeat(${celulas.length - 1}, minmax(80px, auto))`;
        celulas.forEach(c => { c.setAttribute('role', cabecalho ? 'columnheader' : 'cell'); l.append(c); });
        grelha.append(l);
      };
      linha([el('span', '', 'Mês'), el('span', '', String(s.anoAtual)), ...(s.anoAnt ? [el('span', '', s.anoAnt)] : []),
             ...(comMedia ? [el('span', '', 'Valor médio')] : []), el('span', '', 'Variação')], true);
      s.meses.filter(x => x.atual != null).forEach(x => {
        const v = el('span'); v.append(variacao(x, true));   // na tabela o cabeçalho já diz "Variação"
        linha([el('span', '', nomeMes(x) + (x.parcial ? ' (incompleto)' : '')), el('span', 'chat-atual', euros(x.atual)),
               ...(s.anoAnt ? [el('span', 'chat-ant', x.anterior == null ? '—' : euros(x.anterior))] : []),
               ...(comMedia ? [el('span', '', x.media || '—')] : []), v]);
      });
      tab.append(el('summary', '', 'Ver detalhe por mês'), grelha);
      art.append(tab);
    }

    // Ranking (top marcas, artigos, clientes): nome | barra | valor, com eixo por baixo
    function desenharRanking(itens, art) {
      const max = Math.max(...itens.map(i => i.num));
      const passo = Math.pow(10, Math.floor(Math.log10(max))) / 2;
      const topo = Math.ceil(max / passo) * passo;     // ex.: 299 053 -> 300 000
      const bloco = el('div', 'chat-bloco chat-ranking');
      const ol = el('ol', 'chat-rank');
      ol.setAttribute('role', 'list');
      for (const it of itens) {
        const li = el('li', 'chat-rank-linha');
        const nome = el('div', 'chat-rank-nome');
        const vazio = /^\(?sem descri[çc][ãa]o\)?$/i.test(it.nome);
        nome.append(el('span', vazio ? 'chat-item-nome--vazio' : '', vazio ? 'Sem descrição' : it.nome));
        if (it.codigo) nome.append(el('small', '', it.codigo));
        nome.title = it.nome + (it.codigo ? ' (' + it.codigo + ')' : '');
        const pista = el('span', 'chat-rank-pista'), cheio = el('span');
        pista.setAttribute('aria-hidden', 'true');
        cheio.style.width = Math.max(1, it.num / topo * 100) + '%';
        pista.append(cheio);
        const val = el('div', 'chat-rank-valor');
        val.append(el('strong', '', it.valor));
        if (it.pct) val.append(el('small', '', it.pct));
        if (it.media) li.title = 'Valor médio por documento: ' + it.media;   // fora da linha, para não a encher
        if (it.delta != null) val.append(chipDelta(it.delta, it.anterior ? ' vs ' + it.anterior.ano : ''));
        li.append(el('span', 'chat-rank-pos', it.pos), nome, pista, val);
        ol.append(li);
      }
      // Eixo alinhado com a coluna das barras
      const eixo = el('div', 'chat-rank-linha chat-rank-eixo');
      eixo.setAttribute('aria-hidden', 'true');
      const marcas = el('div', 'chat-rank-marcas');
      for (let k = 0; k <= 4; k++) marcas.append(el('span', '', k ? milhares(topo * k / 4).replace(' €', '') : '0'));
      eixo.append(el('span'), el('span'), marcas, el('span'));
      bloco.append(ol, eixo);
      art.append(bloco);
    }

    // Lista simples: posição | nome e código | valor. Com grupos ("Clientes em Odivelas") e nomes repetidos.
    function desenharLista(itens, art, titulo) {
      const nums = itens.map(i => Math.abs(i.num)).filter(n => n > 0);
      const max = nums.length ? Math.max(...nums) : 0;
      const rotulos = new Set(itens.map(i => i.rotulo));
      const comum = rotulos.size === 1 ? [...rotulos][0] : '';
      const bloco = el('div', 'chat-bloco chat-bloco--lista');
      if (titulo) bloco.append(el('h3', 'chat-lista-titulo', titulo));
      if (comum) { const c = el('div', 'chat-lista-cab', maiuscula(comum)); c.setAttribute('aria-hidden', 'true'); bloco.append(c); }

      // O mesmo nome repetido no mesmo grupo aparece uma vez, com a contagem
      const chave = i => (i.grupo || '') + '|' + i.nome + '|' + i.valor;
      const vezes = new Map(), porGrupo = new Map();
      itens.forEach(i => {
        vezes.set(chave(i), (vezes.get(chave(i)) || 0) + 1);
        porGrupo.set(i.grupo || '', (porGrupo.get(i.grupo || '') || 0) + 1);
      });

      const ol = el('ol', 'chat-lista');
      ol.setAttribute('role', 'list');
      let grupoAnterior = '';
      for (const it of itens) {
        const n = vezes.get(chave(it));
        if (!n) continue;                       // repetido já mostrado
        vezes.set(chave(it), 0);
        if (it.grupo && it.grupo !== grupoAnterior) {
          const g = el('li', 'chat-grupo-cab', it.grupo + ' ');
          g.append(el('span', '', '· ' + porGrupo.get(it.grupo)));
          ol.append(g);
        }
        grupoAnterior = it.grupo || '';
        const li = el('li', 'chat-item');
        const corpo = el('div', 'chat-item-corpo');
        const vazio = /^\(?sem descri[çc][ãa]o\)?$/i.test(it.nome);
        corpo.append(el('span', 'chat-item-nome' + (vazio ? ' chat-item-nome--vazio' : ''), vazio ? 'Sem descrição' : it.nome));
        if (it.codigo) corpo.append(el('span', 'chat-item-codigo', it.codigo));
        if (n > 1) corpo.append(el('span', 'chat-item-codigo', n + ' registos com este nome'));
        const v = Math.abs(it.num);
        if (v > 0 && max > 0) {
          const b = el('span', 'chat-item-barra' + (it.num < 0 ? ' chat-item-barra--neg' : '')), f = el('span');
          b.setAttribute('aria-hidden', 'true');
          f.style.width = Math.max(2, v / max * 100) + '%';
          b.append(f); corpo.append(b);
        }
        const val = el('div', 'chat-item-valor');
        if (it.rotulo) val.append(el('span', comum ? 'so-leitor' : 'chat-item-rotulo', maiuscula(it.rotulo) + (comum ? ': ' : '')));
        if (it.valor) val.append(el('strong', it.rotulo ? 'chat-data' : '', it.valor));
        if (it.pct) val.append(el('span', 'chat-item-pct', it.pct));
        if (it.delta != null) val.append(chipDelta(it.delta, it.anterior ? ' vs ' + it.anterior.ano : ''));
        li.append(el('span', 'chat-item-pos', it.pos), corpo, val);
        ol.append(li);
      }
      bloco.append(ol);
      art.append(bloco);
    }

    function folhaLista(r, original) {
      const art = el('article', 'chat-folha');
      const simples = !r.titulo && !r.itens.length && !r.factos.length && !r.avisos.length;
      if (simples) {
        art.append(el('p', 'chat-texto', original.trim()));
        const rod = el('div', 'chat-folha-rodape');
        rod.append(botaoCopiar(original.trim()));   // texto: só Copiar
        art.append(rod);
        return art;
      }

      // Período de um só dia: título com o dia da semana e sem "1 meses" no total
      const dia = r.periodo.match(/^(\d{2})-(\d{2})-(\d{4}) a \1-\2-\3$/);
      if (dia) {
        const semana = new Date(+dia[3], +dia[2] - 1, +dia[1]).toLocaleDateString('pt-PT', { weekday: 'long' });
        r.titulo = `Faturação de ${semana}, ${dia[1]}-${dia[2]}-${dia[3]}`;
        r.periodo = '';
        r.resumo = r.resumo.replace(/\bem 1 m[eê]s(es)?,\s*/i, 'em ');
      }

      const cab = el('div', 'chat-folha-cab');
      if (r.titulo) cab.append(el('h2', 'chat-folha-titulo', maiuscula(r.titulo)));
      if (r.periodo) cab.append(el('p', 'chat-folha-meta', 'Período: ' + r.periodo));
      art.append(cab);

      art.classList.add('chat-folha--painel');
      const linhasKpis = desenharKpis(r, cab, art);
      const serie = lerSerie(r);

      r.avisos.forEach((a, n) => {
        const div = el('div', 'chat-aviso');
        div.setAttribute('role', 'note');
        const texto = el('div');
        const span = el('span');
        span.append(el('strong', '', 'Atenção: '), a);
        texto.append(span);
        if (n === 0 && serie && serie.justa) {
          const j = el('p', 'chat-justa');
          j.append(`Comparando só os meses completos, ${serie.justa.de} a ${serie.justa.ate}:`,
                   chipDelta(serie.justa.delta, serie.anoAnt ? ' vs ' + serie.anoAnt : ''));
          texto.append(j);
        }
        div.append(icone('M8 1.8 15 14H1L8 1.8ZM8 6v3.5M8 11.5v.5'), texto);
        art.append(div);
      });

      r.paragrafos.forEach(p => art.append(el('p', 'chat-texto', p)));

      // Valores negativos (devoluções, notas de crédito) vão para um bloco à parte
      const devolucoes = r.itens.filter(i => i.num < 0);
      const itens = r.itens.filter(i => !(i.num < 0));
      // Um só valor (ex.: um dia) já está nos cartões: não desenha uma barra sozinha
      const soUm = itens.length === 1 && !devolucoes.length && !!art.querySelector('.chat-kpis');

      let imagem = null;   // gráfico que o botão "Guardar imagem" redesenha em PNG
      const periodo = r.periodo ? 'Período: ' + r.periodo : '';
      if (serie) { desenharSerie(serie, art); imagem = () => pngSerie(serie, r.titulo, periodo); }
      else if (soUm) { /* nada a acrescentar */ }
      else if (itens.length && itens.every(i => i.num > 0 && !i.rotulo)) { desenharRanking(itens, art); imagem = () => pngRanking(itens, r.titulo, periodo); }
      if (devolucoes.length) desenharLista(devolucoes, art, 'Devoluções e notas de crédito');

      const linhas = !r.itens.length ? linhasKpis
        : serie ? [['Mês', serie.anoAtual, serie.anoAnt || '', 'Variação (%)', 'Valor médio'],
                   ...r.itens.map(i => [i.nome, i.valor, i.anterior ? i.anterior.valor : '', i.delta == null ? '' : String(i.delta).replace('.', ','), i.media])]
        : [['Posição', 'Grupo', 'Nome', 'Código', 'Valor', '%', 'Média'],
           ...r.itens.map(i => [i.pos, i.grupo || '', i.nome, i.codigo, i.valor, i.pct, i.media])];
      rodapeDados(art, linhas, r.titulo, r.nota);
      return art;
    }

    function folhaTabela(t) {
      const art = el('article', 'chat-folha chat-folha--painel');
      // Sem markdown e sem "Lista completa: …", que repete o total
      const limpo = s => s.split('\n').map(l => limparMarkdown(l.trim()).replace(MARCADOR, ''))
        .filter(l => l && !/^lista completa/i.test(l)).join('\n');
      const antes = limpo(t.antes), depois = limpo(t.depois);
      const [titulo, resumo] = antes.split(/:\s+(.*)/s);
      const cab = el('div', 'chat-folha-cab');
      art.append(cab);
      if (titulo) cab.append(el('h2', 'chat-folha-titulo', maiuscula(titulo)));   // sem toLowerCase: mantém "Paulo Afonso"

      // Coluna de texto com o mesmo valor em todas as linhas (ex.: Vendedor): sai da tabela e vai para o cabeçalho
      const fixa = t.cabecalho.map((_, c) => c > 0 && !t.numericas[c] && t.linhas.length > 1 && t.linhas.every(l => l[c] === t.linhas[0][c]));
      if (fixa.some(Boolean)) {
        const filtros = el('div', 'chat-filtros');
        t.cabecalho.forEach((nome, c) => {
          if (!fixa[c]) return;
          const f = el('span', 'chat-filtro');
          f.append(el('span', '', maiuscula(nome)), t.linhas[0][c]);
          filtros.append(f);
        });
        cab.append(filtros);
      }
      if (resumo) desenharKpis({ resumo, factos: [] }, cab, art);   // "379 clientes em 9 grupos" num cartão

      const mostrar = (_, c) => !fixa[c];
      const cabecalho = t.cabecalho.filter(mostrar);
      const numericas = t.numericas.filter(mostrar);
      const linhas = t.linhas.map(l => l.filter(mostrar));

      const barra = numericas.indexOf(true);
      const maximo = barra < 0 ? 0 : Math.max(...linhas.map(l => paraNumero(l[barra])));
      const tabela = el('table', 'chat-tabela');
      const topo = tabela.createTHead().insertRow();
      cabecalho.forEach((nome, c) => {
        const th = el('th', numericas[c] ? 'chat-num' : '', nome);
        th.scope = 'col';
        topo.append(th);
        if (c === 0 && barra >= 0) { const v = el('th'); v.append(el('span', 'so-leitor', 'Proporção')); topo.append(v); }
      });
      const corpo = tabela.createTBody();
      for (const linha of linhas) {
        const tr = corpo.insertRow();
        linha.forEach((valor, c) => {
          tr.append(el('td', numericas[c] ? 'chat-num' : '', valor));
          if (c === 0 && barra >= 0) {
            const td = el('td'), fundo = el('div', 'chat-barra'), cheio = el('span');
            cheio.style.width = Math.max(3, paraNumero(linha[barra]) / maximo * 100) + '%';
            fundo.setAttribute('aria-hidden', 'true');
            fundo.append(cheio); td.append(fundo); tr.append(td);
          }
        });
      }
      const bloco = el('div', 'chat-bloco');
      bloco.append(tabela);
      if (depois) bloco.append(el('p', 'chat-texto', depois));
      art.append(bloco);
      // Exporta a tabela completa, com as colunas fixas incluídas
      rodapeDados(art, [t.cabecalho, ...t.linhas], titulo);
      return art;
    }

    // "Nenhuma correspondência. … Localidade: FERNAO FERRO (41); Corroios (21); … (mostrados 30 de 101)"
    function lerSemResultado(texto) {
      if (!/nenhuma correspond[êe]ncia/i.test(texto)) return null;
      const m = texto.match(/([A-Za-zÀ-ú][A-Za-zÀ-ú ]*?):\s*[^:()]+\(\d+\)/);   // "Localidade: X (41)"
      if (!m) return null;
      const resto = texto.slice(m.index + m[1].length + 1);
      const opcoes = [...resto.matchAll(/([^;()]+?)\s*\((\d+)\)/g)].map(x => [x[1].trim(), +x[2]]);
      const contagem = texto.match(/mostrados\s+(\d+)\s+de\s+(\d+)/i);
      return { campo: m[1].trim(), opcoes, mostrados: contagem ? +contagem[1] : opcoes.length, total: contagem ? +contagem[2] : 0 };
    }

    function folhaSemResultado(s, pergunta) {
      const art = el('article', 'chat-folha');
      const cab = el('div', 'chat-folha-cab');
      cab.append(el('h2', 'chat-vazio-titulo', `Não encontrei esse valor de ${s.campo.toLowerCase()}`),
                 el('p', 'chat-folha-meta', 'Escolha um dos valores existentes. A pergunta corrigida fica no campo, para rever antes de enviar.'));
      art.append(cab);

      // Palavra da pergunta mais parecida com um valor existente ("Montija" -> "Montijo")
      const palavras = pergunta.split(/\s+/).filter(p => p.length > 3);
      let errada = palavras[palavras.length - 1] || '';
      const parecidas = [];
      for (const p of palavras) {
        for (const o of s.opcoes) {
          if (!parecidas.includes(o) && distancia(semAcento(p), semAcento(o[0])) <= 2) { parecidas.push(o); errada = p; }
        }
      }
      const escolher = nome => { campo.value = errada ? pergunta.replace(errada, nome) : pergunta + ' ' + nome; campo.focus(); };
      const botoes = lista => {
        const d = el('div', 'chat-opcoes');
        lista.forEach(([nome, n]) => {
          const b = botaoEl('chat-chip', nomeProprio(nome), () => escolher(nomeProprio(nome)));
          b.append(el('small', '', String(n)));
          d.append(b);
        });
        return d;
      };
      if (parecidas.length) art.append(el('h3', 'chat-opcoes-titulo', 'Parecidos'), botoes(parecidas));
      const resto = s.opcoes.filter(o => !parecidas.includes(o) && !/^sem dados$/i.test(o[0]));
      art.append(el('h3', 'chat-opcoes-titulo', 'Com mais clientes'), botoes(resto.slice(0, 8)));
      if (resto.length > 8) {
        const mais = el('details', 'chat-mais');
        mais.append(el('summary', 'chat-acao', `Ver mais ${resto.length - 8}`), botoes(resto.slice(8)));
        art.append(mais);
      }
      rodapeDados(art, [[maiuscula(s.campo), 'Clientes'], ...s.opcoes.map(([nome, n]) => [nomeProprio(nome), String(n)])],
                  'valores ' + s.campo, s.total ? `mostrados ${s.mostrados} de ${s.total}` : '');
      return art;
    }

    function formatar(texto, pergunta = '') {
      const s = lerSemResultado(texto);
      if (s) return folhaSemResultado(s, pergunta);
      const t = lerTabela(texto);
      return t ? folhaTabela(t) : folhaLista(lerLista(texto), texto);
    }

    /* =========================================================
       Ecrãs da zona de resposta
       ========================================================= */
    function tema() { return TEMAS.find(t => t.id === temaAtual); }

    function blocoSugestoes(titulo) {
      // só sugere o que ainda não tem resposta (as que deram erro ficam, para tentar de novo)
      const feitas = new Set(historico.filter(h => !h.erro).map(h => h.pergunta.toLowerCase()));
      const restantes = tema().perguntas.filter(p => !feitas.has(p.toLowerCase()));
      const perguntas = restantes.length ? restantes : tema().perguntas;   // todas feitas: volta a sugerir todas
      const sec = el('section', 'chat-sugestoes');
      const lista = el('div');
      perguntas.forEach(p => {
        const b = botaoEl('chat-chip', p, () => { if (!ocupado) perguntar(p); });
        b.disabled = ocupado;
        lista.append(b);
      });
      sec.append(el('h3', '', titulo), lista);
      return sec;
    }

    function mostrarInicio() {
      const intro = el('div', 'chat-intro');
      intro.append(el('h2', '', tema().nome), el('p', '', tema().descricao));
      area.replaceChildren(intro, blocoSugestoes('Perguntas sugeridas'));
      area.scrollTop = 0;
    }

    // A resposta com o avatar à frente (a mesma imagem do estado, já embebida)
    function comAvatar(art) {
      const linha = el('div', 'chat-resposta');
      const avatar = document.getElementById('avatar').cloneNode();
      avatar.removeAttribute('id');
      linha.append(avatar, art);
      return linha;
    }

    function mostrarItem(item) {
      const filhos = [el('p', 'chat-pergunta', item.pergunta)];
      if (item.erro) {
        const art = el('article', 'chat-folha chat-folha--erro');
        art.setAttribute('role', 'alert');
        art.append(el('p', '', item.erro === 'vazio'
          ? 'O agente não devolveu resposta. Tente de novo.'
          : 'Sem ligação ao agente. Confirme que está a correr e tente de novo.'));
        art.append(botaoEl('chat-acao', 'Tentar de novo', () => {
          historico.splice(historico.indexOf(item), 1);
          perguntar(item.pergunta);
        }));
        filhos.push(art);
      } else {
        try {
          filhos.push(formatar(item.texto, item.pergunta));
        } catch (erro) {
          // Se a formatação falhar, mostra o texto tal como veio: o painel nunca fica parado.
          console.error('Falha a formatar a resposta:', erro);
          const art = el('article', 'chat-folha');
          art.append(el('p', 'chat-texto', item.texto.trim()));
          filhos.push(art);
        }
      }
      filhos[1] = comAvatar(filhos[1]);
      filhos.push(blocoSugestoes('Mais sobre ' + tema().nome.toLowerCase()));
      area.replaceChildren(...filhos);
      area.scrollTop = 0;
    }

    function mostrarEspera(pergunta) {
      const art = el('article', 'chat-folha chat-espera');
      const bruto = el('p', 'chat-bruto');
      const esq = el('div', 'chat-esqueleto');
      esq.setAttribute('aria-hidden', 'true');
      esq.append(el('span'), el('span'), el('span'));
      const msg = el('p', '', 'A consultar os dados…');
      // o modelo em CPU pode levar mais de um minuto; o contador mostra que não parou
      const inicio = Date.now();
      const relogio = setInterval(() => {
        msg.textContent = `A consultar os dados… ${Math.round((Date.now() - inicio) / 1000)} s`;
      }, 1000);
      art.append(msg, esq, bruto);
      area.replaceChildren(el('p', 'chat-pergunta', pergunta), comAvatar(art));
      return { bruto, esq, relogio };
    }

    /* ---------- Barra lateral ---------- */
    function desenharTemas() {
      temasEl.replaceChildren(...TEMAS.map(t => {
        const b = botaoEl('chat-tema', t.nome, () => {
          if (ocupado) return;
          temaAtual = t.id; atual = -1;
          desenharTemas(); desenharHistorico(); mostrarInicio();
        });
        b.setAttribute('aria-pressed', String(t.id === temaAtual));
        b.disabled = ocupado;
        return b;
      }));
    }

    function desenharHistorico() {
      histVazio.hidden = historico.length > 0;
      histEl.replaceChildren(...historico.map((item, i) => {
        const li = el('li');
        const b = botaoEl('', '', () => {
          if (ocupado) return;
          atual = i; desenharHistorico(); mostrarItem(item);
        });
        b.append(el('span', '', item.pergunta));
        b.title = item.pergunta;   // texto completo quando cortado a 2 linhas
        if (i === atual) b.setAttribute('aria-current', 'true');
        b.disabled = ocupado;
        li.append(b);
        return li;
      }));
    }

    /* =========================================================
       Perguntar ao agente
       ========================================================= */
    async function perguntar(texto) {
      if (ocupado) return;
      const item = { pergunta: texto, texto: '', erro: null };
      historico.unshift(item);
      atual = 0;
      bloquear(true);
      desenharTemas(); desenharHistorico();
      const { bruto, esq, relogio } = mostrarEspera(texto);
      area.setAttribute('aria-busy', 'true');   // o leitor de ecrã lê a resposta no fim, não aos bocados
      try {
        const r = await fetch('/perguntar', { method: 'POST', body: texto });
        mostrarEstado(r.ok ? 'ocupado' : 'desligado');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const leitor = r.body.getReader();
        const descodificador = new TextDecoder();
        for (;;) {
          const { done, value } = await leitor.read();
          if (done) break;
          item.texto += descodificador.decode(value, { stream: true });
          bruto.textContent = item.texto;   // mostra o texto a chegar, formatado no fim
          esq.hidden = true;
        }
        item.texto += descodificador.decode();
        if (!item.texto.trim()) item.erro = 'vazio';
        mostrarEstado('pronto');
      } catch {
        item.erro = 'ligacao';
        mostrarEstado('desligado');
      } finally {
        clearInterval(relogio);
        bloquear(false);
        if (estadoTexto.textContent === 'A consultar') mostrarEstado('pronto');
        if (historico[atual] === item) mostrarItem(item);
        area.setAttribute('aria-busy', 'false');
        desenharTemas(); desenharHistorico();
        campo.focus();
      }
    }

    /* ---------- Eventos ---------- */
    form.addEventListener('submit', e => {
      e.preventDefault();
      const texto = campo.value.replace(/\s+/g, ' ').trim();
      if (!texto || ocupado) return;
      campo.value = '';
      perguntar(texto);
    });

    desenharTemas();
    desenharHistorico();
    mostrarInicio();
    campo.focus();
  </script>
</body>
