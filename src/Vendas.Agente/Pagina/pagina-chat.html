      const delta = num(comparado[1], /\(([+\-−]?[\d,]+)%\)/);
      const datas = linha1.match(/\((\d{2}-\d{2}-\d{4}) a (\d{2}-\d{2}-\d{4})/);
      const nomePeriodo = (RES_PERIODOS.find(p => p[0] === resumoEstado.periodo) || [])[1] || '';
      const meses = serie ? serie.meses : [];
      const agora = x => x.a === hoje.getFullYear() && x.m === hoje.getMonth() + 1;
      const incompleto = meses.find(x => x.atual != null && (x.parcial || agora(x)));
      const rc = j.clientes ? lerLista(j.clientes) : null;
      const ativos = rc ? num(rc.resumo, /em\s+([\d\s]+?)\s+clientes/) : null;
      const positivos = texto => lerLista(texto || '').itens.filter(i => i.num > 0);
      const subida = itens => itens.filter(i => i.delta > 0).sort((a, b) => b.delta - a.delta)[0];
      const descida = itens => itens.filter(i => i.delta < 0).sort((a, b) => a.delta - b.delta)[0];

      const kpis = [
        { nome: 'Faturação total', valor: total, tipo: 'eur', variacao: delta,
          contexto: delta == null ? 'Sem comparação com o ano anterior.' : `${rDec(Math.abs(delta), 1)}% ${delta >= 0 ? 'acima' : 'abaixo'} do mesmo período de ${anoAnt}.` },
        { nome: 'N.º de documentos', valor: num(rm.resumo, /,\s*([\d\s]+?)\s+documentos/), tipo: 'int', contexto: 'Faturas e talões emitidos no período.' },
        { nome: 'Valor médio por documento', valor: num(facto(rm, /^valor m[ée]dio/i)[1], /^(-?[\d\s.,]+)/), tipo: 'eur2', contexto: 'Valor médio de cada venda.' }
      ];
      if (ativos != null) kpis.push({ nome: 'Clientes ativos', valor: ativos, tipo: 'int', contexto: 'Clientes com compras no período.' });

      // Previsão: tendência linear dos últimos 6 meses completos, 3 meses à frente.
      // shortcut: reta simples + intervalo de ±1,28 desvios (≈80%); trocar por um modelo com sazonalidade se houver vários anos de histórico.
      let previsao = null, semPrevisao = '';
      const completos = meses.filter(x => x.atual != null && !x.parcial && !agora(x));
      if (!['AnoAtual', 'Ultimos12Meses'].includes(resumoEstado.periodo)) semPrevisao = 'A previsão só se calcula para "Este ano" ou "Últimos 12 meses".';
      else if (completos.length < 6) semPrevisao = 'Ainda não há 6 meses completos para prever a faturação.';
      else {
        const ult = completos.slice(-6), ys = ult.map(x => x.atual), my = ys.reduce((s, v) => s + v, 0) / 6;
        const b = ys.reduce((s, y, i) => s + (i - 2.5) * (y - my), 0) / ys.reduce((s, _, i) => s + (i - 2.5) ** 2, 0), a = my - b * 2.5;
        const desvio = Math.sqrt(ys.reduce((s, y, i) => s + (y - (a + b * i)) ** 2, 0) / 4);
        const futuros = [1, 2, 3].map(h => {
          const d = new Date(ult[5].a, ult[5].m - 1 + h, 1), v = Math.max(0, a + b * (5 + h)), e = 1.28 * desvio * Math.sqrt(h);
          return { m: d.getMonth() + 1, v, inf: Math.max(0, v - e), sup: v + e };
        });
        const todos = [...ult, ...futuros];
        previsao = { meses: todos.map(x => MESES[x.m - 1].slice(0, 3)), nomes: todos.map(x => MESES[x.m - 1]), real: ys,
                     previsto: [ys[5], ...futuros.map(f => f.v)], inferior: [ys[5], ...futuros.map(f => f.inf)], superior: [ys[5], ...futuros.map(f => f.sup)] };
      }

      const artigos = positivos(j.artigos);
      const zonas = positivos(j.zonas).filter(i => !/^\(/.test(i.nome));   // "(sem descrição)" não se filtra
      const alertas = rm.avisos.map(a => ({ tipo: 'dados', tag: 'Dados incompletos', texto: maiuscula(a), pergunta: '' }));
      const pa = descida(artigos), pz = descida(zonas);
      if (pa) alertas.push({ tipo: 'artigo', tag: 'Artigo em quebra', texto: `${nomeECodigo(pa)}: ${rVar(pa.delta)} face a ${anoAnt}.`,
                             pergunta: resumoEstado.cliente ? '' : 'Comparar as vendas por artigo com o ano passado' });
      if (pz) alertas.push({ tipo: 'local', tag: 'Zona em quebra', texto: `${nomeProprio(pz.nome)} faturou ${rVar(pz.delta)} face a ${anoAnt}.`,
                             pergunta: `Comparar as vendas da zona ${nomeProprio(pz.nome)} mês a mês com o ano passado` });
      const parados = num(j.semVendas, /^Clientes sem vendas[^:]*:\s*([\d\s]+?)\s+clientes/);
      if (parados) alertas.push({ tipo: 'cliente', tag: 'Clientes sem compras', texto: `${rGrupos(parados)} clientes não compram há 90 dias.`, pergunta: 'Clientes que não compram há 90 dias?' });

      let acumulado = null;
      if (anoAnt && meses.length > 1) {
        let sa = 0, sb = 0;
        const ultimo = meses.findLastIndex(x => x.atual != null);
        acumulado = { anoAtual: serie.anoAtual, anoAnterior: anoAnt, rotulos: meses.map(x => MESES[x.m - 1][0]), nomes: meses.map(x => MESES[x.m - 1].toLowerCase()),
                      atual: meses.slice(0, ultimo + 1).map(x => sa += x.atual || 0), anterior: meses.map(x => sb += x.anterior || 0) };
      }

      return {
        cliente: (linha1.match(/cliente "([^"]+)"/) || [])[1] || null,
        periodoTexto: nomePeriodo + (datas ? ` · ${datas[1]} a ${datas[2]}` : ''),
        mesIncompleto: incompleto ? MESES[incompleto.m - 1] : '',
        anoAnt, total, kpis, previsao, semPrevisao, alertas, acumulado,
        artigos, artigosSobe: subida(artigos), artigosDesce: pa,
        locais: j.zonas ? zonas.map(i => ({ id: i.nome, nome: nomeProprio(i.nome), fat: i.num, variacao: i.delta, media: i.media })) : null,
        locaisSobe: subida(zonas), locaisDesce: pz,
        clientes: j.clientes ? positivos(j.clientes) : null,
        tabela: rm.itens.length ? [['Mês', 'Faturação', anoAnt ? 'Em ' + anoAnt : '', 'Variação (%)', 'Valor médio'],
          ...rm.itens.map(i => [i.nome, i.valor, i.anterior ? i.anterior.valor : '', i.delta == null ? '' : String(i.delta).replace('.', ','), i.media])] : null
      };
    }

    // "▲ MAIOR SUBIDA" / "▼ MAIOR DESCIDA" por baixo de um bloco
    function resDestaques(sobe, desce, anoAnt, nome = i => i.nome) {
      if (!sobe && !desce) return '';
      const caixa = (i, cls, txt) => i ? `<div class="res-destaque"><span class="${cls}">${txt}</span><strong>${rEsc(nome(i))}</strong>${rVar(i.delta)} face a ${rEsc(anoAnt)}</div>` : '';
      return `<div class="res-destaques">${caixa(sobe, 'res-sobe', '▲ MAIOR SUBIDA')}${caixa(desce, 'res-desce', '▼ MAIOR DESCIDA')}</div>`;
    }

    function resumoHtml(D) {
      const htmlKpis = `<div class="res-kpis" data-bloco="kpis">${D.kpis.map(k => `
        <div class="chat-kpi">
          <div class="chat-kpi-cab"><span>${rEsc(k.nome)}</span></div>
          <span class="chat-kpi-valor">${rValorKpi(k)}</span>
          ${k.variacao == null ? '' : `<span class="res-var ${rVarCls(k.variacao)}">${rVar(k.variacao)} vs. ${rEsc(D.anoAnt)}</span>`}
          <span class="chat-kpi-detalhe">${rEsc(k.contexto)}</span>
        </div>`).join('')}</div>`;

      // Previsão
      const P = D.previsao;
      let htmlPrev;
      if (!P) {
        htmlPrev = `<section class="res-cartao res-cartao--largo" data-bloco="prev"><div><h3>Previsão de faturação mensal</h3><p class="res-sub">Tendência dos últimos 6 meses completos</p></div>
          <p class="chat-texto">${rEsc(D.semPrevisao)}</p></section>`;
      } else {
        const { passo, max, min } = rEscala(P.real.concat(P.superior, P.inferior));
        const n = P.meses.length, off = P.real.length - 1;
        const X = i => 40 + i * (920 / (n - 1));
        const Y = v => 15 + (max - v) / (max - min) * 270;
        const pt = (arr, start) => arr.map((v, i) => [X(i + start), Y(v)]);
        const hi = pt(P.superior, off), lo = pt(P.inferior, off);
        const grelha = []; for (let g = Math.ceil(min / passo) * passo; g <= max; g += passo) grelha.push(g);
        const soma = a => a.slice(1).reduce((s, v) => s + v, 0);
        htmlPrev = `<section class="res-cartao res-cartao--largo" data-bloco="prev">
          <div><h3>Previsão de faturação mensal</h3><p class="res-sub">Tendência dos últimos 6 meses completos</p></div>
          <div class="res-legenda">
            <span><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" stroke="#15803D" stroke-width="3"/><circle cx="13" cy="5" r="4" fill="#15803D"/></svg>Vendas</span>
            <span><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" stroke="#4F46E5" stroke-width="3" stroke-dasharray="5 3"/><rect x="9" y="1" width="8" height="8" fill="#fff" stroke="#4F46E5" stroke-width="2" transform="rotate(45 13 5)"/></svg>Previsão</span>
            <span><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" stroke="#8B87F0" stroke-width="2" stroke-dasharray="2 3"/></svg>Limite superior e inferior</span>
          </div>
          <div class="res-grafico" style="height:240px;margin-top:6px">
            ${grelha.map(g => `<span class="res-y" style="top:${Y(g) / 3}%">${rCurto(g)}</span>`).join('')}
            <svg viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
              ${grelha.map(g => `<line x1="0" y1="${Y(g)}" x2="1000" y2="${Y(g)}" stroke="var(--linha)" vector-effect="non-scaling-stroke"/>`).join('')}
              <line x1="${X(off)}" y1="0" x2="${X(off)}" y2="300" stroke="var(--borda-forte)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
              <path d="${rCurva(hi)} ${rCurva(lo.slice().reverse()).replace('M', 'L')} Z" fill="#6366F1" fill-opacity="0.10"/>
              <path d="${rCurva(hi)}" fill="none" stroke="#8B87F0" stroke-width="2" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
              <path d="${rCurva(lo)}" fill="none" stroke="#8B87F0" stroke-width="2" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
              <path d="${rCurva(pt(P.real, 0))}" fill="none" stroke="#15803D" stroke-width="3" vector-effect="non-scaling-stroke"/>
              <path d="${rCurva(pt(P.previsto, off))}" fill="none" stroke="#4F46E5" stroke-width="3" stroke-dasharray="8 5" vector-effect="non-scaling-stroke"/>
            </svg>
            <span class="res-nota" style="position:absolute;top:-4px;left:${X(off) / 10}%;transform:translateX(-50%);background:var(--cartao);padding:0 4px;white-space:nowrap;font-size:11px">Último mês completo</span>
            ${P.real.map((v, i) => `<span class="res-ponto" style="left:${X(i) / 10}%;top:${Y(v) / 3}%;width:11px;height:11px;border-radius:50%;background:#15803D;border:2px solid var(--cartao)"></span>
              <span class="res-rotulo" style="left:${X(i) / 10}%;top:calc(${Y(v) / 3}% - 9px);color:var(--sobe)">${rCurto(v)}</span>`).join('')}
            ${P.previsto.slice(1).map((v, j) => { const i = j + 1 + off; return `<span class="res-ponto" style="left:${X(i) / 10}%;top:${Y(v) / 3}%;width:10px;height:10px;background:var(--cartao);border:2px solid #4F46E5;transform:translate(-50%,-50%) rotate(45deg)"></span>
              <span class="res-rotulo" style="left:${X(i) / 10}%;top:calc(${Y(v) / 3}% - 10px);color:#4F46E5">${rCurto(v)}</span>`; }).join('')}
            ${P.meses.map((m, i) => { const real = i <= off;
              const aria = real ? `${P.nomes[i]}: vendas ${rEur(P.real[i])}` : `${P.nomes[i]}: previsão ${rEur(P.previsto[i - off])}, intervalo provável de ${rEur(P.inferior[i - off])} a ${rEur(P.superior[i - off])}`;
              return `<button type="button" class="res-zona" data-prev="${i}" aria-label="${rEsc(aria)}" style="left:${((X(i) - 46) / 10).toFixed(2)}%;width:9.2%"></button>`; }).join('')}
            <div class="res-tooltip" id="res-tooltip" role="status" hidden></div>
          </div>
          <div class="res-x">${P.meses.map((m, i) => `<span style="left:${X(i) / 10}%;${i > off ? 'font-style:italic;color:#4F46E5' : ''}">${m}</span>`).join('')}</div>
          <p class="chat-destaque"><strong>Até ${P.nomes[n - 1].toLowerCase()}, prevê-se cerca de ${rCurto(soma(P.previsto))}</strong> (entre ${rCurto(soma(P.inferior))} e ${rCurto(soma(P.superior))}).</p>
        </section>`;
      }

      // Precisa de atenção
      const IC = { dados: ['!', 'background:var(--aviso-fundo);color:var(--aviso-texto)'], artigo: ['■', 'background:var(--linha);color:var(--suave)'],
                   local: ['▼', 'background:var(--desce-fundo);color:var(--desce);border-radius:50%'], cliente: ['◷', 'background:var(--selecionado);color:var(--ligacao);border-radius:50%'] };
      const htmlAten = `<section class="res-cartao res-cartao--atencao" data-bloco="aten">
        <div class="res-cab"><h3>Precisa de atenção</h3><span class="res-contagem">${D.alertas.length} ${D.alertas.length === 1 ? 'ponto' : 'pontos'}</span></div>
        ${D.alertas.length ? `<ul class="res-alertas">${D.alertas.map(a => `<li><span class="res-alerta-ic" style="${(IC[a.tipo] || IC.dados)[1]}" aria-hidden="true">${(IC[a.tipo] || IC.dados)[0]}</span>
          <div style="display:flex;flex-direction:column;gap:2px"><span class="res-alerta-tag">${rEsc(a.tag)}</span><span>${rEsc(a.texto)}</span>
          ${a.pergunta ? `<button type="button" class="chat-acao" data-perguntar="${rEsc(a.pergunta)}">Perguntar ao assistente</button>` : ''}</div></li>`).join('')}</ul>`
          : '<p class="res-nota">Nada a assinalar neste período.</p>'}
      </section>`;

      // Artigos mais vendidos (por faturação: a ferramenta devolve o valor e a variação)
      const maxA = D.artigos.length ? Math.max(...D.artigos.map(a => a.num)) : 0;
      const htmlArt = `<section class="res-cartao" data-bloco="art">
        <div class="res-cab"><h3>Artigos mais vendidos</h3><span class="res-sub">Por faturação</span></div>
        ${D.artigos.length ? `<div style="overflow-x:auto"><table class="res-tabela res-tabela--maiusculas" style="min-width:380px"><thead><tr><th scope="col">Artigo</th><th scope="col">Faturação</th><th scope="col">% total</th><th scope="col">${D.anoAnt ? 'vs ' + rEsc(D.anoAnt) : 'Variação'}</th></tr></thead>
          <tbody>${D.artigos.map((a, i) => `<tr><th scope="row">${i + 1}. ${rEsc(a.nome)}${a.codigo ? ` <small style="font-weight:400;color:var(--nota)">${rEsc(a.codigo)}</small>` : ''}<span class="res-pista"><span style="width:${(a.num / maxA * 100).toFixed(1)}%;background:#c2410c"></span></span></th>
            <td class="forte">${rEur(a.num)}</td><td>${D.total > 0 ? rPct(a.num / D.total * 100) : '–'}</td><td class="${rVarCls(a.delta)}">${rVar(a.delta)}</td></tr>`).join('')}</tbody></table></div>`
          : '<p class="res-nota">Sem vendas de artigos neste período.</p>'}
        ${resDestaques(D.artigosSobe, D.artigosDesce, D.anoAnt, nomeECodigo)}
      </section>`;

      // Vendas por zona (barras verticais; clicar filtra o painel). Num cliente não se mostra.
      let htmlLoc = '';
      if (D.locais && D.locais.length) {
        const locais = D.locais, maxL = Math.max(...locais.map(l => l.fat));
        htmlLoc = `<section class="res-cartao" data-bloco="loc">
          <div class="res-cab"><h3>Vendas por zona</h3><span class="res-sub">Clique numa zona para filtrar o painel</span></div>
          <ul class="res-locais">${locais.map(l => `<li style="display:flex"><button type="button" class="res-local" data-zona="${rEsc(l.id)}" aria-pressed="${resumoEstado.zona === l.id}"
              aria-label="${rEsc(`${l.nome}: ${rEur(l.fat)}${D.total > 0 ? ', ' + rPct(l.fat / D.total * 100) + ' do total' : ''}${l.variacao == null ? '' : ', ' + rVar(l.variacao) + ' face a ' + D.anoAnt}. Carregar para filtrar.`)}">
              <span style="font-size:12px;font-weight:700;text-align:center;line-height:1.2">${rCurto(l.fat)}</span>
              <span class="res-local-area"><span class="res-local-barra" style="height:${Math.max(Math.round(l.fat / maxL * 150), 6)}px"></span></span>
              <span style="font-size:13px;font-weight:700;text-align:center;line-height:1.2;max-width:100%;overflow-wrap:anywhere">${rEsc(l.nome)}</span>
              ${D.total > 0 ? `<span style="font-size:11.5px;color:var(--nota);text-align:center">${rPct(l.fat / D.total * 100)}</span>` : ''}
              <span class="${rVarCls(l.variacao)}" style="font-size:12px">${rVar(l.variacao)}</span></button></li>`).join('')}</ul>
          ${resDestaques(D.locaisSobe, D.locaisDesce, D.anoAnt, i => nomeProprio(i.nome))}
          <div style="overflow-x:auto"><table class="res-tabela"><caption style="text-align:left;padding:0 0 4px;font-weight:600">Valor médio por documento</caption>
            <thead><tr>${locais.map(l => `<th scope="col" style="text-align:center">${rEsc(l.nome)}</th>`).join('')}</tr></thead>
            <tbody><tr>${locais.map(l => `<td class="forte" style="text-align:center">${rEsc(l.media || '–')}</td>`).join('')}</tr></tbody></table></div>
        </section>`;
      }

      // Top clientes: o nome abre o resumo desse cliente
      let htmlCli = '';
      if (D.clientes && D.clientes.length) {
        const maxC = Math.max(...D.clientes.map(c => c.num));
        htmlCli = `<section class="res-cartao" data-bloco="cli"><div><h3>Top clientes</h3><p class="res-sub">Carregue num cliente para ver o resumo dele</p></div>
          <ol class="res-clientes">${D.clientes.map((c, i) => `<li><span style="color:var(--nota);text-align:right">${i + 1}</span>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0"><button type="button" class="chat-acao" data-cliente="${rEsc(c.codigo || c.nome)}" title="${rEsc(c.nome)}: ver resumo">${rEsc(c.nome)}${c.codigo ? ` (${rEsc(c.codigo)})` : ''}</button>
            <span class="res-pista" style="max-width:none;margin:0;height:5px"><span style="width:${(c.num / maxC * 100).toFixed(1)}%;background:var(--ligacao)"></span></span></span>
            <strong style="text-align:right">${rEur(c.num)}</strong><span class="${rVarCls(c.delta)}" style="text-align:right;font-size:12.5px">${rVar(c.delta)}</span></li>`).join('')}</ol></section>`;
      }

      // Faturação acumulada vs. ano anterior (os mesmos dias do ano anterior)
      let htmlAcum = '';
      const A = D.acumulado;
      if (A) {
        const n = A.rotulos.length, na = A.atual.length;
        const topo = rEscala([...A.anterior, ...A.atual]).max;
        const BX = i => 20 + i * (960 / Math.max(1, n - 1)), BY = v => 300 - v / topo * 285;
        const linha = arr => arr.map((v, i) => (i ? 'L' : 'M') + BX(i).toFixed(1) + ',' + BY(v).toFixed(1)).join(' ');
        const at = A.atual[na - 1], an = A.anterior[na - 1], dif = at - an;
        htmlAcum = `<section class="res-cartao" data-bloco="acum">
          <div><h3>Faturação acumulada vs. ${A.anoAnterior}</h3><p class="res-sub">Sem objetivo definido: compara com o mesmo período do ano anterior</p></div>
          ${an > 0 ? `<p class="chat-destaque"><strong>Até ${A.nomes[na - 1]}, vai ${rDec(Math.abs(dif / an * 100), 1)}% ${dif >= 0 ? 'à frente de' : 'atrás de'} ${A.anoAnterior}</strong> (${dif >= 0 ? 'mais' : 'menos'} ${rEur(Math.abs(dif))}).</p>` : ''}
          <div class="res-legenda"><span><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--marca)" stroke-width="3"/></svg>${A.anoAtual}</span>
            <span><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--anterior-linha)" stroke-width="2" stroke-dasharray="5 3"/></svg>${A.anoAnterior}</span></div>
          <div class="res-grafico" style="height:200px;margin-left:50px">
            ${[0, topo / 2, topo].map(g => `<span class="res-y" style="left:-50px;width:44px;top:${BY(g) / 3}%">${g ? rCurto(g) : '0'}</span>`).join('')}
            <svg viewBox="0 0 1000 300" preserveAspectRatio="none" role="img" aria-label="${rEsc(`Faturação acumulada: ${A.anoAtual} chega a ${rCurto(at)} em ${A.nomes[na - 1]}; em ${A.anoAnterior}, no mesmo mês, eram ${rCurto(an)}.`)}">
              <line x1="0" y1="${BY(topo / 2)}" x2="1000" y2="${BY(topo / 2)}" stroke="var(--linha)" vector-effect="non-scaling-stroke"/>
              <line x1="0" y1="300" x2="1000" y2="300" stroke="var(--borda-forte)" vector-effect="non-scaling-stroke"/>
              <path d="${linha(A.anterior)}" fill="none" stroke="var(--anterior-linha)" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
              <path d="${linha(A.atual)}" fill="none" stroke="var(--marca)" stroke-width="3" vector-effect="non-scaling-stroke"/>
            </svg>
            <span class="res-rotulo" style="left:${BX(na - 1) / 10}%;top:calc(${BY(at) / 3}% - 6px);transform:translate(6px,-100%);color:var(--texto);background:var(--cartao);padding:0 3px">${A.anoAtual}: ${rCurto(at)}</span>
            <span class="res-rotulo" style="left:${BX(na - 1) / 10}%;top:calc(${BY(an) / 3}% + 20px);transform:translate(6px,-100%);color:var(--suave);background:var(--cartao);padding:0 3px">${A.anoAnterior}: ${rCurto(an)}</span>
          </div>
          <div class="res-x" style="margin-left:50px">${A.rotulos.map((m, i) => `<span style="left:${BX(i) / 10}%;color:var(--nota)">${m}</span>`).join('')}</div>
        </section>`;
      }

      return `${htmlKpis}
        <div class="res-grelha">${htmlPrev}${htmlAten}</div>
        <div class="res-grelha">${htmlArt}${htmlLoc}</div>
        ${htmlCli || htmlAcum ? `<div class="res-grelha">${htmlCli}${htmlAcum}</div>` : ''}`;
    }

    const resChipsPeriodo = () => `<div class="res-chips" role="group" aria-label="Período">${RES_PERIODOS.map(p => `<button type="button" class="res-chip" data-periodo="${p[0]}" aria-pressed="${resumoEstado.periodo === p[0]}">${p[1]}</button>`).join('')}</div>`;
    // Enter ou "Ver": abre o resumo desse cliente; vazio = resumo geral
    const resFormCliente = botao => `<form class="res-cliente"><label class="so-leitor" for="res-cliente">ID ou nome do cliente</label>
      <input id="res-cliente" name="cliente" maxlength="100" autocomplete="off" placeholder="Cliente: ID ou início do nome (opcional)" value="${rEsc(resumoEstado.cliente || '')}">
      <button class="res-btn res-btn--primario">${botao}</button></form>`;

    function barraResumoHtml() {
      const D = resumoEstado.dados || {};
      const periodo = D.periodoTexto || (RES_PERIODOS.find(p => p[0] === resumoEstado.periodo) || [])[1] || '';
      const aberto = resumoEstado.menu === 'filtros';
      const nFiltros = (resumoEstado.zona ? 1 : 0) + (resumoEstado.cliente ? 1 : 0);
      return `<div class="res-barra">
        <div class="res-linha">
          <div class="res-titulo">
            <span class="res-icone" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2v12h12M5 10l3-3 2 2 4-5"/></svg></span>
            <h2>Resumo das vendas${D.cliente ? ' · ' + rEsc(D.cliente) : ''}</h2>
            <div class="res-menu-wrap">
              <button type="button" class="res-btn" data-menu="filtros" aria-expanded="${aberto}" aria-controls="res-menu-filtros">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
                Filtros ${nFiltros ? `<span class="res-contador">${nFiltros}</span>` : ''}</button>
              <div class="res-menu" id="res-menu-filtros" role="dialog" aria-label="Filtros" ${aberto ? '' : 'hidden'}>
                <div><h3>Período</h3>${resChipsPeriodo()}</div>
                ${!resumoEstado.cliente && resumoEstado.zonas.length ? `<div><h3>Zona</h3><div class="res-chips" role="group" aria-label="Zona">${[{ id: '', nome: 'Todas' }].concat(resumoEstado.zonas).map(l => `<button type="button" class="res-chip" data-zona="${rEsc(l.id)}" aria-pressed="${(resumoEstado.zona || '') === l.id}">${rEsc(l.nome)}</button>`).join('')}</div></div>` : ''}
                <div><h3>Cliente</h3>${resFormCliente('Ver')}</div>
                <div class="res-menu-rodape"><button type="button" class="chat-acao" data-limpar>Limpar filtros</button><button type="button" class="res-btn" data-fechar>Fechar</button></div>
              </div>
            </div>
          </div>
          <span class="res-data"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M5 1.5v3M11 1.5v3M2 7h12"/></svg>${rEsc(periodo)}</span>
        </div>
        <div class="res-info">
          ${D.mesIncompleto ? `<span class="res-aviso"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8V8l2.2 1.6"/></svg>${rEsc(D.mesIncompleto)} incompleto</span>` : ''}
          ${resumoEstado.zona ? `<button type="button" class="res-filtro-ativo" data-zona="" aria-label="Remover filtro de zona">Zona: <strong>${rEsc(nomeProprio(resumoEstado.zona))}</strong> ×</button>` : ''}
          ${resumoEstado.cliente ? `<button type="button" class="res-filtro-ativo" data-sem-cliente aria-label="Remover filtro de cliente">Cliente: <strong>${rEsc(D.cliente || resumoEstado.cliente)}</strong> ×</button>` : ''}
          <span>Valores em euros, sem IVA</span>
        </div>
      </div>`;
    }

    function folhaResumo() {
      const raiz = el('article', 'chat-folha chat-folha--painel');
      raiz.style.animation = 'none';   // redesenha a cada clique: sem a animação de entrada, não pisca
      ligarResumo(raiz);
      if (resumoEstado.aCarregar) {
        raiz.innerHTML = barraResumoHtml() + '<div class="res-esqueleto res-conteudo" aria-busy="true"><span style="height:96px"></span><span style="height:280px"></span><span class="so-leitor">A carregar o resumo…</span></div>';
        return raiz;
      }
      const D = resumoEstado.dados;
      if (resumoEstado.erro || !D || D.erro) {
        // Cliente não encontrado ou ambíguo: os candidatos em botões; sem vendas ou sem ligação: a mensagem
        const opcoes = D && D.opcoes || [];
        raiz.innerHTML = barraResumoHtml() + `<div class="chat-painel-vazio res-pedir" role="alert">
          <p class="chat-texto">${rEsc(resumoEstado.erro || (D && D.erro) || 'Sem dados.')}</p>
          ${opcoes.length ? `<div class="res-chips" style="justify-content:center">${opcoes.map(([id, nome]) => `<button type="button" class="res-chip" data-cliente="${rEsc(id)}">${rEsc(nome)} (${rEsc(id)})</button>`).join('')}</div>` : ''}
          ${resumoEstado.erro ? '<button type="button" class="res-btn res-btn--primario" data-repetir style="align-self:center">Tentar de novo</button>' : ''}
        </div>`;
        return raiz;
      }
      raiz.innerHTML = barraResumoHtml() + '<div class="res-conteudo">' + resumoHtml(D) + '</div>';
      // Copiar e Exportar CSV: os mesmos botões das outras respostas (faturação por mês)
      rodapeDados(raiz.querySelector('.res-conteudo'), D.tabela, 'resumo das vendas' + (D.cliente ? ' ' + D.cliente : ''));
      ligarPrevisao(raiz, D.previsao);
      return raiz;
    }

    function ligarResumo(raiz) {
      const redesenhar = () => painelEl.replaceChildren(folhaResumo());
      raiz.addEventListener('submit', e => {
        e.preventDefault();
        pedirResumo(null, String(new FormData(e.target).get('cliente') || '').replace(/\s+/g, ' ').trim());
      });
      raiz.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const d = b.dataset;
        if (d.menu) { resumoEstado.menu = resumoEstado.menu === d.menu ? null : d.menu; redesenhar(); painelEl.querySelector(`[data-menu="${d.menu}"]`)?.focus(); return; }
        if ('fechar' in d) { resumoEstado.menu = null; redesenhar(); painelEl.querySelector('[data-menu]')?.focus(); return; }
        if (d.periodo) {
          resumoEstado.periodo = d.periodo;
          if (resumoEstado.pedido) carregarResumo();
          else { redesenhar(); painelEl.querySelector(`[data-periodo="${d.periodo}"]`)?.focus(); }
          return;
        }
        if ('zona' in d) { resumoEstado.zona = !d.zona || d.zona === resumoEstado.zona ? null : d.zona; carregarResumo(); return; }
        if (d.cliente) { pedirResumo(null, d.cliente); return; }
        if ('semCliente' in d) { pedirResumo(null); return; }
        if ('repetir' in d) { carregarResumo(); return; }
        if ('limpar' in d) { Object.assign(resumoEstado, { zona: null, cliente: null, periodo: 'AnoAtual' }); carregarResumo(); return; }
        if (d.perguntar) { verConversa(true); prepararPergunta(d.perguntar); }
      });
    }

    // Tooltip da previsão: rato e teclado
    function ligarPrevisao(raiz, P) {
      const tip = raiz.querySelector('#res-tooltip');
      if (!P || !tip) return;
      raiz.querySelectorAll('[data-prev]').forEach(z => {
        const mostrar = () => {
          const i = +z.dataset.prev, off = P.real.length - 1, real = i <= off;
          tip.style.left = Math.min(Math.max(parseFloat(z.style.left) + 4.6, 14), 80) + '%';
          tip.innerHTML = `<strong>${P.nomes[i]}</strong><span>${real ? 'Vendas: ' + rEur(P.real[i]) : 'Previsão: ' + rEur(P.previsto[i - off])}</span>
            <span style="color:var(--nota)">${real ? (i === off ? 'Último mês completo' : 'Valor real') : 'Intervalo provável: ' + rEur(P.inferior[i - off]) + ' a ' + rEur(P.superior[i - off])}</span>`;
          tip.hidden = false;
        };
        z.addEventListener('mouseenter', mostrar); z.addEventListener('focus', mostrar);
        z.addEventListener('mouseleave', () => { tip.hidden = true; }); z.addEventListener('blur', () => { tip.hidden = true; });
      });
    }

    // Esc fecha o menu do Resumo
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && resumoEstado.menu && vistaResumo) {
        resumoEstado.menu = null; painelEl.replaceChildren(folhaResumo());
        painelEl.querySelector('[data-menu]')?.focus();
      }
    });

    // Desenha a resposta uma só vez; a conversa e o painel usam o mesmo resultado
    function desenharResposta(item) {
      if (item.art) return item.art;
      try {
        item.art = formatar(item.texto, item.pergunta);
      } catch (erro) {
        // Se a formatação falhar, mostra o texto tal como veio: o painel nunca fica parado.
        console.error('Falha a formatar a resposta:', erro);
        item.art = el('article', 'chat-folha');
        item.art.append(el('p', 'chat-texto', item.texto.trim()));
      }
      // Com números (cartões, lista, tabela, gráfico, ficha) vai para o painel; texto e "não encontrei" ficam na conversa
      item.noPainel = !!item.art.querySelector('.chat-kpis, .chat-folha-total, .chat-rank, .chat-circulo, .chat-lista, .chat-tabela, .chat-grafico, .chat-ficha');
      return item.art;
    }
    const tituloDaResposta = item => ((item.art && item.art.querySelector('.chat-folha-titulo')) || {}).textContent || item.pergunta;
    // Frase curta para a conversa: o destaque, ou o título e o valor principal
    function resumoDaResposta(art) {
      const texto = s => (art.querySelector(s) || {}).textContent || '';
      if (texto('.chat-destaque')) return texto('.chat-destaque');
      const titulo = texto('.chat-folha-titulo'), valor = texto('.chat-folha-total') || texto('.chat-kpi-valor');
      if (titulo && valor) return `${titulo}: ${valor}.`;
      return titulo ? titulo + '.' : 'Os dados estão no painel.';
    }

    // O que o assistente diz na conversa: o erro, a resposta sem dados, ou uma frase e o cartão do resultado
    function mensagemAgente(item) {
      if (item.erro) {
        const art = el('article', 'chat-folha chat-folha--erro');
        art.setAttribute('role', 'alert');
        art.append(el('p', '', item.erro === 'vazio' ? 'O agente não devolveu resposta. Tente de novo.'
          : item.erro === 'parado' ? 'Parou a resposta antes de terminar.'
          : 'Sem ligação ao agente. Confirme que está a correr e tente de novo.'));
        art.append(botaoEl('chat-acao', 'Tentar de novo', () => {
          historico.splice(historico.indexOf(item), 1);
          perguntar(item.pergunta);
        }));
        return art;
      }
      // Pedido de resumo: frase curta e o cartão, que volta a abrir este resumo
      if (item.resumo) {
        const pr = item.resumo, aberto = vistaResumo && resumoEstado.pedido && resumoEstado.periodo === pr.periodo && resumoEstado.cliente === pr.cliente;
        const bolha = el('article', 'chat-folha');
        bolha.append(el('p', 'chat-texto', item.texto));
        const cartao = botaoEl('chat-cartao', '', () => pedirResumo(pr.periodo, pr.cliente));
        if (aberto) cartao.setAttribute('aria-current', 'true');
        const textos = el('span', 'chat-cartao-texto');
        textos.append(el('b', '', 'Resumo das vendas' + (pr.cliente ? ' · cliente ' + pr.cliente : '')), el('small', '', aberto ? 'Aberto no painel' : 'Abrir no painel'));
        cartao.append(icone('M3 13V8M8 13V3M13 13V6', 18), textos);
        bolha.append(cartao);
        return bolha;
      }
      const art = desenharResposta(item);
      if (!item.noPainel) return art;
      const bolha = el('article', 'chat-folha');
      bolha.append(el('p', 'chat-texto', resumoDaResposta(art)));
      const cartao = botaoEl('chat-cartao', '', () => abrirAba(item));
      if (item === abaAtiva) cartao.setAttribute('aria-current', 'true');
      const textos = el('span', 'chat-cartao-texto');
      textos.append(el('b', '', tituloDaResposta(item)), el('small', '', item === abaAtiva ? 'Aberto no painel' : 'Abrir no painel'));
      cartao.append(icone('M3 13V8M8 13V3M13 13V6', 18), textos);
      bolha.append(cartao);
      return bolha;
    }

    // Balão do assistente que sugere o Resumo; o botão passa por perguntar(), por isso fica a pergunta e a resposta na conversa
    function balaoResumo(periodo) {
      const art = el('article', 'chat-folha');
      const pergunta = `Resumo das vendas ${periodo}`;
      const b = botaoEl('chat-chip', `Ver o resumo das vendas ${periodo}`, () => { if (!ocupado) perguntar(pergunta); });
      b.disabled = ocupado;
      art.append(el('p', 'chat-texto', 'Também posso abrir o resumo das vendas no painel: indicadores, previsão e o que precisa de atenção.'), b);
      return art;
    }

    // A conversa inteira, da primeira pergunta à última; feedback e sugestões só na última resposta
    function desenharConversa() {
      const filhos = [];
      if (!historico.length) {
        // Boas-vindas num balão do assistente: olá, como usar e o tema escolhido
        const intro = el('article', 'chat-folha chat-intro');
        intro.append(el('p', 'chat-intro-ola', 'Olá! Sou o assistente de vendas.'),
                     el('p', 'chat-texto', 'Escolha um tema e carregue numa pergunta, ou escreva a sua em baixo. Os números aparecem no painel de dados.'),
                     el('p', 'chat-texto', `${tema().nome}: ${tema().descricao.charAt(0).toLowerCase() + tema().descricao.slice(1)}`));
        filhos.push(comAvatar(intro), blocoSugestoes('Perguntas sugeridas'));
      }
      const lista = [...historico].reverse();   // o histórico guarda a mais recente primeiro
      lista.forEach((item, k) => {
        filhos.push(mensagemEu(item.pergunta, item.hora, [
          botaoEl('chat-acao', 'Editar', () => prepararPergunta(item.pergunta)),
          botaoEl('chat-acao', 'Repetir', () => { if (!ocupado) perguntar(item.pergunta); })]));
        if (item.pendente) return;                // a espera é desenhada por mostrarEspera
        filhos.push(comAvatar(mensagemAgente(item), item.horaResposta));
        if (k === lista.length - 1 && !item.erro) {
          if (!item.resumo) filhos.push(blocoFeedback(item));   // o resumo não vem do agente: não há resposta a avaliar
          // Depois de a conversa começar, o assistente sugere o Resumo num balão, enquanto ainda não foi aberto
          if (!item.resumo && !resumoEstado.pedido) filhos.push(comAvatar(balaoResumo((item.art && item.art.periodoResumo) || 'deste ano')));
          const seguintes = (item.art && item.art.sugestoes) || [];
          filhos.push(seguintes.length ? blocoSeguintes(seguintes) : blocoSugestoes('Mais sobre ' + tema().nome.toLowerCase()));
        }
      });
      area.replaceChildren(...filhos);
      area.scrollTop = area.scrollHeight;
      atualizarBalao();   // a conversa começou: o balão flutuante pode aparecer
    }

    // Separadores e o resultado aberto
    function desenharPainel() {
      // Separador "Resumo": só existe depois de o resumo ser pedido, e fecha-se como os outros
      const sepResumo = [];
      if (resumoEstado.pedido) {
        const abaResumo = el('div', 'chat-aba' + (vistaResumo ? ' chat-aba--ativa' : ''));
        const abrirResumoBtn = botaoEl('chat-aba-abrir', 'Resumo', () => { vistaResumo = true; abaAtiva = null; desenharPainel(); desenharConversa(); });
        if (vistaResumo) abrirResumoBtn.setAttribute('aria-current', 'true');
        const fecharResumoBtn = botaoEl('chat-aba-fechar', '×', fecharResumo);
        fecharResumoBtn.setAttribute('aria-label', 'Fechar Resumo');
        abaResumo.append(abrirResumoBtn, fecharResumoBtn);
        sepResumo.push(abaResumo);
      }
      separadoresEl.replaceChildren(...sepResumo, ...abas.map(item => {
        const sep = el('div', 'chat-aba' + (item === abaAtiva ? ' chat-aba--ativa' : ''));
        const abrir = botaoEl('chat-aba-abrir', tituloDaResposta(item), () => abrirAba(item));
        abrir.title = tituloDaResposta(item);
        if (item === abaAtiva) abrir.setAttribute('aria-current', 'true');
        const fechar = botaoEl('chat-aba-fechar', '×', () => fecharAba(item));
        fechar.setAttribute('aria-label', 'Fechar ' + tituloDaResposta(item));
        sep.append(abrir, fechar);
        return sep;
      }));
      if (historico.some(h => h.pendente)) {
        const esq = el('div', 'chat-painel-esqueleto');
        const cartoes = el('div', 'chat-esq-cartoes'), grafico = el('div', 'chat-esq-grafico');
        for (let i = 0; i < 3; i++) cartoes.append(el('span', 'chat-esq-cartao'));
        [55, 80, 40, 95, 65, 75, 50].forEach(h => { const b = el('span'); b.style.height = h + '%'; grafico.append(b); });
        const formas = [el('span', 'chat-esq-linha'), el('span', 'chat-esq-linha chat-esq-linha--curta'), cartoes, grafico];
        formas.forEach(f => f.setAttribute('aria-hidden', 'true'));   // só decoração; o leitor de ecrã ouve o texto escondido
        esq.append(el('span', 'so-leitor', 'A preparar os dados…'), ...formas);
        painelEl.replaceChildren(esq);
      } else if (resumoEstado.pedido && (vistaResumo || !abaAtiva)) {
        vistaResumo = true;
        painelEl.replaceChildren(folhaResumo());
      } else if (abaAtiva) {
        painelEl.replaceChildren(abaAtiva.art);
      } else {
        const vazio = el('div', 'chat-painel-vazio');
        vazio.append(el('h2', '', 'Os dados aparecem aqui'),
                     el('p', '', 'Faça uma pergunta na conversa. Cada resposta com números abre num separador, para comparar e voltar atrás.'));
        painelEl.replaceChildren(vazio);
      }
      painelEl.scrollTop = 0;
      atualizarBalao();
    }
    // Fechar o Resumo: tira o separador e os dados (voltam a carregar se for pedido outra vez)
    function fecharResumo() {
      pedidosResumo++;   // uma resposta ainda a caminho já não conta
      Object.assign(resumoEstado, { pedido: false, aCarregar: false, dados: null, erro: null, menu: null });
      vistaResumo = false;
      abaAtiva = abaAtiva || abas[abas.length - 1] || null;
      desenharPainel();
      desenharConversa();
    }
    function abrirAba(item) {
      if (!abas.includes(item)) {
        abas.push(item);
        if (abas.length > 6) abas.shift();      // shortcut: só os 6 mais recentes; os outros reabrem pelo cartão na conversa
      }
      abaAtiva = item;
      vistaResumo = false;
      desenharPainel();
      desenharConversa();
    }
    function fecharAba(item) {
      abas.splice(abas.indexOf(item), 1);
      if (abaAtiva === item) abaAtiva = abas[abas.length - 1] || null;
      desenharPainel();
      desenharConversa();
    }
    // Resposta nova: com dados abre um separador; sem dados fica só na conversa
    function mostrarResposta(item) {
      if (!item.erro) desenharResposta(item);
      if (!item.erro && item.noPainel) abrirAba(item);
      else desenharConversa();
    }

    // Mostrar ou esconder a janela da conversa; o botão redondo diz sempre o que vai fazer
    const lancador = document.getElementById('mostrar-conversa');
    function verConversa(sim) {
      painelRaiz.classList.toggle('chat-painel--sem-conversa', !sim);
      lancador.setAttribute('aria-expanded', String(sim));
      lancador.setAttribute('aria-label', sim ? 'Esconder a conversa' : 'Mostrar a conversa');
      atualizarBalao();
      (sim ? campo : lancador).focus();
    }
    document.getElementById('esconder-conversa').addEventListener('click', () => verConversa(false));
    lancador.addEventListener('click', () => verConversa(painelRaiz.classList.contains('chat-painel--sem-conversa')));

    // Balão flutuante "Faça um resumo das vendas": só depois de a conversa começar, com a conversa escondida
    // (aberta, há o balão dentro da conversa), enquanto o Resumo não está aberto e até a pessoa o fechar no ×.
    const balaoResumoEl = document.getElementById('balao-resumo');
    let balaoDispensado = false;
    function atualizarBalao() {
      balaoResumoEl.hidden = balaoDispensado || !historico.length || resumoEstado.pedido || !painelRaiz.classList.contains('chat-painel--sem-conversa');
    }
    document.getElementById('balao-resumo-abrir').addEventListener('click', () => { if (!ocupado) perguntar('Resumo das vendas deste ano'); });
    document.getElementById('balao-resumo-fechar').addEventListener('click', () => { balaoDispensado = true; atualizarBalao(); lancador.focus(); });

    // REDESIGN 11/2026: voltar ao topo do painel
    const voltarTopo = document.getElementById('voltar-topo');
    painelEl.addEventListener('scroll', () => { voltarTopo.hidden = painelEl.scrollTop < 300; });
    voltarTopo.addEventListener('click', () => { painelEl.scrollTo({ top: 0, behavior: 'smooth' }); voltarTopo.hidden = true; separadoresEl.querySelector('button')?.focus(); });

    function mostrarInicio() {
      desenharConversa();
      desenharPainel();
    }

    // Mostra uma resposta já guardada (também usado para testar na consola)
    function mostrarItem(item) {
      if (!historico.includes(item)) historico.unshift(item);
      mostrarResposta(item);
    }

    function mostrarEspera(pergunta, parar) {
      const art = el('article', 'chat-folha chat-espera');
      const esq = el('div', 'chat-esqueleto');
      esq.setAttribute('aria-hidden', 'true');
      esq.append(el('span'), el('span'), el('span'));
      // Quando a resposta começa a chegar: só três pontos, o texto em bruto não se mostra (é formatado no fim)
      const pontos = el('p', 'chat-pontos');
      pontos.setAttribute('aria-hidden', 'true');
      pontos.append(el('span'), el('span'), el('span'));
      pontos.hidden = true;
      const msg = el('p', '', 'A consultar…');
      // o modelo em CPU pode levar mais de um minuto; o contador mostra que não parou
      const inicio = Date.now();
      const relogio = setInterval(() => {
        msg.textContent = `A consultar… ${Math.round((Date.now() - inicio) / 1000)} s`;
      }, 1000);
      art.append(msg, esq, pontos, botaoEl('chat-acao', 'Parar', parar));
      desenharConversa();                          // a pergunta já aparece na conversa
      area.append(comAvatar(art));
      area.scrollTop = area.scrollHeight;
      // Chamada no 1.º bocado da resposta: para o relógio e troca a mensagem pelos pontos
      const aChegar = () => { clearInterval(relogio); msg.hidden = true; esq.hidden = true; pontos.hidden = false; };
      return { aChegar, relogio };
    }

    /* ---------- Barra lateral ---------- */
    function desenharTemas() {
      temasEl.replaceChildren(...TEMAS.map(t => {
        const b = botaoEl('chat-tema', t.nome, () => {
          if (ocupado) return;
          temaAtual = t.id; atual = -1;
          desenharTemas(); desenharHistorico(); mostrarInicio();
        });
        b.setAttribute('aria-pressed', String(t.id === temaAtual));
        b.disabled = ocupado;
        return b;
      }));
    }

    // O histórico passou a ser a própria conversa (e os separadores do painel)
    function desenharHistorico() {}

    /* =========================================================
       Perguntar ao agente
       ========================================================= */
    async function perguntar(texto) {
      if (ocupado) return;
      // Pedido de resumo: abre o Resumo em vez de chamar o agente (instantâneo, números diretos do SQL)
      const pedidoResumo = intencaoResumo(texto);
      if (pedidoResumo) { responderComResumo(texto, pedidoResumo); return; }
      const item = { pergunta: texto, texto: '', erro: null, hora: new Date(), pendente: true };
      historico.unshift(item);
      atual = 0;
      bloquear(true);
      desenharTemas(); desenharHistorico();
      const controlo = new AbortController();   // "Parar" cancela o pedido
      const { aChegar, relogio } = mostrarEspera(texto, () => controlo.abort());
      desenharPainel();                         // esqueleto no painel até a resposta chegar
      area.setAttribute('aria-busy', 'true');   // o leitor de ecrã lê a resposta no fim, não aos bocados
      try {
        const r = await fetch('/perguntar', { method: 'POST', body: texto, signal: controlo.signal });
        mostrarEstado(r.ok ? 'ocupado' : 'desligado');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const leitor = r.body.getReader();
        const descodificador = new TextDecoder();
        for (;;) {
          const { done, value } = await leitor.read();
          if (done) break;
          item.texto += descodificador.decode(value, { stream: true });
          aChegar();
        }
        item.texto += descodificador.decode();
        if (!item.texto.trim()) item.erro = 'vazio';
        mostrarEstado('pronto');
      } catch (e) {
        item.erro = e.name === 'AbortError' ? 'parado' : 'ligacao';
        mostrarEstado(item.erro === 'parado' ? 'pronto' : 'desligado');
      } finally {
        clearInterval(relogio);
        bloquear(false);
        if (estadoTexto.textContent === 'A consultar') mostrarEstado('pronto');
        item.horaResposta = new Date();
        item.pendente = false;
        desenharPainel();                       // tira o esqueleto (sem dados ou com erro volta ao que estava)
        mostrarResposta(item);
        anunciar(item.erro ? 'A resposta falhou.' : 'Resposta pronta.');
        area.setAttribute('aria-busy', 'false');
        desenharTemas(); desenharHistorico();
        campo.focus();
      }
    }

    /* ---------- Eventos ---------- */
    form.addEventListener('submit', e => {
      e.preventDefault();
      const texto = campo.value.replace(/\s+/g, ' ').trim();
      if (!texto || ocupado) return;
      campo.value = '';
      perguntar(texto);
    });

    desenharTemas();
    desenharHistorico();
    mostrarInicio();
    campo.focus();
  </script>
</body>
</html>
