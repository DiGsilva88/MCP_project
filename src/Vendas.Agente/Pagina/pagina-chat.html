        // "Clientes por Zona" -> clientes-por-zona-2026-10-28.csv
        const nome = semAcento(titulo || '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'vendas';
        const a = el('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = `${nome}-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        anunciar('Ficheiro CSV descarregado.');
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);   // revogar logo pode cancelar o download
      });
    }

        /* ---------- Gráficos como imagem (PNG) ---------- */
    // Cores fixas e claras: a imagem vai para Word, PowerPoint ou email, que têm fundo branco
    const COR = { marca: '#1d46c0', texto: '#16213a', nota: '#566179', grelha: '#e3e8f1', pista: '#e6ebf5', anterior: '#7f93cc' };
    const fonte = (tamanho, peso = 400) => `${peso} ${tamanho}px system-ui, "Segoe UI", Arial, sans-serif`;
    // Corta o texto com "…" para caber na largura
    function cortar(g, texto, largura) {
      if (g.measureText(texto).width <= largura) return texto;
      while (texto.length > 1 && g.measureText(texto + '…').width > largura) texto = texto.slice(0, -1);
      return texto + '…';
    }
    // Canvas com fundo branco, título e período; a escala 2 dá uma imagem nítida no Word
    function novaTela(largura, altura, titulo, subtitulo) {
      const cv = document.createElement('canvas');
      cv.width = largura * 2; cv.height = altura * 2;
      const g = cv.getContext('2d');
      g.scale(2, 2);
      g.fillStyle = '#fff'; g.fillRect(0, 0, largura, altura);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillStyle = COR.texto; g.font = fonte(16, 700); g.fillText(titulo || 'Vendas', 24, 30);
      if (subtitulo) { g.fillStyle = COR.nota; g.font = fonte(12); g.fillText(subtitulo, 24, 48); }
      return { cv, g };
    }

    // Evolução por mês: os mesmos meses e valores do gráfico do ecrã
    function pngSerie(s, titulo, subtitulo) {
      const L = 960, A = 420, m = { t: 72, r: 24, b: 36, l: 80 };
      const { cv, g } = novaTela(L, A, titulo, subtitulo);
      const max = Math.max(...s.meses.flatMap(x => [x.atual, x.anterior]).filter(v => v > 0));
      const passo = Math.pow(10, Math.floor(Math.log10(max))) / 2;
      const topo = Math.ceil(max / passo) * passo;
      const w = L - m.l - m.r, h = A - m.t - m.b, n = s.meses.length;
      const X = i => m.l + (i + 0.5) / n * w;
      const Y = v => m.t + h - v / topo * h;

      // Legenda, em texto, no canto
      const legenda = [String(s.anoAtual), s.anoAnt ? s.anoAnt + ' (tracejado)' : '', s.meses.some(x => x.parcial) ? 'ponto vazio = mês incompleto' : ''];
      g.textAlign = 'right'; g.fillStyle = COR.nota; g.font = fonte(12);
      g.fillText(legenda.filter(Boolean).join(' · '), L - m.r, 30);

      // Grelha e eixos
      g.textBaseline = 'middle'; g.lineWidth = 1;
      [0, topo / 2, topo].forEach(v => {
        g.strokeStyle = COR.grelha; g.beginPath(); g.moveTo(m.l, Y(v)); g.lineTo(L - m.r, Y(v)); g.stroke();
        g.fillStyle = COR.nota; g.fillText(v ? milhares(v) : '0', m.l - 10, Y(v));
      });
      g.textAlign = 'center'; g.textBaseline = 'top';
      s.meses.forEach((x, i) => g.fillText(MESES[x.m - 1].slice(0, 3).toLowerCase(), X(i), A - m.b + 10));

      // Linhas: ano anterior tracejado, ano atual a cheio só nos meses completos
      const linha = (pontos, cor, tracejado) => {
        if (pontos.length < 2) return;
        g.strokeStyle = cor; g.lineWidth = 2.5; g.lineJoin = 'round'; g.setLineDash(tracejado ? [6, 5] : []);
        g.beginPath(); pontos.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
        g.setLineDash([]);
      };
      linha(s.meses.map((x, i) => x.anterior != null ? [X(i), Y(x.anterior)] : null).filter(Boolean), COR.anterior, true);
      linha(s.meses.map((x, i) => x.atual != null && !x.parcial ? [X(i), Y(x.atual)] : null).filter(Boolean), COR.marca, false);
      s.meses.forEach((x, i) => {
        if (x.atual == null) return;
        g.beginPath(); g.arc(X(i), Y(x.atual), 4.5, 0, 2 * Math.PI);
        g.fillStyle = x.parcial ? '#fff' : COR.marca; g.fill();
        g.strokeStyle = COR.marca; g.lineWidth = 2; g.stroke();
      });

      // Valor só no melhor mês, para não amontoar números
      const comDados = s.meses.filter(x => x.atual != null && !x.parcial);
      if (comDados.length) {
        const melhor = comDados.reduce((a, b) => b.atual > a.atual ? b : a);
        const i = s.meses.indexOf(melhor);
        g.fillStyle = COR.texto; g.font = fonte(12, 600); g.textAlign = 'center'; g.textBaseline = 'bottom';
        g.fillText(euros(melhor.atual), X(i), Y(melhor.atual) - 10);
      }
      return cv;
    }

    // Ranking: posição e nome | barra | valor e %
    function pngRanking(itens, titulo, subtitulo) {
      const L = 960, alturaLinha = 32, m = { t: 72, r: 24, b: 24, l: 24 };
      const A = m.t + itens.length * alturaLinha + m.b;
      const { cv, g } = novaTela(L, A, titulo, subtitulo);
      const max = Math.max(...itens.map(i => i.num));
      const xBarra = m.l + 280, xValor = L - m.r, wBarra = xValor - 170 - xBarra;
      g.textBaseline = 'middle';
      itens.forEach((it, k) => {
        const y = m.t + k * alturaLinha + alturaLinha / 2;
        const nome = (it.pos ? it.pos + '. ' : '') + it.nome + (it.codigo ? ' (' + it.codigo + ')' : '');
        g.textAlign = 'left'; g.fillStyle = COR.texto; g.font = fonte(13);
        g.fillText(cortar(g, nome, 260), m.l, y);
        g.fillStyle = COR.pista; g.fillRect(xBarra, y - 6, wBarra, 12);
        g.fillStyle = COR.marca; g.fillRect(xBarra, y - 6, Math.max(2, it.num / max * wBarra), 12);
        g.textAlign = 'right'; g.fillStyle = COR.texto; g.font = fonte(13, 600);
        g.fillText(it.valor, xValor - (it.pct ? 56 : 0), y);
        if (it.pct) { g.fillStyle = COR.nota; g.font = fonte(12); g.fillText(it.pct, xValor, y); }
      });
      return cv;
    }

    function botaoImagem(desenhar, titulo) {
      return botaoEl('chat-acao', 'Guardar imagem', () => {
        desenhar().toBlob(blob => {
          const nome = semAcento(titulo || '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'grafico';
          const a = el('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${nome}-${new Date().toISOString().slice(0, 10)}.png`;
          a.click();
          anunciar('Imagem guardada.');
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }, 'image/png');
      });
    }

    // Rodapé de qualquer resposta com dados: Copiar, Exportar CSV e quantas linhas vão
    function rodapeDados(art, linhas, titulo, nota, imagem) {
      const rod = el('div', 'chat-folha-rodape');
      const tabela = linhas && linhas.length > 1 ? semColunasVazias(linhas) : null;
      const n = tabela ? tabela.length - 1 : 0;
      if (tabela) rod.append(botaoCopiar(tabela), botaoExportar(tabela, titulo));
      if (imagem) rod.append(botaoImagem(imagem, titulo));   // só quando há gráfico
      const meta = [n ? `${n} ${n === 1 ? 'linha' : 'linhas'}` : '', nota || ''].filter(Boolean).join(' · ');
      if (meta) rod.append(el('p', 'chat-folha-meta', meta));
      if (rod.childNodes.length) art.append(rod);
    }


    /* ---------- Números, variações e meses ---------- */
    const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const ICONES = {
      total: 'M11.5 4.2A4.8 4.8 0 1 0 11.5 11.8M2.5 6.8h6.5M2.5 9.2h6.5',
      recibo: 'M3.5 1.8h9v12.4l-2.2-1.4-2.3 1.4-2.3-1.4-2.2 1.4V1.8ZM6 5.5h4M6 8.5h4',
      subida: 'M2 12.5 6 8l3 3 5-6M10.5 5H14v3.5',
      barras: 'M3 13V8M8 13V3M13 13V6'
    };
    const euros = n => Math.round(n).toLocaleString('pt-PT') + ' €';   // sem cêntimos: lê-se melhor
    const milhares = n => n >= 1e6 ? (n / 1e6).toLocaleString('pt-PT', { maximumFractionDigits: 1 }) + ' M €' : Math.round(n / 1000) + ' mil €';
    const textoDelta = d => (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1).replace('.', ',') + '%';
    function chipDelta(d, sufixo = '') {
      const c = el('span', 'chat-delta ' + (d >= 0 ? 'chat-delta--sobe' : 'chat-delta--desce'));
      c.append(icone(d >= 0 ? 'M2 12 6.5 7.5l3 3L14 5M10 5h4v4' : 'M2 4l4.5 4.5 3-3L14 11M10 11h4V7', 12), textoDelta(d) + sufixo);
      return c;
    }

    // Resumo e factos -> cartões (Total, Valor médio, Melhor mês…)
    function desenharKpis(r, cab, art) {
      const cartoes = [], ficha = [];
      let resumoTexto = '';
      if (r.resumo) {
        const [principal, ...resto] = r.resumo.split(/\.\s+(?=\S)/);
        if (resto.length) cab.append(el('p', 'chat-folha-meta', resto.join('. ')));
        const m = semPonto(principal).match(/^(?:total\s+)?(-?\d[\d\s.\u00a0\u202f]*(?:,\d+)?\s*€)\s*(.*)$/i);
        if (m) cartoes.push({ rotulo: 'Total', valor: euros(paraNumero(m[1])), detalhe: maiuscula(m[2].replace(/^em\s+/i, '')), icone: ICONES.total });
        else if (/^\d/.test(principal)) {
          // "379 clientes em 9 grupos": "379 clientes" no valor, "9 grupos" por baixo, para caber numa linha
          const [, valor, detalhe] = semPonto(principal).match(/^([\d\s.]*\d\s+\S+)\s*(?:em\s+)?(.*)$/) || [, semPonto(principal), ''];
          cartoes.push({ rotulo: 'Total', valor, detalhe: maiuscula(detalhe), icone: ICONES.barras });
        }
        else resumoTexto = maiuscula(semPonto(principal));
      }
      // Um número com, no máximo, uma palavra ou € ou %: "1 cliente", "58,54 €", "0,0%"
      const eNumeroCurto = v => /^[-−+]?[\d\s.,  ]+\s*(€|%|\p{L}+)?$/u.test(v);
      for (const [k, v] of r.factos) {
        if (/^lista completa/i.test(k)) continue;   // não acrescenta informação
        const c = k.match(/^comparado com\s.*?(\d{4})$/i);
        const p = v.match(/\(([+\-−]?[\d.,]+)\s*%\)/);
        if (c && p && cartoes[0] && cartoes[0].rotulo === 'Total') {
          cartoes[0].delta = parseFloat(p[1].replace('−', '-').replace(',', '.'));
          cartoes[0].vs = 'vs ' + c[1];
          continue;
        }
        const mes = v.match(/^(\d{4})-(\d{2})\s+[–-]\s+(.+)$/);   // "2026-07 – 278 519,07 €"
        // "10 130,5 unidades (268 120,74 €)" (em quantidade): fica tal como vem, não é um valor em euros
        if (mes) { cartoes.push({ rotulo: k, valor: MESES[+mes[2] - 1], detalhe: /unidades/.test(mes[3]) ? mes[3] : euros(paraNumero(mes[3])), icone: ICONES.subida }); continue; }
        // Texto (nome do cliente, condição de pagamento): vai para a ficha, não para um cartão grande
        if (!eNumeroCurto(v) || /^\d{6,}$/.test(v)) { ficha.push([k, v]); continue; }   // NIF e códigos não são totais
        cartoes.push({ rotulo: k, valor: v, icone: /m[ée]dio/i.test(k) ? ICONES.recibo : ICONES.barras });
      }
      if (resumoTexto) art.append(el('p', 'chat-folha-resumo', resumoTexto));
      // Só um total de contagem ("5 clientes"): vai para o cabeçalho, sem cartão
      if (cartoes.length === 1 && cartoes[0].icone === ICONES.barras && cartoes[0].delta == null) {
        const total = el('p', 'chat-folha-total', cartoes[0].valor);
        if (cartoes[0].detalhe) total.append(el('span', '', ' · ' + cartoes[0].detalhe));
        cab.append(total);
      } else if (cartoes.length) {
        const grelha = el('div', 'chat-kpis');
        for (const c of cartoes) {
          const k = el('div', 'chat-kpi');
          const topo = el('div', 'chat-kpi-cab');
          const ic = el('span', 'chat-kpi-icone');
          ic.append(icone(c.icone, 14));
          topo.append(el('span', '', c.rotulo), ic);
          const linha = el('div', 'chat-kpi-linha');
          linha.append(el('span', 'chat-kpi-valor', c.valor));
          if (c.delta != null) linha.append(chipDelta(c.delta, ' ' + c.vs));
          k.append(topo, linha);
          if (c.detalhe) k.append(el('span', 'chat-kpi-detalhe', c.detalhe));
          grelha.append(k);
        }
        art.append(grelha);
      }
      if (ficha.length) {
        const dl = el('dl', 'chat-ficha');
        for (const [k, v] of ficha) dl.append(el('dt', '', rotuloCampo(k)), el('dd', '', v));
        art.append(dl);
      }
      return [['Indicador', 'Valor', 'Detalhe'],
              ...cartoes.map(c => [c.rotulo, c.valor, c.detalhe || '']),
              ...ficha.map(([k, v]) => [rotuloCampo(k), v, ''])];
    }

    // Lista em que todas as linhas são meses "AAAA-MM" -> série para o gráfico
    function lerSerie(r) {
      // Em unidades: o gráfico e a tabela falam em euros, por isso fica a lista com barras.
      if (r.itens.length < 2 || r.itens.some(i => i.unidades) || !r.itens.every(i => /^\d{4}-\d{2}$/.test(i.nome))) return null;
      const meses = r.itens.map(i => {
        const [a, m] = i.nome.split('-').map(Number);
        return { a, m, atual: paraNumero(i.valor), anterior: i.anterior ? paraNumero(i.anterior.valor) : null,
                 delta: i.delta, anoAnt: i.anterior ? i.anterior.ano : null, media: i.media };
      });
      // O mês da última venda registada (aviso "Atenção") está incompleto
      const ultima = r.avisos.join(' ').match(/(\d{2})-(\d{2})-(\d{4})/);
      meses.forEach(x => { x.parcial = !!ultima && x.atual != null && x.a === +ultima[3] && x.m === +ultima[2]; });
      // Período a começar a meio do mês (ex.: últimos 90 dias): o 1.º mês só tem alguns dias
      if (r.periodo && !r.periodo.startsWith('01-') && meses[0].atual != null) meses[0].parcial = true;
      const anoAnt = (meses.find(x => x.anoAnt) || {}).anoAnt;
      // Comparação justa: só os meses completos antes do último incompleto
      let justa = null;
      const ip = meses.findLastIndex(x => x.parcial);
      const completos = meses.slice(0, ip < 0 ? 0 : ip).filter(x => !x.parcial && x.atual != null && x.anterior != null);
      if (completos.length) {
        const sa = completos.reduce((s, x) => s + x.atual, 0), sb = completos.reduce((s, x) => s + x.anterior, 0);
        const curto = x => MESES[x.m - 1].slice(0, 3).toLowerCase();
        justa = { de: curto(completos[0]), ate: curto(completos[completos.length - 1]), delta: (sa / sb - 1) * 100 };
      }
      return { meses, anoAtual: meses[0].a, anoAnt, justa };
    }

    function desenharSerie(s, art) {
      const valores = s.meses.flatMap(x => [x.atual, x.anterior]).filter(v => v > 0);
      const max = Math.max(...valores);
      const passo = Math.pow(10, Math.floor(Math.log10(max))) / 2;
      const topo = Math.ceil(max / passo) * passo;          // ex.: 278 519 -> 300 000
      const colunasCss = `repeat(${s.meses.length}, minmax(0, 1fr))`;
      const nomeMes = x => MESES[x.m - 1] + (x.a !== s.anoAtual ? ' ' + x.a : '');

      const sec = el('section', 'chat-bloco chat-grafico');
      const cab = el('div', 'chat-grafico-cab');
      const leg = el('div', 'chat-legenda');
      const legenda = (cls, txt) => { const i = el('span'); i.append(el('span', 'chat-legenda-cor ' + cls), txt); leg.append(i); };
      // REDESIGN 11/2026: barras (com poucos meses, uma linha engana)
      legenda('chat-legenda-barra', String(s.anoAtual));
      if (s.anoAnt) legenda('chat-legenda-barra chat-legenda-barra--ant', s.anoAnt);
      if (s.meses.some(x => x.parcial)) legenda('chat-legenda-barra chat-legenda-barra--parcial', 'Mês incompleto');
      cab.append(el('h3', '', 'Evolução das vendas'), leg);

      const corpo = el('div', 'chat-grafico-corpo');
      const eixo = el('div', 'chat-eixo');
      eixo.setAttribute('aria-hidden', 'true');
      [[topo, 200], [topo / 2, 100], [0, 0]].forEach(([v, y]) => {
        const l = el('span', '', v ? milhares(v) : '0'); l.style.bottom = (y - 7) + 'px'; eixo.append(l);
      });
      const colunas = el('div', 'chat-colunas');
      // Gráfico de linhas: pontos no centro de cada coluna de mês
      const n = s.meses.length;
      const X = i => (i + 0.5) / n * 100;              // % da largura
      const Y = v => 200 - v / topo * 200;            // px a partir do topo (área de 200 px)
      const barras = el('div', 'chat-linha-area');
      barras.setAttribute('role', 'group');
      barras.setAttribute('aria-label', 'Evolução das vendas por mês. Escolha um mês para ver os valores.');
      [100, 200].forEach(y => { const g = el('span', 'chat-guia'); g.setAttribute('aria-hidden', 'true'); g.style.bottom = y + 'px'; barras.append(g); });
      const marca = el('span', 'chat-linha-marca');
      marca.setAttribute('aria-hidden', 'true');
      barras.append(marca);

      // REDESIGN 11/2026: uma barra por mês (ano anterior ao lado, mais clara), com o valor por cima
      const largura = 100 / n;
      s.meses.forEach((x, i) => {
        const duas = x.anterior != null;
        const w = largura * (duas ? 0.34 : 0.55);
        const barra = (v, cls, desvio) => {
          if (v == null || v <= 0) return;
          const b = el('span', 'chat-barra-mes ' + cls);
          b.setAttribute('aria-hidden', 'true');
          b.style.left = (X(i) + desvio) + '%'; b.style.width = w + '%'; b.style.height = Math.max(3, v / topo * 200) + 'px';
          barras.append(b);
        };
        barra(x.anterior, 'chat-barra-mes--ant', duas ? -w / 2 - 0.4 : 0);
        barra(x.atual, x.parcial ? 'chat-barra-mes--parcial' : '', duas ? w / 2 + 0.4 : 0);
        if (x.atual != null && x.atual > 0) {
          const r = el('span', 'chat-barra-valor', milhares(x.atual).replace(' €', ''));
          r.setAttribute('aria-hidden', 'true');
          r.style.left = (X(i) + (duas ? w / 2 + 0.4 : 0)) + '%'; r.style.top = (Y(x.atual) - 3) + 'px';
          barras.append(r);
        }
      });

      const rotulos = el('div', 'chat-rotulos');
      rotulos.setAttribute('aria-hidden', 'true');
      rotulos.style.gridTemplateColumns = colunasCss;
      const leitura = el('div', 'chat-leitura');
      leitura.setAttribute('aria-live', 'polite');

      const variacao = (x, curto) => x.atual == null ? el('span', 'chat-delta', 'Sem vendas registadas')
        : x.parcial ? el('span', 'chat-delta', curto ? 'Incompleto' : 'Mês incompleto')
        : x.delta != null ? chipDelta(x.delta, s.anoAnt && !curto ? ' vs ' + s.anoAnt : '') : el('span');
      const botoes = [];
      const escolher = i => {
        const x = s.meses[i];
        botoes.forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.i === i)); b.tabIndex = +b.dataset.i === i ? 0 : -1; });
        marca.style.left = X(i) + '%';
        [...rotulos.children].forEach((r, j) => r.classList.toggle('chat-rotulo--ativo', i === j));
        const bloco = (ano, v) => { const d = el('div'); d.append(el('small', '', String(ano)), el('span', '', v == null ? '—' : euros(v))); return d; };
        leitura.replaceChildren(el('strong', '', nomeMes(x)), bloco(x.a, x.atual));
        if (s.anoAnt) leitura.append(bloco(s.anoAnt, x.anterior));
        if (x.media) { const d = el('div'); d.append(el('small', '', 'Valor médio'), el('span', '', x.media)); leitura.append(d); }
        leitura.append(variacao(x));
      };
      s.meses.forEach((x, i) => {
        rotulos.append(el('span', '', MESES[x.m - 1].slice(0, 3).toLowerCase()));
        if (x.atual == null) return;                    // mês sem vendas: sem ponto
        const b = botaoEl('chat-ponto-mes' + (x.parcial ? ' chat-ponto-mes--parcial' : ''), '', () => escolher(i));
        b.dataset.i = i;
        b.style.left = X(i) + '%';
        b.style.top = Y(x.atual) + 'px';
        b.append(el('span'));
        b.setAttribute('aria-label', nomeMes(x) + ': ' + euros(x.atual) + (x.anterior != null ? ', ' + s.anoAnt + ': ' + euros(x.anterior) : '')
          + (x.parcial ? ', mês incompleto' : x.delta != null ? ', ' + textoDelta(x.delta) : ''));
        botoes.push(b);
        barras.append(b);
      });
      // Uma só paragem do Tab no gráfico: as setas, Home e End mudam de mês
      barras.addEventListener('keydown', e => {
        const k = botoes.findIndex(b => b.tabIndex === 0);
        const novo = { ArrowRight: k + 1, ArrowLeft: k - 1, Home: 0, End: botoes.length - 1 }[e.key];
        if (novo == null || novo < 0 || novo >= botoes.length) return;
        e.preventDefault();
        botoes[novo].click();
        botoes[novo].focus();
      });
      colunas.append(barras, rotulos);
      corpo.append(eixo, colunas);
      sec.append(cab, leitura, corpo);
      art.append(sec);

      // Começa no melhor mês
      let melhor = 0;
      s.meses.forEach((x, i) => { if ((x.atual || 0) > (s.meses[melhor].atual || 0)) melhor = i; });
      escolher(melhor);

      // Tabela de detalhe: os mesmos números, para ler ou copiar
      const tab = el('section', 'chat-bloco chat-meses');
      const grelha = el('div');
      grelha.setAttribute('role', 'table');
      grelha.setAttribute('aria-label', 'Detalhe por mês');
      // Colunas opcionais: ano anterior só com comparação, valor médio só quando vem em cada mês
      const comMedia = s.meses.some(x => x.media);
      const linha = (celulas, cabecalho) => {
        const l = el('div', 'chat-meses-linha' + (cabecalho ? ' chat-meses-cab' : ''));
        l.setAttribute('role', 'row');
        l.style.gridTemplateColumns = `minmax(0, 1fr) repeat(${celulas.length - 1}, minmax(80px, auto))`;
        celulas.forEach(c => { c.setAttribute('role', cabecalho ? 'columnheader' : 'cell'); l.append(c); });
        grelha.append(l);
      };
      linha([el('span', '', 'Mês'), el('span', '', String(s.anoAtual)), ...(s.anoAnt ? [el('span', '', s.anoAnt)] : []),
             ...(comMedia ? [el('span', '', 'Valor médio')] : []), el('span', '', 'Variação')], true);
      s.meses.filter(x => x.atual != null).forEach(x => {
        const v = el('span'); v.append(variacao(x, true));   // na tabela o cabeçalho já diz "Variação"
        linha([el('span', '', nomeMes(x) + (x.parcial ? ' (incompleto)' : '')), el('span', 'chat-atual', euros(x.atual)),
               ...(s.anoAnt ? [el('span', 'chat-ant', x.anterior == null ? '—' : euros(x.anterior))] : []),
               ...(comMedia ? [el('span', '', x.media || '—')] : []), v]);
      });
      tab.append(el('h3', '', 'Detalhe por mês'), grelha);
      art.append(tab);

      // Vista: gráfico ou tabela, com os mesmos números
      tab.hidden = true;
      const controlos = el('div', 'chat-controlos');
      const vista = el('div', 'chat-seg');
      vista.setAttribute('role', 'group');
      vista.setAttribute('aria-label', 'Vista');
      const mudarVista = grafico => {
        sec.hidden = !grafico;
        tab.hidden = grafico;
        [...vista.children].forEach((b, k) => b.setAttribute('aria-pressed', String((k === 0) === grafico)));
      };
      vista.append(botaoEl('', 'Gráfico', () => mudarVista(true)), botaoEl('', 'Tabela', () => mudarVista(false)));
      controlos.append(vista);
      sec.before(controlos);
      mudarVista(true);

      // O cartão "Melhor mês" mostra esse mês no gráfico
      const cartao = [...art.querySelectorAll('.chat-kpi')].find(k => /melhor m[eê]s/i.test(k.textContent));
      const pontoMelhor = botoes.find(b => +b.dataset.i === melhor);
      if (cartao && pontoMelhor) {
        cartao.classList.add('chat-kpi--acao');
        cartao.tabIndex = 0;
        cartao.setAttribute('role', 'button');
        cartao.setAttribute('aria-label', cartao.querySelector('.chat-kpi-valor').textContent + ', melhor mês. Mostrar no gráfico');
        const ir = () => { mudarVista(true); pontoMelhor.click(); pontoMelhor.focus(); };
        cartao.addEventListener('click', ir);
        cartao.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ir(); } });
      }
    }

    // Perguntas sobre uma linha de um ranking, conforme o que a lista compara ("por localidade", "por marca")
    // "por zona," -> "zona"; "da zona Balcão" / "do artigo X": o agente sabe em que campo procurar
    const FEMININO = /^(zona|localidade|marca|fam[ií]lia|a?c?tividade|categoria|regi[ãa]o)/i;
    // De que se fala: "Vendas por zona" -> "zona"; sem "por", a primeira palavra conhecida ("A marca que mais faturou…" -> "marca")
    const dimensao = titulo => ((titulo || '').match(/\bpor\s+(\S+)/i) || [])[1]
      || (((titulo || '').match(/\b(marca|artigo|fam[ií]lia|zona|localidade|cliente|vendedor)s?\b/i) || [])[1] || '').toLowerCase();
    const limparDim = dim => (dim || '').replace(/[^\p{L}]/gu, '').toLowerCase();
    const daDim = (dim, nome) => limparDim(dim) ? `${FEMININO.test(limparDim(dim)) ? 'da' : 'do'} ${limparDim(dim)} ${nome}` : `de ${nome}`;
    const naDim = (dim, nome) => limparDim(dim) ? `${FEMININO.test(limparDim(dim)) ? 'na' : 'no'} ${limparDim(dim)} ${nome}` : `em ${nome}`;

    // O servidor só filtra vendas por cliente e pelas colunas da ficha (zona, localidade...), não por artigo,
    // marca ou família: para esses só há perguntas sobre o ranking inteiro, senão a sugestão dava erro.
    const filtravel = dim => /^(zona|localidade|distrito|vendedor|a?c?tividade|cliente)/.test(limparDim(dim));
    const perguntasDoRanking = dim => {
      const d = limparDim(dim) === 'familia' ? 'família' : limparDim(dim);
      const [o, s] = FEMININO.test(d) ? ['a', 'as'] : ['o', 'os'];
      return [`Qual foi ${o} ${d} mais vendid${o} em cada distrito?`, `Comparar as vendas por ${d} com o ano passado`,
              `Quais ${d === 'família' ? 'as famílias' : `${s} ${d}s`} que venderam menos este ano?`];
    };

    function perguntasDoItem(nome, dim, quando = 'este ano') {
      if (/^\(/.test(nome) || /^(m[eê]s|trimestre)/.test(limparDim(dim))) return [];   // "(sem localidade)", "2026-03" não dão boa pergunta
      if (!filtravel(dim)) return /artigo|marca|fam[ií]lia/i.test(dim) ? perguntasDoRanking(dim) : [];
      const n = nomeProprio(nome);
      return [
        `Evolução mensal das vendas ${daDim(dim, n)} ${quando}`,
        `Comparar as vendas ${daDim(dim, n)} com o ano passado`,
        `Que artigos venderam mais ${naDim(dim, n)} ${quando}?`
      ];
    }

    // Ranking (top marcas, artigos, clientes): nome | barra | valor | variação.
    // Cada linha abre o detalhe; a métrica e a ordem mudam sem nova pergunta.
    /* ---------- Gráfico circular: partes de um total ---------- */
    // Cores por ordem fixa (validadas para daltonismo); a 1.ª parte é sempre a maior
    const CORES_CIRCULO = ['--serie-1', '--serie-2', '--serie-3', '--serie-4', '--serie-5', '--serie-6'];
    const percentagem = i => /^\d+(?:[.,]\d+)?\s*%$/.test(i.pct || '') ? parseFloat(i.pct.replace(',', '.')) : null;
    // Circular só quando a resposta divide um total: 2 a 6 partes, todas com "% do total" e a somar ~100%
    function eParteDoTodo(itens) {
      if (itens.length < 2 || itens.length > 6) return false;
      if (itens.some(i => i.delta != null || i.unidades || percentagem(i) == null)) return false;
      const soma = itens.reduce((s, i) => s + percentagem(i), 0);
      return soma >= 97 && soma <= 103;
    }

    function desenharCirculo(itens, art, titulo) {
      const estado = { vista: 'circulo' };
      const g = el('div', 'chat-seg');
      g.setAttribute('role', 'group');
      g.setAttribute('aria-label', 'Ver como');
      const controlos = el('div', 'chat-controlos');
      controlos.append(g);
      const zona = el('div');
      art.append(controlos, zona);
      [['circulo', 'Circular'], ['barras', 'Barras']].forEach(([id, texto]) => {
        const b = botaoEl('', texto, () => { estado.vista = id; desenhar(); });
        b.dataset.id = id;
        g.append(b);
      });

      function desenhar() {
        [...g.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === estado.vista)));
        zona.replaceChildren();
        if (estado.vista === 'barras') { desenharRanking(itens, zona, titulo); return; }

        const lista = [...itens].sort((a, b) => b.num - a.num);
        const bloco = el('div', 'chat-bloco chat-circulo');
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 120 120');
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', lista.map(i => `${i.nome} ${i.pct}`).join(', '));
        let inicio = 0;
        const folga = lista.length > 1 ? 0.6 : 0;      // 2px de fundo entre as fatias
        lista.forEach((it, k) => {
          const parte = percentagem(it);
          const c = document.createElementNS(NS, 'circle');
          c.setAttribute('cx', 60); c.setAttribute('cy', 60); c.setAttribute('r', 46);
          c.setAttribute('pathLength', 100);
          c.setAttribute('stroke-dasharray', `${Math.max(0.4, parte - folga)} ${100 - Math.max(0.4, parte - folga)}`);
          c.setAttribute('stroke-dashoffset', String(25 - inicio));   // começa às 12 horas
          c.style.stroke = `var(${CORES_CIRCULO[k]})`;
          const dica = document.createElementNS(NS, 'title');
          dica.textContent = `${it.nome}: ${it.valor} (${it.pct})`;
          c.append(dica);
          svg.append(c);
          inicio += parte;
        });
        const centro = el('div', 'chat-circulo-centro');
        centro.append(el('strong', '', lista[0].pct), el('span', '', lista[0].nome));
        const roda = el('div', 'chat-circulo-roda');
        roda.append(svg, centro);

        // Legenda com nome, valor e % (a cor nunca é a única pista)
        const legenda = el('ul', 'chat-circulo-legenda');
        lista.forEach((it, k) => {
          const li = el('li');
          const cor = el('span', 'chat-circulo-cor');
          cor.style.background = `var(${CORES_CIRCULO[k]})`;
          cor.setAttribute('aria-hidden', 'true');
          li.append(cor, el('span', 'chat-circulo-nome', it.nome), el('strong', '', it.valor), el('small', '', it.pct));
          legenda.append(li);
        });
        bloco.append(roda, legenda);
        zona.append(bloco);
      }
      desenhar();
    }

    // O mesmo gráfico em PNG, para o botão "Guardar imagem"
    function pngCirculo(itens, titulo, subtitulo) {
      const lista = [...itens].sort((a, b) => b.num - a.num);
      const cores = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#6250d6'];
      const L = 720, A = Math.max(320, 96 + lista.length * 32);
      const { cv, g } = novaTela(L, A, titulo, subtitulo);
      const cx = 150, cy = 72 + (A - 72) / 2 - 8, r = 92;
      let ang = -Math.PI / 2;
      g.lineWidth = 36;
      lista.forEach((it, k) => {
        const fim = ang + percentagem(it) / 100 * 2 * Math.PI;
        g.strokeStyle = cores[k];
        g.beginPath(); g.arc(cx, cy, r, ang + 0.01, Math.max(ang + 0.02, fim - 0.01)); g.stroke();
        ang = fim;
      });
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = COR.texto; g.font = fonte(20, 700); g.fillText(lista[0].pct, cx, cy - 8);
      g.fillStyle = COR.nota; g.font = fonte(12); g.fillText(cortar(g, lista[0].nome, 110), cx, cy + 14);
      g.textAlign = 'left';
      lista.forEach((it, k) => {
        const y = cy - (lista.length - 1) * 16 + k * 32;
        g.fillStyle = cores[k]; g.fillRect(300, y - 6, 12, 12);
        g.fillStyle = COR.texto; g.font = fonte(13); g.fillText(cortar(g, it.nome, 220), 322, y);
        g.textAlign = 'right'; g.font = fonte(13, 600); g.fillText(it.valor, L - 84, y);
        g.fillStyle = COR.nota; g.font = fonte(12); g.fillText(it.pct, L - 24, y);
        g.textAlign = 'left';
      });
      return cv;
    }

    function desenharRanking(itens, art, titulo) {
      const comEuros = itens.every(i => i.unidades && /€/.test(i.pct));   // "18 390 unidades (436 176,07 €)"
      const comDelta = itens.some(i => i.delta != null);
      // Meses/trimestres em unidades ("2026-03", "2026-T1"): evolução, por ordem do tempo
      const estado = { metrica: 'principal', ordem: itens.every(i => /^\d{4}-(\d{2}|T\d)$/.test(i.nome)) ? 'nome' : 'valor', aberto: -1 };
      const valor = i => estado.metrica === 'euros' ? paraNumero(i.pct) : i.num;
      const dim = dimensao(titulo);   // "Vendas por localidade" -> "localidade"

      const controlos = el('div', 'chat-controlos');
      const grupo = (rotulo, chave, opcoes) => {
        const g = el('div', 'chat-seg');
        g.setAttribute('role', 'group');
        g.setAttribute('aria-label', rotulo);
        opcoes.forEach(([id, texto]) => {
          const b = botaoEl('', texto, () => { estado[chave] = id; estado.aberto = -1; desenhar(); });
          b.dataset.id = id;
          g.append(b);
        });
        g.dataset.chave = chave;
        controlos.append(g);
      };
      if (comEuros) grupo('Métrica', 'metrica', [['principal', 'Unidades'], ['euros', 'Euros']]);
      if (itens.length > 2) grupo('Ordenar por', 'ordem', [['valor', 'Valor'], ...(comDelta ? [['variacao', 'Variação']] : []), ['nome', 'Nome']]);
      if (controlos.childNodes.length) art.append(controlos);

      const bloco = el('div', 'chat-bloco chat-ranking');
      const ol = el('ol', 'chat-rank');
      ol.setAttribute('role', 'list');
      const eixo = el('div', 'chat-rank-linha chat-rank-eixo');
      eixo.setAttribute('aria-hidden', 'true');
      bloco.append(ol, eixo);
      art.append(bloco);

      function desenhar(foco) {
        controlos.querySelectorAll('.chat-seg').forEach(g =>
          [...g.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === estado[g.dataset.chave]))));
        const max = Math.max(...itens.map(valor));
        const passo = Math.pow(10, Math.floor(Math.log10(max))) / 2;
        const topo = Math.ceil(max / passo) * passo;     // ex.: 299 053 -> 300 000
        const lista = [...itens].sort(estado.ordem === 'nome' ? (a, b) => a.nome.localeCompare(b.nome, 'pt')
          : estado.ordem === 'variacao' ? (a, b) => (b.delta ?? -Infinity) - (a.delta ?? -Infinity)
          : (a, b) => valor(b) - valor(a));

        ol.replaceChildren(...lista.map((it, k) => {
          const n = itens.indexOf(it);
          const li = el('li');
          const linha = el('button', 'chat-rank-linha');
          linha.type = 'button';
          linha.setAttribute('aria-expanded', String(estado.aberto === n));
          linha.setAttribute('aria-controls', 'detalhe-' + n);
          linha.addEventListener('click', () => { estado.aberto = estado.aberto === n ? -1 : n; desenhar(n); });
          const nome = el('span', 'chat-rank-nome');
          const vazio = /^\(?sem descri[çc][ãa]o\)?$/i.test(it.nome);
          nome.append(el('span', vazio ? 'chat-item-nome--vazio' : '', vazio ? 'Sem descrição' : it.nome));
          if (it.codigo) nome.append(el('small', '', it.codigo));
          if (it.sub) nome.append(el('small', '', it.sub));
          nome.title = it.nome;   // nome inteiro ao passar o rato; no teclado, no detalhe
          const pista = el('span', 'chat-rank-pista'), cheio = el('span');
          pista.setAttribute('aria-hidden', 'true');
          cheio.style.width = Math.max(1, valor(it) / topo * 100) + '%';
          pista.append(cheio);
          const val = el('span', 'chat-rank-valor');
          const emEuros = estado.metrica === 'euros';
          val.append(el('strong', '', emEuros ? it.pct : it.valor));
          if (it.pct) val.append(el('small', '', emEuros ? it.valor : it.pct));
          if (it.media) val.append(el('span', 'so-leitor', ', valor médio ' + it.media));
          const variacao = el('span', 'chat-rank-delta');   // coluna própria: não empurra o valor para cima da barra
          // Em euros, a variação continua a ser a das unidades (é a que vem na resposta): o texto diz isso
          if (it.delta != null) variacao.append(chipDelta(it.delta, (it.anterior ? ' vs ' + it.anterior.ano : '') + (emEuros ? ' em unidades' : '')));
          linha.append(el('span', 'chat-rank-pos', String(k + 1)), nome, pista, val, variacao);

          const det = el('div', 'chat-rank-detalhe');
          det.id = 'detalhe-' + n;   // só há uma resposta no ecrã de cada vez, por isso o id é único
          det.hidden = estado.aberto !== n;
          if (!det.hidden) {
            const dl = el('dl', 'chat-factos');
            const facto = (rotulo, v) => { if (!v) return; const g = el('div'); g.append(el('dt', '', rotulo), el('dd', '', v)); dl.append(g); };
            facto(it.unidades ? 'Unidades' : 'Valor', it.valor);
            facto(/€/.test(it.pct) ? 'Vendas' : /%\s+\S/.test(it.pct) ? 'Percentagem' : 'Parte do total', it.pct);
            facto(rotuloSub(titulo), it.sub);
            facto('Código', it.codigo);
            if (it.anterior) facto('Em ' + it.anterior.ano, it.anterior.valor);
            if (it.delta != null) facto('Variação', textoDelta(it.delta) + (it.anterior ? ' vs ' + it.anterior.ano : ''));
            facto('Valor médio por documento', it.media);
            const acoes = el('div', 'chat-acoes');
            if (limparDim(dim) === 'cliente' && it.codigo) acoes.append(botaoEl('chat-chip', 'Ver resumo deste cliente', () => pedirResumo(null, it.codigo)));
            perguntasDoItem(it.nome, dim).forEach(q => acoes.append(botaoEl('chat-chip', q, () => prepararPergunta(q))));
            det.append(el('strong', '', it.nome), dl);
            if (acoes.childNodes.length) det.append(acoes);
          }
          li.append(linha, det);
          return li;
        }));

        // Eixo alinhado com a coluna das barras
        const marcas = el('div', 'chat-rank-marcas');
        for (let k = 0; k <= 4; k++) marcas.append(el('span', '', k ? milhares(topo * k / 4).replace(' €', '') : '0'));
        eixo.replaceChildren(el('span'), el('span'), marcas, el('span'), el('span'));
        if (foco != null) ol.querySelector(`[aria-controls="detalhe-${foco}"]`).focus();
      }
      desenhar();
    }

    // Lista simples: posição | nome e código | valor. Com grupos ("Clientes em Odivelas") e nomes repetidos.
    function desenharLista(itens, art, titulo) {
      const nums = itens.map(i => Math.abs(i.num)).filter(n => n > 0);
      const max = nums.length ? Math.max(...nums) : 0;
      const rotulos = new Set(itens.map(i => i.rotulo));
      const comum = rotulos.size === 1 ? [...rotulos][0] : '';
      const bloco = el('div', 'chat-bloco chat-bloco--lista');
      if (titulo) bloco.append(el('h3', 'chat-lista-titulo', titulo));
      if (comum) { const c = el('div', 'chat-lista-cab', maiuscula(comum)); c.setAttribute('aria-hidden', 'true'); bloco.append(c); }

      // O mesmo nome repetido no mesmo grupo aparece uma vez, com a contagem
      const chave = i => (i.grupo || '') + '|' + i.nome + '|' + i.valor;
      const vezes = new Map(), porGrupo = new Map();
      itens.forEach(i => {
        vezes.set(chave(i), (vezes.get(chave(i)) || 0) + 1);
        porGrupo.set(i.grupo || '', (porGrupo.get(i.grupo || '') || 0) + 1);
      });

      const ol = el('ol', 'chat-lista');
      ol.setAttribute('role', 'list');
      let grupoAnterior = '';
      for (const it of itens) {
        const n = vezes.get(chave(it));
        if (!n) continue;                       // repetido já mostrado
        vezes.set(chave(it), 0);
        if (it.grupo && it.grupo !== grupoAnterior) {
          const g = el('li', 'chat-grupo-cab', it.grupo + ' ');
          g.append(el('span', '', '· ' + porGrupo.get(it.grupo)));
          ol.append(g);
        }
        grupoAnterior = it.grupo || '';
        const li = el('li', 'chat-item');
        const corpo = el('div', 'chat-item-corpo');
        const vazio = /^\(?sem descri[çc][ãa]o\)?$/i.test(it.nome);
        corpo.append(el('span', 'chat-item-nome' + (vazio ? ' chat-item-nome--vazio' : ''), vazio ? 'Sem descrição' : it.nome));
        if (it.codigo) corpo.append(el('span', 'chat-item-codigo', it.codigo));
        if (it.sub) corpo.append(el('span', 'chat-item-codigo', it.sub));
        if (n > 1) corpo.append(el('span', 'chat-item-codigo', n + ' registos com este nome'));
        const v = Math.abs(it.num);
        if (v > 0 && max > 0) {
          const b = el('span', 'chat-item-barra' + (it.num < 0 ? ' chat-item-barra--neg' : '')), f = el('span');
          b.setAttribute('aria-hidden', 'true');
          f.style.width = Math.max(2, v / max * 100) + '%';
          b.append(f); corpo.append(b);
        }
        const val = el('div', 'chat-item-valor');
        if (it.rotulo) val.append(el('span', comum ? 'so-leitor' : 'chat-item-rotulo', maiuscula(it.rotulo) + (comum ? ': ' : '')));
        if (it.valor) val.append(el('strong', it.rotulo ? 'chat-data' : '', it.valor));
        if (it.pct) val.append(el('span', 'chat-item-pct', it.pct));
        if (it.delta != null) val.append(chipDelta(it.delta, it.anterior ? ' vs ' + it.anterior.ano : ''));
        li.append(el('span', 'chat-item-pos', it.pos), corpo, val);
        ol.append(li);
      }
      bloco.append(ol);
      art.append(bloco);
    }

    // Perguntas seguintes, calculadas a partir da própria resposta (em vez das sugestões fixas do tema)
    function perguntasSeguintes(r, itens, serie) {
      if (serie) {
        const completos = serie.meses.filter(x => x.atual != null && !x.parcial);
        if (completos.length < 2) return [];
        const melhor = completos.reduce((a, b) => b.atual > a.atual ? b : a);
        const pior = completos.reduce((a, b) => b.atual < a.atual ? b : a);
        const mes = x => MESES[x.m - 1].toLowerCase() + ' de ' + x.a;
        return [`Que artigos venderam mais em ${mes(melhor)}?`, `Que clientes compraram mais em ${mes(melhor)}?`, `Vendas por zona em ${mes(pior)}`];
      }
      const validos = itens.filter(i => i.num > 0 && !/^\(/.test(i.nome));   // "(sem localidade)" não dá boa pergunta
      if (validos.length < 2) return [];
      const dim = dimensao(r.titulo || (r.paragrafos || []).join(' '));   // sem título: "A marca que mais faturou…"
      const n = i => nomeProprio(i.nome);
      const primeiro = validos.reduce((a, b) => b.num > a.num ? b : a);
      const ano = +((r.periodo.match(/(\d{4})$/) || [])[1] || new Date().getFullYear());
      const comVariacao = validos.filter(i => i.delta != null);
      // Sem variação, ou artigo/marca/família (não se filtram): as mesmas perguntas do detalhe da linha
      if (comVariacao.length < 2 || !filtravel(dim)) return perguntasDoItem(primeiro.nome, dim, `em ${ano}`);
      // Só o que as ferramentas respondem: o "porquê" de uma descida não está nos dados
      const sobe = comVariacao.reduce((a, b) => b.delta > a.delta ? b : a);
      const desce = comVariacao.reduce((a, b) => b.delta < a.delta ? b : a);
      const lista = [];
      if (sobe.delta > 0) lista.push(`Que artigos venderam mais ${naDim(dim, n(sobe))} face ao ano passado?`);
      if (desce.delta < 0) lista.push(`Comparar as vendas ${daDim(dim, n(desce))} mês a mês com o ano passado`);
      lista.push(`Evolução mensal das vendas ${daDim(dim, n(primeiro))} em ${ano}`);
      return lista;
    }

    // Perguntas seguintes: escrevem no campo, para rever antes de enviar
    function blocoSeguintes(perguntas) {
      const sec = el('section', 'chat-sugestoes');
      const lista = el('div');
      perguntas.forEach(p => lista.append(botaoEl('chat-chip', p, () => prepararPergunta(p))));
      sec.append(el('h3', '', 'Perguntas seguintes'), lista);
      return sec;
    }

    // "Clientes com Vendedor = Paulo Afonso e Localidade = Corroios" -> título "Clientes" + filtros
    function lerFiltros(titulo) {
      const filtros = [...(titulo || '').matchAll(/(\p{L}[\p{L} ]*?)\s*=\s*(.+?)(?=\s+e\s+\p{L}[\p{L} ]*?\s*=|$)/gu)]
        .map(m => [m[1].replace(/^(?:.*\bcom\s+|e\s+)/i, ''), m[2].trim()]);
      return { titulo: filtros.length ? titulo.replace(/\s+com\s+.*=.*$/i, '') : titulo, filtros };
    }

    // "Qual foi a localidade que mais faturou este ano?" + "no mês passado" -> "... faturou no mês passado?"
    function trocarPeriodo(pergunta, periodo) {
      const sem = pergunta.replace(/\?\s*$/, '')
        .replace(/\s+(?:(?:n?este|deste)\s+ano|(?:no|do|o)\s+ano\s+(?:atual|passado)|(?:no|do|n?este|deste)\s+m[eê]s(?:\s+(?:passado|atual))?|(?:no|do|neste)\s+[uú]ltimo\s+trimestre|(?:no|do)\s+1\.º\s+semestre|(?:no|do)\s+dia\s+\d{2}-\d{2}-\d{4}|(?:em|de)\s+\d{4})(?=\s|$)/i, '').replace(/\s{2,}/g, ' ').trim();
      return `${sem} ${periodo}?`;
    }

    // "Como li a pergunta": filtros e período em etiquetas. O período muda-se com um clique.
    const PERIODOS = ['este ano', 'no mês passado', 'no último trimestre', 'no ano passado'];
    function etiquetasLeitura(cab, filtros, periodo, pergunta) {
      if (!filtros.length && !periodo) return;
      const div = el('div', 'chat-filtros');
      div.setAttribute('role', 'group');
      div.setAttribute('aria-label', 'Como li a pergunta');
      filtros.forEach(([k, v]) => { const f = el('span', 'chat-filtro'); f.append(el('span', '', k), v); div.append(f); });
      cab.append(div);
      if (!periodo) return;
      const menu = el('div', 'chat-periodos');
      menu.hidden = true;
      PERIODOS.forEach(p => menu.append(botaoEl('chat-chip', maiuscula(p.replace(/^no\s+/, '')), () => { if (!ocupado) perguntar(trocarPeriodo(pergunta, p)); })));
      const b = botaoEl('chat-filtro chat-filtro--botao', '', () => {
        menu.hidden = !menu.hidden;
        b.setAttribute('aria-expanded', String(!menu.hidden));
      });
      b.setAttribute('aria-expanded', 'false');
      b.append(el('span', '', 'Período'), periodo, el('span', '', ' ▾'));
      div.append(b);
      cab.append(menu);
    }

    // Destaque em texto: quem lidera, quem mais subiu e quem mais desceu, calculado a partir dos números
    // Nome com o código: muitos artigos chamam-se todos "(sem descrição)", só o código os distingue
    const nomeECodigo = i => nomeProprio(i.nome) + (i.codigo ? ` (${i.codigo})` : '');

    function fraseDestaque(itens) {
      const comValor = itens.filter(i => i.num > 0);
      if (comValor.length < 3 || itens.some(i => i.sub)) return '';   // "melhor X em cada Y": não há um líder
      const primeiro = comValor.reduce((a, b) => b.num > a.num ? b : a);
      let frase = `${nomeECodigo(primeiro)} lidera com ${primeiro.valor}` + (/%/.test(primeiro.pct) ? ` (${primeiro.pct} do total)` : '') + '.';
      const comVariacao = comValor.filter(i => i.delta != null);
      if (comVariacao.length > 1) {
        const sobe = comVariacao.reduce((a, b) => b.delta > a.delta ? b : a);
        const desce = comVariacao.reduce((a, b) => b.delta < a.delta ? b : a);
        if (sobe.delta > 0) frase += ` A maior subida é de ${nomeECodigo(sobe)} (${textoDelta(sobe.delta)}).`;
        if (desce.delta < 0) frase += ` A maior descida é de ${nomeECodigo(desce)} (${textoDelta(desce.delta)}).`;
      }
      return frase;
    }

    function folhaLista(r, original, pergunta = '') {
      const art = el('article', 'chat-folha');
      const simples = !r.titulo && !r.itens.length && !r.factos.length && !r.avisos.length;
      if (simples) {
        art.append(el('p', 'chat-texto', original.trim()));
        const rod = el('div', 'chat-folha-rodape');
        rod.append(botaoCopiar(original.trim()));   // texto: só Copiar
        art.append(rod);
        return art;
      }

      // Período de um só dia: título com o dia da semana e sem "1 meses" no total
      const dia = r.periodo.match(/^(\d{2})-(\d{2})-(\d{4}) a \1-\2-\3$/);
      if (dia) {
        const semana = new Date(+dia[3], +dia[2] - 1, +dia[1]).toLocaleDateString('pt-PT', { weekday: 'long' });
        r.titulo = `Faturação de ${semana}, ${dia[1]}-${dia[2]}-${dia[3]}`;
        r.periodo = '';
        r.resumo = r.resumo.replace(/\bem 1 m[eê]s(es)?,\s*/i, 'em ');
      }

      const cab = el('div', 'chat-folha-cab');
      const leitura = lerFiltros(r.titulo);
      if (r.titulo) cab.append(el('h2', 'chat-folha-titulo', maiuscula(leitura.titulo)));
      etiquetasLeitura(cab, leitura.filtros, r.periodo, pergunta);
      art.append(cab);

      art.classList.add('chat-folha--painel');
      const linhasKpis = desenharKpis(r, cab, art);
      const serie = lerSerie(r);

      r.avisos.forEach((a, n) => {
        const div = el('div', 'chat-aviso');
        div.setAttribute('role', 'note');
        const texto = el('div');
        const span = el('span');
        span.append(el('strong', '', 'Atenção: '), a);
        texto.append(span);
        if (n === 0 && serie && serie.justa) {
          const j = el('p', 'chat-justa');
          j.append(`Comparando só os meses completos, ${serie.justa.de} a ${serie.justa.ate}:`,
                   chipDelta(serie.justa.delta, serie.anoAnt ? ' vs ' + serie.anoAnt : ''));
          texto.append(j);
        }
        div.append(icone('M8 1.8 15 14H1L8 1.8ZM8 6v3.5M8 11.5v.5'), texto);
        art.append(div);
      });

      r.paragrafos.forEach(p => art.append(el('p', 'chat-texto', p)));

      // Valores negativos (devoluções, notas de crédito) vão para um bloco à parte
      const devolucoes = r.itens.filter(i => i.num < 0);
      const itens = r.itens.filter(i => !(i.num < 0));
      // Um só valor (ex.: um dia) já está nos cartões: não desenha uma barra sozinha
      const soUm = itens.length === 1 && !devolucoes.length && !!art.querySelector('.chat-kpis');

      const destaque = serie ? '' : fraseDestaque(itens);
      if (destaque) art.append(el('p', 'chat-destaque', destaque));

      let imagem = null;   // gráfico que o botão "Guardar imagem" redesenha em PNG
      const periodo = r.periodo ? 'Período: ' + r.periodo : '';
      if (serie) { desenharSerie(serie, art); imagem = () => pngSerie(serie, r.titulo, periodo); }
      else if (soUm) { /* nada a acrescentar */ }
      else if (itens.length && itens.every(i => i.num > 0 && !i.rotulo) && eParteDoTodo(itens)) { desenharCirculo(itens, art, r.titulo); imagem = () => pngCirculo(itens, r.titulo, periodo); }
      else if (itens.length && itens.every(i => i.num > 0 && !i.rotulo)) { desenharRanking(itens, art, r.titulo); imagem = () => pngRanking(itens, r.titulo, periodo); }
      else if (itens.length) desenharLista(itens, art);
      if (devolucoes.length) desenharLista(devolucoes, art, 'Devoluções e notas de crédito');

      const linhas = !r.itens.length ? linhasKpis
        : serie ? [['Mês', serie.anoAtual, serie.anoAnt || '', 'Variação (%)', 'Valor médio'],
                   ...r.itens.map(i => [i.nome, i.valor, i.anterior ? i.anterior.valor : '', i.delta == null ? '' : String(i.delta).replace('.', ','), i.media])]
        : [['Posição', 'Grupo', 'Nome', rotuloSub(r.titulo), 'Código', 'Valor', '%', 'Média'],
           ...r.itens.map(i => [i.pos, i.grupo || '', i.nome, i.sub || '', i.codigo, i.valor, i.pct, i.media])];
      rodapeDados(art, linhas, r.titulo, r.nota, imagem);
      if (r.itens.length) art.sugestoes = perguntasSeguintes(r, itens, serie);   // lidas em mostrarItem
      // Resposta de faturação de um período que o Resumo tem: o balão de sugestão propõe o resumo desse período
      art.periodoResumo = /^vendas por/i.test(r.titulo) ? periodoEmPalavras(r.periodo) : null;
      // ... e o próprio resultado também, no rodapé (passa por perguntar: fica a pergunta e a resposta na conversa)
      if (art.periodoResumo) {
        const p = art.periodoResumo, rod = art.querySelector('.chat-folha-rodape');
        const b = botaoEl('chat-acao', `Ver o resumo das vendas ${p}`, () => { if (!ocupado) perguntar(`Resumo das vendas ${p}`); });
        if (rod) rod.insertBefore(b, rod.querySelector('.chat-folha-meta')); else art.append(b);
      }
      return art;
    }

    // Número de uma célula: "27.2" e "27,2" valem o mesmo; "1 234,50 €" também funciona
    const numeroCelula = s => /^-?\d+\.\d+%?$/.test(s) ? parseFloat(s) : paraNumero(s);
    // Escreve um total com o formato das células da coluna ("27.2", "97.6%", "1 234,50 €")
    function formatarComo(amostra, n) {
      const casas = ((amostra.match(/[.,](\d+)\D*$/) || [])[1] || '').length;
      if (/€|\d\s\d{3}/.test(amostra)) return n.toLocaleString('pt-PT', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + (/€/.test(amostra) ? ' €' : '');
      return n.toFixed(casas).replace('.', amostra.includes(',') ? ',' : '.') + (/%$/.test(amostra) ? '%' : '');
    }

    function folhaTabela(t, pergunta = '') {
      const art = el('article', 'chat-folha chat-folha--painel');
      // Sem markdown e sem "Lista completa: …", que repete o total
      const limpo = s => s.split('\n').map(l => limparMarkdown(l.trim()).replace(MARCADOR, ''))
        .filter(l => l && !/^lista completa/i.test(l)).join('\n');
      const antes = limpo(t.antes), depois = limpo(t.depois);
      const [titulo, resumo] = antes.split(/:\s+(.*)/s);
      const cab = el('div', 'chat-folha-cab');
      art.append(cab);
      const leitura = lerFiltros(titulo);
      if (titulo) cab.append(el('h2', 'chat-folha-titulo', maiuscula(leitura.titulo)));   // sem toLowerCase: mantém "Paulo Afonso"
      etiquetasLeitura(cab, leitura.filtros, '', pergunta);

      // Coluna de texto com o mesmo valor em todas as linhas (ex.: Vendedor): sai da tabela e vai para o cabeçalho
      const fixa = t.cabecalho.map((_, c) => c > 0 && !t.numericas[c] && t.linhas.length > 1 && t.linhas.every(l => l[c] === t.linhas[0][c]));
      const jaNoTitulo = nome => leitura.filtros.some(([k]) => semAcento(k) === semAcento(nome));   // "Vendedor" já está nas etiquetas
      if (fixa.some((f, c) => f && !jaNoTitulo(t.cabecalho[c]))) {
        const filtros = el('div', 'chat-filtros');
        t.cabecalho.forEach((nome, c) => {
          if (!fixa[c] || jaNoTitulo(nome)) return;
          const f = el('span', 'chat-filtro');
          f.append(el('span', '', maiuscula(nome)), t.linhas[0][c]);
          filtros.append(f);
        });
        cab.append(filtros);
      }
      if (resumo) desenharKpis({ resumo, factos: [] }, cab, art);   // "379 clientes em 9 grupos" num cartão

      const mostrar = (_, c) => !fixa[c];
      const cabecalho = t.cabecalho.filter(mostrar);
      const numericas = t.numericas.filter(mostrar);
      // "27.2" (ponto do SQL) passa a "27,2", como no resto da página
      const linhas = t.linhas.map(l => l.filter(mostrar).map((v, c) => numericas[c] && /^-?\d+\.\d{1,2}$/.test(v) ? v.replace('.', ',') : v));
      const estado = { col: -1, dir: -1, filtro: '' };   // col -1: a ordem em que a resposta veio

      // Filtro só em tabelas compridas
      const contagem = el('span', '');
      contagem.setAttribute('role', 'status');
      if (linhas.length > 8) {
        const filtro = el('label', 'chat-filtrar');
        const caixa = el('input');
        caixa.type = 'search';
        caixa.autocomplete = 'off';
        caixa.placeholder = maiuscula(cabecalho[0] || 'texto');
        caixa.addEventListener('input', () => { estado.filtro = caixa.value; desenharLinhas(); });
        filtro.append(el('span', '', 'Filtrar'), caixa, contagem);
        art.append(filtro);
      }

      const barra = numericas.indexOf(true);
      const maximo = barra < 0 ? 0 : Math.max(...linhas.map(l => numeroCelula(l[barra])));
      const tabela = el('table', 'chat-tabela');
      const topo = tabela.createTHead().insertRow();
      const cabecalhos = cabecalho.map((nome, c) => {
        const th = el('th', numericas[c] ? 'chat-num' : '');
        th.scope = 'col';
        const b = botaoEl('chat-ordenar', maiuscula(nome), () => {
          // 1.º clique: números do maior para o menor, texto de A a Z; 2.º clique inverte
          estado.dir = estado.col === c ? -estado.dir : (numericas[c] ? -1 : 1);
          estado.col = c;
          desenharLinhas();
        });
        b.append(el('span', 'chat-seta'));
        th.append(b);
        topo.append(th);
        if (c === 0 && barra >= 0) { const v = el('th'); v.append(el('span', 'so-leitor', 'Proporção')); topo.append(v); }
        return th;
      });
      const corpo = tabela.createTBody();
      const total = linhas.length > 1 && numericas.some(Boolean) ? tabela.createTFoot().insertRow() : null;

      function desenharLinhas() {
        cabecalhos.forEach((th, c) => {
          if (c === estado.col) th.setAttribute('aria-sort', estado.dir < 0 ? 'descending' : 'ascending');
          else th.removeAttribute('aria-sort');
          th.querySelector('.chat-seta').textContent = c === estado.col ? (estado.dir < 0 ? ' ↓' : ' ↑') : '';
        });
        const f = semAcento(estado.filtro.trim());
        let visiveis = linhas.filter(l => !f || l.some((v, c) => !numericas[c] && semAcento(v).includes(f)));
        if (estado.col >= 0) {
          const c = estado.col;
          visiveis = [...visiveis].sort((a, b) => (numericas[c] ? numeroCelula(a[c]) - numeroCelula(b[c]) : a[c].localeCompare(b[c], 'pt')) * estado.dir);
        }
        corpo.replaceChildren();
        for (const linha of visiveis) {
          const tr = corpo.insertRow();
          linha.forEach((valor, c) => {
            tr.append(el('td', numericas[c] ? 'chat-num' : '', valor));
            if (c === 0 && barra >= 0) {
              const td = el('td'), fundo = el('div', 'chat-barra'), cheio = el('span');
              cheio.style.width = Math.max(3, numeroCelula(linha[barra]) / maximo * 100) + '%';
              fundo.setAttribute('aria-hidden', 'true');
              fundo.append(cheio); td.append(fundo); tr.append(td);
            }
          });
        }
        if (!visiveis.length) {
          const td = el('td', 'chat-tabela-vazia', 'Nenhuma linha com esse texto.');
          td.colSpan = cabecalho.length + (barra >= 0 ? 1 : 0);
          corpo.insertRow().append(td);
        }
        if (total) {
          total.replaceChildren();
          cabecalho.forEach((_, c) => {
            const soma = numericas[c] ? visiveis.reduce((s, l) => s + numeroCelula(l[c]), 0) : null;
            total.append(el('td', numericas[c] ? 'chat-num' : '', c === 0 ? 'Total' : soma == null ? '' : formatarComo(linhas[0][c], soma)));
            if (c === 0 && barra >= 0) total.append(el('td'));
          });
        }
        contagem.textContent = estado.filtro ? `${visiveis.length} de ${linhas.length} linhas` : '';
      }
      desenharLinhas();

      const bloco = el('div', 'chat-bloco');
      bloco.append(tabela);
      if (depois) bloco.append(el('p', 'chat-texto', depois));
      art.append(bloco);
      // Exporta a tabela completa, com as colunas fixas incluídas
      rodapeDados(art, [t.cabecalho, ...t.linhas], titulo);
      return art;
    }

    // "Nenhuma correspondência. … Localidade: FERNAO FERRO (41); Corroios (21); … (mostrados 30 de 101)"
    function lerSemResultado(texto) {
      // "Não foi possível encontrar dados para a actividade "Balcão". Os valores disponíveis para actividade são: Empresas (195); …"
      const naoEncontrou = texto.match(/n[ãa]o foi poss[íi]vel encontrar[^"“«]*?\bpara\s+(?:a|o)\s+([\p{L} ]+?)\s+["“«]([^"”»]+)["”»]/iu);
      if (naoEncontrou) {
        const resto = texto.slice(naoEncontrou.index + naoEncontrou[0].length).replace(/^[^:]*:/, '');
        // Separa por ";" e tira o número do fim: "JOGADOR (EMPREGADO) (29)" -> ["JOGADOR (EMPREGADO)", 29]
        const opcoes = resto.split(';').map(p => p.trim().match(/^(.+?)\s*\((\d+)\)\s*\.?$/)).filter(Boolean).map(x => [x[1], +x[2]]);
        if (opcoes.length) return { campo: naoEncontrou[1].trim(), errado: naoEncontrou[2].trim(), opcoes, mostrados: opcoes.length, total: 0 };
      }
      if (!/nenhuma correspond[êe]ncia/i.test(texto)) return null;
      const m = texto.match(/([A-Za-zÀ-ú][A-Za-zÀ-ú ]*?):\s*[^:()]+\(\d+\)/);   // "Localidade: X (41)"
      if (!m) return null;
      const resto = texto.slice(m.index + m[1].length + 1);
      const opcoes = [...resto.matchAll(/([^;()]+?)\s*\((\d+)\)/g)].map(x => [x[1].trim(), +x[2]]);
      const contagem = texto.match(/mostrados\s+(\d+)\s+de\s+(\d+)/i);
      return { campo: m[1].trim(), opcoes, mostrados: contagem ? +contagem[1] : opcoes.length, total: contagem ? +contagem[2] : 0 };
    }

    // "Sem vendas: Trimestre atual (01-10-2026 a 29-10-2026)" + "Atenção: …": o período não tem vendas
    function lerSemVendas(texto) {
      const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);
      const m = (linhas[0] || '').match(/^sem vendas\b(?:\s+registadas)?[\s:,-]*(?:n[oa]s?\s+|em\s+)?(.*?)\.?$/i);
      if (!m || linhas.length > 3) return null;
      const aviso = linhas.find(l => /^aten[çc][ãa]o\s*:/i.test(l));
      return { periodo: m[1], aviso: aviso ? aviso.replace(/^aten[çc][ãa]o\s*:\s*/i, '') : '' };
    }

    function folhaSemVendas(s, pergunta) {
      const art = el('article', 'chat-folha');
      const cab = el('div', 'chat-folha-cab');
      cab.append(el('h2', 'chat-vazio-titulo', 'Sem vendas neste período'));
      if (s.periodo) cab.append(el('p', 'chat-folha-meta', maiuscula(s.periodo)));
      art.append(cab);
      if (s.aviso) {
        const div = el('div', 'chat-aviso');
        div.setAttribute('role', 'note');
        const span = el('span');
        span.append(el('strong', '', 'Atenção: '), s.aviso);
        div.append(icone('M8 1.8 15 14H1L8 1.8ZM8 6v3.5M8 11.5v.5'), span);
        art.append(div);
      }
      // Outro período para tentar: o trimestre anterior (se era um trimestre), este ano e o ano passado
      const opcoes = [];
      const inicio = s.periodo.match(/(\d{2})-(\d{2})-(\d{4})/);
      if (/trimestre/i.test(s.periodo) && inicio) {
        const ini = new Date(+inicio[3], +inicio[2] - 4, 1), fim = new Date(+inicio[3], +inicio[2] - 1, 0);
        const d = x => x.toLocaleDateString('pt-PT').replace(/\//g, '-');
        opcoes.push([`Trimestre anterior (${d(ini)} a ${d(fim)})`, `entre ${d(ini)} e ${d(fim)}`]);
      }
      opcoes.push(['Este ano', 'este ano'], ['Ano passado', 'no ano passado']);
      const lista = el('div', 'chat-opcoes');
      opcoes.forEach(([nome, periodo]) => lista.append(botaoEl('chat-chip', nome, () => { if (!ocupado) perguntar(trocarPeriodo(pergunta, periodo)); })));
      art.append(el('h3', 'chat-opcoes-titulo', 'Ver outro período'), lista);
      return art;
    }

    function folhaSemResultado(s, pergunta) {
      const art = el('article', 'chat-folha');
      const cab = el('div', 'chat-folha-cab');
      cab.append(el('h2', 'chat-vazio-titulo', `Não encontrei esse valor de ${s.campo.toLowerCase()}`),
                 el('p', 'chat-folha-meta', 'Escolha um dos valores existentes. A pergunta corrigida fica no campo, para rever antes de enviar.'));
      art.append(cab);

      // Palavra da pergunta mais parecida com um valor existente ("Montija" -> "Montijo")
      const palavras = pergunta.split(/\s+/).filter(p => p.length > 3);
      let errada = s.errado && pergunta.includes(s.errado) ? s.errado : palavras[palavras.length - 1] || '';
      const parecidas = [];
      for (const p of palavras) {
        for (const o of s.opcoes) {
          if (!parecidas.includes(o) && distancia(semAcento(p), semAcento(o[0])) <= 2) { parecidas.push(o); errada = p; }
        }
      }
      const escolher = nome => { campo.value = errada ? pergunta.replace(errada, nome) : pergunta + ' ' + nome; campo.focus(); };
      const botoes = lista => {
        const d = el('div', 'chat-opcoes');
        lista.forEach(([nome, n]) => {
          const b = botaoEl('chat-chip', nomeProprio(nome), () => escolher(nomeProprio(nome)));
          b.append(el('small', '', String(n)));
          d.append(b);
        });
        return d;
      };
      if (parecidas.length) art.append(el('h3', 'chat-opcoes-titulo', 'Parecidos'), botoes(parecidas));
      const resto = s.opcoes.filter(o => !parecidas.includes(o) && !/^sem dados$/i.test(o[0]));
      art.append(el('h3', 'chat-opcoes-titulo', 'Com mais clientes'), botoes(resto.slice(0, 8)));
      if (resto.length > 8) {
        const mais = el('details', 'chat-mais');
        mais.append(el('summary', 'chat-acao', `Ver mais ${resto.length - 8}`), botoes(resto.slice(8)));
        art.append(mais);
      }
      rodapeDados(art, [[maiuscula(s.campo), 'Clientes'], ...s.opcoes.map(([nome, n]) => [nomeProprio(nome), String(n)])],
                  'valores ' + s.campo, s.total ? `mostrados ${s.mostrados} de ${s.total}` : '');
      return art;
    }

    // "NomeCliente" -> "Nome do cliente"; "Contribuinte" -> "NIF"; outros nomes de coluna: separa as palavras
    const CAMPOS = { nomecliente: 'Nome do cliente', contribuinte: 'NIF', nif: 'NIF', codcliente: 'Código do cliente', email: 'Email',
                     telefone: 'Telefone', telemovel: 'Telemóvel', localidade: 'Localidade', vendedor: 'Vendedor', zona: 'Zona', tipocliente: 'Tipo de cliente' };
    const rotuloCampo = k => /\s/.test(k) ? k
      : CAMPOS[semAcento(k).replace(/[^a-z]/g, '')] || maiuscula(k.replace(/(\p{Ll})(\p{Lu})/gu, '$1 $2').toLowerCase());
    // "Melhor marca em cada localidade" -> "Marca": nome da segunda coluna quando cada linha é "Localidade: Marca"
    const rotuloSub = titulo => maiuscula(((titulo || '').match(/\bmelhor(?:es)?\s+(\S+)/i) || [])[1] || 'Detalhe');

    // Um só registo (ex.: dados de um cliente): campo | valor, em vez de uma tabela com uma linha
    function folhaFicha(t) {
      const art = el('article', 'chat-folha chat-folha--painel');
      const antes = t.antes.split('\n').map(l => l.replace(MARCADOR, '').trim()).filter(Boolean).join(' ').replace(/:\s*$/, '');
      if (antes) { const cab = el('div', 'chat-folha-cab'); cab.append(el('h2', 'chat-folha-titulo', maiuscula(antes))); art.append(cab); }
      const dl = el('dl', 'chat-ficha');
      t.cabecalho.forEach((k, c) => dl.append(el('dt', '', rotuloCampo(k)), el('dd', '', t.linhas[0][c])));
      art.append(dl);
      if (t.depois) art.append(el('p', 'chat-texto', t.depois));
      rodapeDados(art, [['Campo', 'Valor'], ...t.cabecalho.map((k, c) => [rotuloCampo(k), t.linhas[0][c]])], antes || 'ficha');
      return art;
    }

    function formatar(texto, pergunta = '') {
      texto = texto.split('\n').map(limparMarkdown).join('\n');   // uma vez para todas as respostas, incluindo tabelas
      const s = lerSemResultado(texto);
      if (s) return folhaSemResultado(s, pergunta);
      const v = lerSemVendas(texto);
      if (v) return folhaSemVendas(v, pergunta);
      const t = lerTabela(texto);
      if (!t) return folhaLista(lerLista(texto), texto, pergunta);
      return t.linhas.length === 1 ? folhaFicha(t) : folhaTabela(t, pergunta);
    }

    /* =========================================================
       Ecrãs da zona de resposta
       ========================================================= */
    function tema() { return TEMAS.find(t => t.id === temaAtual); }

    function blocoSugestoes(titulo) {
      // só sugere o que ainda não tem resposta (as que deram erro ficam, para tentar de novo)
      const feitas = new Set(historico.filter(h => !h.erro).map(h => h.pergunta.toLowerCase()));
      const restantes = tema().perguntas.filter(p => !feitas.has(p.toLowerCase()));
      const perguntas = restantes.length ? restantes : tema().perguntas;   // todas feitas: volta a sugerir todas
      const sec = el('section', 'chat-sugestoes');
      const lista = el('div');
      perguntas.forEach(p => {
        const b = botaoEl('chat-chip', p, () => { if (!ocupado) perguntar(p); });
        b.disabled = ocupado;
        lista.append(b);
      });
      sec.append(el('h3', '', titulo), lista);
      return sec;
    }


    // Hora curta para a conversa: "10:25"
    const horaCurta = d => d ? d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : '';

    // Mensagem de quem pergunta: balão à direita, avatar, hora e (opcional) Editar / Repetir
    function mensagemEu(texto, hora, acoes) {
      const linha = el('div', 'chat-msg chat-msg--eu');
      const corpo = el('div', 'chat-msg-corpo');
      const balao = el('p', 'chat-balao-eu');
      balao.append(el('span', 'so-leitor', 'Pergunta: '), texto);
      const meta = el('div', 'chat-msg-meta');
      if (acoes) meta.append(...acoes);
      if (hora) meta.append(el('span', '', horaCurta(hora)));
      corpo.append(balao, meta);
      const avatar = el('span', 'chat-avatar-eu');
      avatar.append(icone('M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2.5 14.2c.7-2.7 2.9-4.2 5.5-4.2s4.8 1.5 5.5 4.2', 16));
      linha.append(corpo, avatar);
      return linha;
    }

    // Resposta do assistente: avatar à esquerda, nome por cima, hora por baixo
    function comAvatar(art, hora) {
      const linha = el('div', 'chat-resposta chat-msg chat-msg--agente');
      const corpo = el('div', 'chat-msg-corpo');
      const meta = el('div', 'chat-msg-meta');
      meta.append(el('span', '', 'Assistente de vendas' + (hora ? ' · ' + horaCurta(hora) : '')));
      corpo.append(art, meta);
      linha.append(corpo);
      return linha;
    }

    // Feedback na resposta: "Sim" ou "Não" + motivo. Envia para /feedback; se falhar, diz que falhou.
    function blocoFeedback(item) {
      const sec = el('div', 'chat-feedback');
      const motivos = el('div', 'chat-acoes');
      motivos.hidden = true;
      const enviar = async (avaliacao, motivo = '') => {
        sec.replaceChildren(el('span', '', 'A enviar a avaliação…'));
        try {
          const r = await fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pergunta: item.pergunta, resposta: item.texto, avaliacao, motivo, data: new Date().toISOString() })
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          sec.replaceChildren(el('span', '', 'Obrigado. A avaliação foi enviada.'));
          anunciar('Avaliação enviada.');
        } catch {
          sec.replaceChildren(el('span', '', 'Não foi possível enviar a avaliação.'));
          anunciar('Não foi possível enviar a avaliação.');
        }
      };
      ['Números errados', 'Não respondeu à pergunta', 'Difícil de ler'].forEach(m => motivos.append(botaoEl('chat-chip', m, () => enviar('nao', m))));
      const nao = botaoEl('chat-acao', 'Não', () => { motivos.hidden = false; nao.setAttribute('aria-expanded', 'true'); motivos.querySelector('button').focus(); });
      nao.setAttribute('aria-expanded', 'false');
      sec.append(el('span', '', 'Esta resposta está certa?'), botaoEl('chat-acao', 'Sim', () => enviar('sim')), nao, motivos);
      return sec;
    }

    /* ---------- Proposta A: painel de dados em separadores + conversa ---------- */
    const separadoresEl = document.getElementById('separadores');
    const painelEl = document.getElementById('painel');
    const painelRaiz = document.querySelector('.chat-painel');
    const abas = [];          // respostas abertas em separadores (no máximo 6)
    let abaAtiva = null;

    /* =========================================================
       REDESIGN 11/2026 — separador fixo "Resumo"
       GET /resumo?periodo=AnoAtual[&cliente=1003][&zona=Balcão] devolve os textos da ferramenta consultar_vendas
       (os mesmos do chat): lêem-se com lerLista/lerSerie e montam-se os blocos.
       Os dados só carregam quando pedidos: botão "Ver resumo", "resumo do cliente X" na conversa,
       um cliente do Top clientes ou "Ver resumo deste cliente" num ranking de clientes.
       ========================================================= */
    const RES_PERIODOS = [['Ultimos7Dias', 'Últimos 7 dias'], ['MesAtual', 'Este mês'], ['TrimestreAtual', 'Trimestre'], ['AnoAtual', 'Este ano'], ['Ultimos12Meses', 'Últimos 12 meses'], ['AnoAnterior', 'Ano passado']];
    const resumoEstado = { periodo: 'AnoAtual', zona: null, cliente: null, zonas: [], dados: null, erro: null, aCarregar: false, menu: null, pedido: false };
    let vistaResumo = false;  // o separador Resumo está à frente (só existe depois de ser pedido)
    let pedidosResumo = 0;    // só a resposta do último pedido conta (mudar de filtro a meio)

    // Formatação pt-PT com espaço fino nos milhares (também em números de 4 algarismos: 1 240)
    const rNB = ' ';
    const rGrupos = n => { let s = String(Math.round(Math.abs(n))), o = ''; while (s.length > 3) { o = rNB + s.slice(-3) + o; s = s.slice(0, -3); } return (n < 0 ? '−' : '') + s + o; };
    const rDec = (n, d) => { const [i, f] = Math.abs(n).toFixed(d).split('.'); return (n < 0 ? '−' : '') + rGrupos(+i) + (f ? ',' + f : ''); };
    const rEur = n => rGrupos(n) + rNB + '€';
    const rEur2 = n => rDec(n, 2) + rNB + '€';
    const rMil = n => rDec(n / 1000, 1) + rNB + 'mil' + rNB + '€';
    const rCurto = n => Math.abs(n) >= 1e6 ? rDec(n / 1e6, 2) + rNB + 'M€' : Math.abs(n) >= 1000 ? rMil(n) : rEur(n);   // um cliente pode faturar centenas, não milhões
    const rPct = n => rDec(n, 1) + '%';
    const rVar = v => v == null ? '–' : (v >= 0 ? '▲ ' : '▼ ') + rDec(Math.abs(v), 1) + '%';
    const rVarCls = v => v == null ? '' : v >= 0 ? 'res-sobe' : 'res-desce';
    const rEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const rValorKpi = k => k.valor == null ? '—' : k.tipo === 'eur' ? rEur(k.valor) : k.tipo === 'eur2' ? rEur2(k.valor) : rGrupos(k.valor);
    // Escala do eixo: passos "redondos" (50 mil, 5 mil, 500 €), no máximo 6 linhas
    function rEscala(valores) {
      const maxV = Math.max(...valores), minV = Math.max(0, Math.min(...valores));
      let passo = Math.pow(10, Math.floor(Math.log10(Math.max(maxV, 1)))) / 2;
      while ((maxV - minV) / passo > 6) passo *= 2;
      return { passo, max: Math.ceil(maxV / passo) * passo + passo / 5, min: Math.floor(minV / passo) * passo };
    }
    function rCurva(p) {
      let d = `M${p[0][0]},${p[0][1]}`;
      for (let i = 0; i < p.length - 1; i++) {
        const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
        d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      return d;
    }

    // A única porta para os dados do Resumo: conversa, sugestões, botão "Ver resumo", Top clientes e rankings chamam todos esta.
    // Os dados só carregam aqui, quando alguém os pede. cliente: ID ou início do nome (null = todas as vendas).
    function pedirResumo(periodo, cliente = null) {
      Object.assign(resumoEstado, { periodo: periodo || resumoEstado.periodo, cliente: cliente || null, zona: null, pedido: true, menu: null });
      vistaResumo = true;
      abaAtiva = null;
      desenharConversa();   // o cartão da resposta aberta deixa de dizer "Aberto no painel"
      carregarResumo();
    }

    // Pedido de resumo escrito na conversa -> { periodo, cliente }, ou null para seguir para o agente.
    // Estreita de propósito: "faturação por zona", "comparar com o ano passado" ou um artigo/zona concretos são perguntas ao agente.
    // "Hoje" também segue para o agente: o Resumo não tem esse período.
    function intencaoResumo(texto) {
      const t = semAcento(texto);
      if (!/\b(resumo|relatorio|visao geral|panorama|como (estao|esta|vao|vai) a?s? ?(vendas|faturacao))\b/.test(t)) return null;
      if (/\b(hoje|por|cada|face|compar\w*|top|melhor\w*|artigos?|familias?|marcas?|zonas?|localidades?|distritos?|vendedor\w*)\b/.test(t)) return null;
      const cliente = (texto.match(/\bcliente\s+["“«]?(.+?)["”»]?\s*\??$/i) || [])[1] || null;
      if (/\bclientes?\b/.test(t) && !cliente) return null;   // "resumo dos clientes": pergunta ao agente
      const periodo = /\bano passado\b/.test(t) ? 'AnoAnterior' : /\b12 meses\b/.test(t) ? 'Ultimos12Meses' : /\bsemana\b/.test(t) ? 'Ultimos7Dias'
        : /\btrimestre\b/.test(t) ? 'TrimestreAtual' : /\bmes\b/.test(t) ? 'MesAtual' : 'AnoAtual';
      return { periodo, cliente };
    }

    // "Abri o resumo das vendas de 2026 no painel."
    function fraseResumo({ periodo, cliente }) {
      const ano = new Date().getFullYear();
      const quando = { AnoAtual: `de ${ano}`, AnoAnterior: `de ${ano - 1}`, MesAtual: 'deste mês', TrimestreAtual: 'deste trimestre',
                       Ultimos12Meses: 'dos últimos 12 meses', Ultimos7Dias: 'dos últimos 7 dias' }[periodo];
      return `Abri o resumo das vendas ${quando}${cliente ? ` do cliente ${cliente}` : ''} no painel.`;
    }

    // Pedido escrito: bolha da pergunta + resposta curta com o cartão, como as outras respostas, mas sem passar pelo modelo
    function responderComResumo(texto, pedido) {
      historico.unshift({ pergunta: texto, texto: fraseResumo(pedido), resumo: pedido, erro: null, hora: new Date(), horaResposta: new Date() });
      pedirResumo(pedido.periodo, pedido.cliente);
      anunciar('Resumo aberto no painel.');
    }

    // Período de uma resposta ("01-01-2026 a 02-11-2026") em palavras que intencaoResumo percebe; null se não for um dos do Resumo
    function periodoEmPalavras(periodo) {
      const m = (periodo || '').match(/^(\d{2})-(\d{2})-(\d{4}) a (\d{2})-(\d{2})-(\d{4})$/);
      if (!m) return null;
      const hoje = new Date(), ano = hoje.getFullYear(), mes = hoje.getMonth() + 1;
      const [, d1, m1, a1, d2, m2, a2] = m.map(Number);
      if (d1 === 1 && m1 === 1 && a1 === ano - 1 && d2 === 31 && m2 === 12 && a2 === ano - 1) return 'do ano passado';
      if (d2 !== hoje.getDate() || m2 !== mes || a2 !== ano) return null;   // os períodos "deste …" acabam hoje
      if (d1 === 1 && a1 === ano && m1 === 1) return 'deste ano';
      if (d1 === 1 && a1 === ano && m1 === mes) return 'deste mês';
      if (d1 === 1 && a1 === ano && m1 === mes - (mes - 1) % 3) return 'deste trimestre';
      return null;
    }

    async function carregarResumo() {
      if (!resumoEstado.pedido) return;
      const n = ++pedidosResumo;
      Object.assign(resumoEstado, { aCarregar: true, erro: null, menu: null });
      if (vistaResumo) desenharPainel();
      try {
        const q = new URLSearchParams({ periodo: resumoEstado.periodo });
        if (resumoEstado.cliente) q.set('cliente', resumoEstado.cliente);
        if (resumoEstado.zona) q.set('zona', resumoEstado.zona);
        const r = await fetch('/resumo?' + q);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (n !== pedidosResumo) return;
        resumoEstado.dados = montarResumo(j);
        if (!resumoEstado.zona && !resumoEstado.cliente && resumoEstado.dados.locais) resumoEstado.zonas = resumoEstado.dados.locais;
      } catch (erro) {
        if (n !== pedidosResumo) return;
        console.error('Falha a carregar o resumo:', erro);
        resumoEstado.dados = null;
        resumoEstado.erro = 'Não foi possível carregar o resumo. Confirme que o agente está a correr e tente de novo.';
      }
      resumoEstado.aCarregar = false;
      if (vistaResumo) desenharPainel();
    }

    // Textos da ferramenta -> números dos blocos. Sem dados para um bloco, o bloco fica vazio (nunca inventa).
    function montarResumo(j) {
      const textoMeses = j.meses || '';
      const linha1 = textoMeses.split('\n')[0].trim();
      // "Cliente … não encontrado", "Vários clientes começam por …" (com a lista id,cliente) ou "Sem vendas: …"
      if (!/^Vendas por/.test(linha1)) {
        const [mensagem, lista = ''] = textoMeses.split(/\r?\nid,cliente\r?\n/);
        const opcoes = lista.split(/\r?\n/).map(l => partir(l.trim(), ',')).filter(c => c.length === 2 && c[0] && !c[0].startsWith('#'));
        return { erro: mensagem.trim(), opcoes };
      }
      const hoje = new Date();
      const num = (txt, re) => { const m = (txt || '').match(re); return m ? paraNumero(m[1]) : null; };
      const facto = (r, re) => r.factos.find(([k]) => re.test(k)) || ['', ''];
      const rm = lerLista(textoMeses), serie = lerSerie(rm);
      const comparado = facto(rm, /^comparado com/i);
      const anoAnt = (comparado[0].match(/(\d{4})$/) || [])[1] || null;
      const total = num(rm.resumo, /total\s+(-?[\d\s.,]+?)\s*€/);
