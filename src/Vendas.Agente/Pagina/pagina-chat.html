<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente de vendas</title>
  <style>
    /* =========================================================
       1. Tokens
       ========================================================= */
    :root {
      --fundo: #eef1f6;        
      --lateral: #f7f8fb;     
      --cartao: #ffffff;
      --texto: #16213a;
      --suave: #4a5570;        
      --nota: #566179;         
      --borda: #d5dbe6;
      --linha: #edf0f5;       
      --marca: #1d46c0;
      --marca-escura: #173a9e;
      --marca-texto: #ffffff;
      --selecionado: #dce4fa;  
      --balao-eu: var(--marca);  /* balão de quem pergunta: o azul do topo */
      --balao-eu-texto: var(--marca-texto);
      --barra-fundo: #e6ebf5;
      --aviso-fundo: #fff6e0;
      --aviso-borda: #e8c26a;
      --aviso-texto: #6b4a00;
      --ok: #5be3a0;
      --ocupado: #ffd27a;
      --desligado: #ff9a8f;
      --erro: #b42318;
      --borda-forte: #b4becf;  /* eixos e tracejados */
      --borda-cartao: #c3cbd8; /* contorno nítido dos cartões */
      --anterior: #b9c6ea;     /* barras do ano anterior */
      --anterior-linha: #7f93cc; /* linha tracejada do ano anterior */
      --sobe: #0f6b3f; --sobe-fundo: #e2f4ea;
      --desce: #a51b0f; --desce-fundo: #fde8e6;
      --borda-controlo: #7a8599; /* bordas de campos e botões: 3,5:1 */
      --ligacao: #1d46c0;        /* texto de botões e barras */
      /* Gráfico circular: 6 cores por ordem fixa, validadas para daltonismo */
      --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a; --serie-4: #eda100; --serie-5: #e87ba4; --serie-6: #6250d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0f1320;
        --lateral: #131826;
        --cartao: #171c2a;
        --texto: #e8ebf2;
        --suave: #b3bbcc;
        --nota: #9aa3b5;
        --borda: #2c3447;
        --linha: #232a3b;
        --marca: #3d63e6;
        --marca-escura: #3358d6;
        --selecionado: #24325a;
        --balao-eu: var(--marca);
        --balao-eu-texto: #ffffff;
        --barra-fundo: #232a3b;
        --aviso-fundo: #2e2612;
        --aviso-borda: #7a5f1c;
        --aviso-texto: #f3d38a;
        --erro: #ff8a7a;
        --borda-forte: #3a4459;
        --borda-cartao: #343d51;
        --anterior: #4a5a8a;
        --anterior-linha: #8597d6;
        --sobe: #7fd6a8; --sobe-fundo: #12372a;
        --desce: #ff9a8f; --desce-fundo: #3d1a17;
        --borda-controlo: #5d6a85;
        --ligacao: #8ea6ff;      /* 7,3:1 no cartão escuro */
        --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500; --serie-5: #d55181; --serie-6: #9085e9;
      }
    }

    /* =========================================================
       2. Base
       ========================================================= */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--cartao);
      color: var(--texto);
      font: 15px/1.45 system-ui, "Segoe UI", Tahoma, Roboto, Arial, sans-serif;   /* a letra do Windows, como o phpMyAdmin */
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    :focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
    [hidden] { display: none !important; }   /* sem isto, um display:flex ganha ao atributo hidden */
    .so-leitor {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* =========================================================
       3. Painel: ocupa a janela toda; o tamanho da janela é decidido pelo VisualIX
       ========================================================= */
    .chat-painel {
      height: 100dvh;
      display: flex; flex-direction: column;
      container-type: inline-size;   /* a barra lateral reage à largura do painel */
    }

    /* =========================================================
       4. Topo
       ========================================================= */
    .chat-topo {
      height: 52px; flex: none;
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
      background: var(--marca); color: var(--marca-texto);
    }
    .chat-topo :focus-visible { outline-color: #fff; }
    .chat-logo {
      display: block;
      height: 28px; width: auto; max-width: 140px;
      padding: 4px 8px;               /* fundo branco: o logo azul não desaparece no azul */
      background: #fff; border-radius: 6px;
      object-fit: contain;
    }
    .chat-separador { width: 1px; height: 20px; background: rgb(255 255 255 / .35); }
    .chat-avatar { display: block; width: 26px; height: 26px; flex: none; }
    .chat-titulo { flex: 1; margin: 0; font-size: 15px; font-weight: 700; }
    .chat-estado { margin: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
    .chat-ponto { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--ok); }
    .chat-estado--ocupado .chat-ponto { background: var(--ocupado); }
    .chat-estado--desligado .chat-ponto { background: var(--desligado); }

    /* =========================================================
       5. Corpo: barra lateral | zona principal
       ========================================================= */
    .chat-corpo { flex: 1; min-height: 0; display: flex; }

    .chat-lateral {
      width: 200px; flex: none;
      padding: 16px 10px;
      display: flex; flex-direction: column; gap: 22px;
      background: var(--lateral);
      border-right: 1px solid var(--borda);
      overflow-y: auto;
    }
    .chat-grupo { display: flex; flex-direction: column; gap: 2px; }
    .chat-temas { display: flex; flex-direction: column; gap: 2px; }
    .chat-rotulo { margin: 0 0 6px 10px; font-size: 12.5px; font-weight: 600; color: var(--suave); }
    .chat-dica { margin: 0 10px; font-size: 13px; color: var(--nota); }

    .chat-tema {
      min-height: 40px; padding: 0 10px;
      border: 0; border-radius: 6px;
      background: transparent;
      text-align: left; font-size: 14.5px;
    }
    .chat-tema:hover { background: var(--cartao); }
    .chat-tema[aria-pressed="true"] { background: var(--selecionado); font-weight: 700; }

    .chat-hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .chat-hist button {
      width: 100%; min-height: 36px; padding: 7px 10px;
      border: 0; border-radius: 6px; background: transparent;
      text-align: left; font-size: 13px; line-height: 1.35; color: var(--suave);
    }
    .chat-hist button span { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .chat-hist button:hover { background: var(--cartao); }
    .chat-hist button[aria-current="true"] { background: var(--cartao); color: var(--texto); font-weight: 600; box-shadow: inset 3px 0 0 var(--marca); }

    .chat-principal { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

    /* Painel estreito: os temas passam para uma linha por cima e o histórico esconde-se */
    @container (max-width: 560px) {
      .chat-corpo { flex-direction: column; }
      .chat-lateral { width: auto; flex-direction: row; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--borda); overflow-x: auto; }
      .chat-lateral .chat-rotulo, .chat-historico { display: none; }
      .chat-temas { flex-direction: row; }
      .chat-tema { white-space: nowrap; }
    }

    /* =========================================================
       6. Zona de resposta
       ========================================================= */
    .chat-area {
      flex: 1; min-height: 0;
      overflow-y: auto; overscroll-behavior: contain;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 16px;
      background: var(--fundo);
      scrollbar-width: thin; scrollbar-color: var(--borda) transparent;
    }
    /* Em ecrã largo a resposta não estica: linhas e tabelas ficam legíveis */
    .chat-area > * { width: 100%; max-width: 960px; }
    .chat-area > .chat-pergunta {
      width: auto; max-width: min(85%, 816px);
      margin-right: max(0px, calc(100% - 960px));   /* alinha com a margem direita da resposta */
    }
    .chat-intro { gap: 6px; }
    .chat-intro p { margin: 0; }
    .chat-intro-ola { font-size: 16px; font-weight: 700; }

    /* Avatar à esquerda, resposta ao lado */
    .chat-resposta { display: flex; align-items: flex-start; gap: 10px; }
    .chat-resposta > .chat-avatar { width: 32px; height: 32px; }
    .chat-resposta > .chat-folha { flex: 1; min-width: 0; }

    .chat-pergunta {
      align-self: flex-end; max-width: 85%;
      margin: 0; padding: 10px 14px;
      background: var(--selecionado);
      border-radius: 14px 14px 4px 14px;
    }

    .chat-sugestoes { display: flex; flex-direction: column; gap: 8px; }
    .chat-sugestoes h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--suave); }
    .chat-sugestoes div { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .chat-chip {
      min-height: 44px; padding: 10px 14px;
      border: 1px solid var(--borda-controlo); border-radius: 8px;
      background: var(--cartao); text-align: left; font-size: 14.5px;
    }
    .chat-chip:hover { border-color: var(--marca); }

    /* =========================================================
       7. Folha de resposta
       ========================================================= */
    .chat-folha {
      background: var(--cartao);
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
      animation: chat-entrar .18s ease-out;
    }
    .chat-folha:focus { outline: none; }
    .chat-folha-cab { display: flex; flex-direction: column; gap: 2px; }
    .chat-folha-titulo { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--suave); line-height: 1.4; }
    .chat-folha-meta { margin: 0; font-size: 12.5px; color: var(--nota); }
    .chat-folha-resumo { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chat-texto { margin: 0; white-space: pre-wrap; }

    .chat-aviso {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 12px;
      background: var(--aviso-fundo); color: var(--aviso-texto);
      border: 1px solid var(--aviso-borda); border-radius: 8px;
      font-size: 14px;
    }
    .chat-aviso svg { flex: none; margin-top: 2px; }

    /* Lista numerada: posição | nome e código | valor */
    .chat-lista-cab {
      display: flex; justify-content: flex-end;
      padding-bottom: 6px; border-bottom: 1px solid var(--borda);
      font-size: 12px; font-weight: 600; color: var(--nota);
    }
    .chat-lista { list-style: none; margin: 0; padding: 0; }
    .chat-item {
      display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px;
      align-items: start;
      padding: 9px 0; border-bottom: 1px solid var(--linha);
      font-variant-numeric: tabular-nums;
    }
    .chat-item:last-child { border-bottom: 0; }
    .chat-item-pos { font-size: 13px; color: var(--nota); padding-top: 1px; }
    .chat-item-corpo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .chat-item-nome { font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
    .chat-item-nome--vazio { font-style: italic; color: var(--suave); }
    .chat-item-codigo { font-size: 12.5px; color: var(--nota); }
    .chat-item-barra { display: block; height: 8px; margin-top: 6px; border-radius: 2px; background: var(--barra-fundo); }
    .chat-item-barra span { display: block; height: 100%; border-radius: 2px; background: var(--ligacao); }
    .chat-item-valor { display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-size: 14.5px; white-space: nowrap; }
    .chat-item-valor strong { font-weight: 700; }
    .chat-item-valor .chat-data { font-variant-numeric: normal; }
    .chat-item-rotulo, .chat-item-pct { font-size: 12.5px; color: var(--nota); }

    /* Resposta estruturada: cartões soltos sobre o fundo, como num painel de indicadores */
    .chat-folha--painel { background: transparent; border: 0; padding: 0; gap: 16px; }
    .chat-bloco {
      display: flex; flex-direction: column; gap: 14px;
      padding: 16px 18px;
      background: var(--cartao);
      border: 1px solid var(--borda-cartao); border-radius: 8px;
    }
    .chat-bloco--lista { gap: 0; padding-top: 8px; padding-bottom: 8px; }
    .chat-bloco--lista .chat-lista-cab { padding-top: 8px; }

    /* Cartões de números: rótulo pequeno, valor grande, variação ao lado, período por baixo */
    .chat-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; font-variant-numeric: tabular-nums; }
    .chat-kpi {
      display: flex; flex-direction: column; gap: 6px;
      min-height: 112px;
      padding: 16px 18px;
      background: var(--cartao);
      border: 1px solid var(--borda-cartao); border-radius: 8px;
    }
    .chat-kpi-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--suave); }
    .chat-kpi-icone { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--borda-cartao); color: var(--texto); }
    .chat-kpi-linha { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 2px; }
    .chat-kpi-valor { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
    .chat-kpi-detalhe { font-size: 13px; color: var(--nota); }

    /* Etiqueta de variação: verde sobe, vermelho desce, cinzento sem comparação */
    .chat-delta { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--fundo); color: var(--suave); }
    .chat-delta svg { flex: none; }
    .chat-delta--sobe { background: var(--sobe-fundo); color: var(--sobe); }
    .chat-delta--desce { background: var(--desce-fundo); color: var(--desce); }
    .chat-aviso .chat-justa { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; color: var(--texto); }

    /* Gráfico por mês: cabeçalho, legenda, eixo e leitura do mês escolhido */
    .chat-grafico { display: flex; flex-direction: column; gap: 12px; }
    .chat-grafico h3, .chat-meses h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--suave); }
    .chat-grafico-cab { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
    .chat-legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--suave); }
    .chat-legenda > span { display: flex; align-items: center; gap: 6px; }
    .chat-legenda-cor { width: 8px; height: 8px; border-radius: 50%; }
    .chat-grafico-corpo { display: flex; gap: 8px; }
    .chat-eixo { position: relative; width: 56px; height: 200px; flex: none; font-size: 11.5px; color: var(--nota); font-variant-numeric: tabular-nums; }
    .chat-eixo span { position: absolute; right: 0; white-space: nowrap; }
    .chat-colunas { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .chat-guia { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--borda); }
    .chat-rotulos { display: grid; font-size: 12px; text-align: center; color: var(--nota); }
    .chat-rotulos .chat-rotulo--ativo { color: var(--texto); font-weight: 700; }
    .chat-leitura { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; padding: 12px 14px; background: var(--lateral); border-radius: 8px; font-variant-numeric: tabular-nums; }
    .chat-leitura strong { min-width: 80px; font-size: 14px; }
    .chat-leitura div { display: flex; flex-direction: column; }
    .chat-leitura small { font-size: 12px; color: var(--nota); }

    /* Gráfico de linhas: evolução por mês */
    .chat-linha-area { position: relative; height: 200px; border-bottom: 1px solid var(--borda-forte); }
    .chat-linha-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .chat-linha-marca { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--borda-forte); }
    .chat-ponto-mes {
      position: absolute; width: 44px; height: 44px; padding: 0;   /* área de toque; o ponto visível continua pequeno */
      transform: translate(-50%, -50%);
      display: grid; place-items: center;
      border: 0; border-radius: 50%; background: transparent;
    }
    .chat-ponto-mes span { width: 10px; height: 10px; border-radius: 50%; background: var(--marca); box-shadow: 0 0 0 2px var(--cartao); }
    .chat-ponto-mes--parcial span { background: var(--cartao); box-shadow: inset 0 0 0 2px var(--marca); }
    .chat-ponto-mes:hover span, .chat-ponto-mes[aria-pressed="true"] span { width: 14px; height: 14px; box-shadow: 0 0 0 3px var(--selecionado); }
    .chat-ponto-mes--parcial[aria-pressed="true"] span { box-shadow: inset 0 0 0 2px var(--marca), 0 0 0 3px var(--selecionado); }
    .chat-legenda-atual { background: var(--marca); }
    .chat-legenda-traco { width: 16px !important; height: 0 !important; border-radius: 0 !important; border-top: 2px dashed var(--anterior-linha); }
    .chat-legenda-oca { width: 9px !important; height: 9px !important; box-shadow: inset 0 0 0 2px var(--marca); }

    /* Ranking: nome | barra grossa | valor, linhas juntas e eixo por baixo */
    .chat-ranking { gap: 0; }
    .chat-rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .chat-rank-linha {
      display: grid; grid-template-columns: 22px minmax(90px, 28%) minmax(60px, 1fr) minmax(96px, auto);
      gap: 12px; align-items: center;
      min-height: 36px;
      font-variant-numeric: tabular-nums;
    }
    .chat-rank-pos { font-size: 12.5px; color: var(--nota); }
    .chat-rank-nome { display: flex; flex-direction: column; min-width: 0; font-size: 14px; line-height: 1.25; }
    .chat-rank-nome span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-rank-nome small { font-size: 12px; color: var(--nota); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-rank-pista { display: block; height: 14px; border-radius: 3px; background: var(--barra-fundo); }
    .chat-rank-pista span { display: block; height: 100%; border-radius: 3px; background: var(--ligacao); }
    .chat-rank-valor { display: flex; flex-direction: column; align-items: flex-end; font-size: 14px; white-space: nowrap; }
    .chat-rank-valor strong { font-weight: 600; }
    .chat-rank-valor small { font-size: 12px; color: var(--nota); }
    .chat-rank-eixo { min-height: 0; margin-top: 8px; font-size: 12px; color: var(--nota); }
    .chat-rank-marcas { display: flex; justify-content: space-between; }
    .chat-rank-marcas span:first-child { transform: translateX(-30%); }
    .chat-rank-marcas span:last-child { transform: translateX(30%); }

    /* Tabela de detalhe por mês */
    .chat-meses { display: flex; flex-direction: column; font-size: 14px; font-variant-numeric: tabular-nums; }
    .chat-meses h3 { margin-bottom: 8px; }
    .chat-meses-linha { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, auto) minmax(90px, auto) minmax(90px, auto); gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--linha); }
    .chat-meses-linha > :not(:first-child) { text-align: right; }
    .chat-meses-cab { padding-top: 0; border-bottom-color: var(--borda); font-size: 12px; font-weight: 600; color: var(--nota); }
    .chat-meses-linha .chat-atual { font-weight: 600; }
    .chat-meses-linha .chat-ant { color: var(--suave); }

    /* Tabela (respostas em CSV) */
    .chat-tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
    .chat-tabela th { padding: 0 8px 6px 0; border-bottom: 1px solid var(--borda); text-align: left; font-size: 12px; font-weight: 600; color: var(--nota); white-space: nowrap; }
    .chat-tabela th::first-letter { text-transform: uppercase; }
    .chat-tabela td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--linha); }
    .chat-tabela .chat-num { text-align: right; padding-left: 8px; padding-right: 0; }
    .chat-barra { width: 64px; height: 8px; border-radius: 2px; background: var(--barra-fundo); }
    .chat-barra span { display: block; height: 100%; border-radius: 2px; background: var(--ligacao); }

    .chat-folha-rodape { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding-top: 2px; }
    .chat-folha-rodape .chat-folha-meta { margin-left: auto; }
    .chat-acao {
      align-self: flex-start;
      min-height: 36px; padding: 0;
      border: 0; background: none;
      color: var(--ligacao); font-size: 14px; font-weight: 600;
    }
    .chat-acao:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* Espera e erro */
    .chat-espera p { margin: 0; color: var(--suave); }
    .chat-pontos { display: flex; gap: 5px; margin: 0; }
    .chat-pontos[hidden], .chat-esqueleto[hidden] { display: none; }   /* o display: flex anulava o hidden */
    .chat-pontos span { width: 7px; height: 7px; border-radius: 50%; background: var(--suave); animation: chat-pulsar 1.2s infinite ease-in-out; }
    .chat-pontos span:nth-child(2) { animation-delay: .2s; }
    .chat-pontos span:nth-child(3) { animation-delay: .4s; }
    .chat-esqueleto { display: flex; flex-direction: column; gap: 9px; }
    .chat-esqueleto span { display: block; height: 10px; border-radius: 3px; background: var(--linha); animation: chat-pulsar 1.2s infinite ease-in-out; }
    .chat-esqueleto span:nth-child(1) { width: 90%; }
    .chat-esqueleto span:nth-child(2) { width: 72%; }
    .chat-esqueleto span:nth-child(3) { width: 56%; }
    .chat-folha--erro { border-color: var(--erro); }
    .chat-folha--erro p { margin: 0; color: var(--erro); }

    /* =========================================================
       7b. Correções de 10/2026: ficha, filtros, grupos, estado vazio
       ========================================================= */
    /* Factos em texto (nome, condição de pagamento): lista rótulo | valor */
    .chat-ficha {
      display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px;
      margin: 0; padding: 14px 18px;
      background: var(--cartao); border: 1px solid var(--borda-cartao); border-radius: 8px;
      font-size: 14px;
    }
    .chat-ficha dt { color: var(--suave); }
    .chat-ficha dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

    /* Colunas com o mesmo valor em todas as linhas (ex.: Vendedor) */
    .chat-filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chat-filtro {
      display: inline-flex; gap: 6px; padding: 3px 10px;
      background: var(--cartao); border: 1px solid var(--borda-cartao); border-radius: 99px;
      font-size: 12.5px;
    }
    .chat-filtro span { color: var(--nota); }

    /* Lista com grupos (ex.: Clientes em Odivelas / Torre da Marinha) */
    .chat-grupo-cab { padding: 12px 0 4px; border-bottom: 1px solid var(--borda); font-size: 13px; font-weight: 700; }
    .chat-grupo-cab span { font-weight: 400; color: var(--nota); }
    .chat-lista-titulo { margin: 8px 0 4px; font-size: 13px; font-weight: 600; color: var(--suave); }
    .chat-item-barra--neg span { background: var(--desce); }

    /* Sem correspondência: valores possíveis em botões */
    .chat-vazio-titulo { margin: 0; font-size: 16px; font-weight: 700; color: var(--texto); }
    .chat-opcoes-titulo { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--suave); }
    .chat-opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
    .chat-opcoes .chat-chip { min-height: 36px; padding: 6px 12px; font-size: 14px; }
    .chat-chip small { margin-left: 6px; color: var(--nota); font-variant-numeric: tabular-nums; }
    .chat-mais summary { display: inline-flex; align-items: center; list-style: none; cursor: pointer; }
    .chat-mais summary::-webkit-details-marker { display: none; }
    .chat-mais[open] summary { margin-bottom: 8px; }

    /* =========================================================
       7c. Layout compacto (modelo Ember): cartões baixos, gráfico limpo
       ========================================================= */
    :root { --kpi-2: #0e8a85; --kpi-3: #13814f; --kpi-4: #6f5fe0; }
    @media (prefers-color-scheme: dark) { :root { --kpi-2: #3cc4bd; --kpi-3: #5ccf97; --kpi-4: #a598ff; } }

    .chat-folha-titulo { font-size: 15px; font-weight: 700; color: var(--texto); }
    /* Total de uma lista ("5 clientes"): no cabeçalho, sem cartão */
    .chat-folha-total { margin: 2px 0 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chat-folha-total span { font-weight: 400; color: var(--nota); }

    /* Cartões: rótulo, valor com variação ao lado, detalhe; barra de cor à esquerda */
    .chat-kpis { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .chat-kpi { min-height: 0; gap: 2px; padding: 10px 14px 12px; border-left: 3px solid var(--marca); }
    .chat-kpi:nth-child(4n+2) { border-left-color: var(--kpi-2); }
    .chat-kpi:nth-child(4n+3) { border-left-color: var(--kpi-3); }
    .chat-kpi:nth-child(4n+4) { border-left-color: var(--kpi-4); }
    .chat-kpi-icone { display: none; }
    .chat-kpi-cab { font-size: 12.5px; }
    .chat-kpi-linha { margin-top: 0; gap: 4px 8px; }
    .chat-kpi-valor { font-size: 20px; font-weight: 700; }
    .chat-kpi-detalhe { font-size: 12px; }
    .chat-kpi .chat-delta { padding: 1px 7px; border-radius: 99px; font-size: 11.5px; }

    /* Gráfico: leitura do mês numa linha por cima, tabela por mês fechada */
    .chat-grafico { gap: 8px; }
    .chat-leitura { padding: 0; background: none; border-radius: 0; gap: 4px 16px; font-size: 13px; }
    .chat-leitura strong { min-width: 0; font-size: 13px; }
    .chat-leitura div { flex-direction: row; align-items: baseline; gap: 6px; }
    .chat-meses > summary { cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 600; color: var(--marca); }
    .chat-meses > summary::-webkit-details-marker { display: none; }
    .chat-meses[open] > summary { margin-bottom: 10px; }

    /* Ranking: uma linha por item, valor e % lado a lado */
    /* Ranking: todas as linhas partilham as mesmas colunas (subgrid), por isso nada se sobrepõe.
       posição | nome | barra | valor (e valor secundário por baixo) | variação */
    .chat-ranking { display: grid; grid-template-columns: 22px minmax(110px, 26%) minmax(60px, 1fr) max-content max-content; column-gap: 12px; }
    .chat-rank, .chat-rank-linha { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
    .chat-rank { row-gap: 2px; }
    .chat-rank-linha { min-height: 40px; }
    .chat-rank-pista { height: 10px; }
    .chat-rank-valor { flex-direction: column; align-items: flex-end; gap: 0; }
    .chat-rank-delta { display: flex; }
    @container (max-width: 640px) {
      /* Janela estreita: a barra e o eixo saem; ficam nome, valor e variação */
      .chat-ranking { grid-template-columns: 22px minmax(0, 1fr) max-content max-content; }
      .chat-rank-pista, .chat-rank-eixo { display: none; }
    }

    /* Ranking interativo: controlos, linha que abre o detalhe */
    .chat-controlos { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .chat-seg { display: inline-flex; border: 1px solid var(--borda-controlo); border-radius: 8px; overflow: hidden; background: var(--cartao); }
    .chat-seg button { border: 0; background: none; padding: 5px 12px; min-height: 34px; font-size: 13.5px; }
    .chat-seg button + button { border-left: 1px solid var(--borda-controlo); }
    .chat-seg button[aria-pressed="true"] { background: var(--marca); color: var(--marca-texto); font-weight: 600; }
    .chat-rank > li { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
    button.chat-rank-linha { align-items: center; margin: 0 -8px; padding: 2px 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
    button.chat-rank-linha:hover { background: var(--lateral); }
    button.chat-rank-linha[aria-expanded="true"] { background: var(--selecionado); }
    .chat-rank-detalhe { grid-column: 1 / -1; margin: 4px 0 10px 34px; padding: 12px 14px; border-left: 3px solid var(--ligacao); border-radius: 0 8px 8px 0; background: var(--lateral); display: flex; flex-direction: column; gap: 10px; }
    .chat-rank-detalhe strong { font-size: 14.5px; }
    .chat-factos { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; }
    .chat-factos div { display: flex; flex-direction: column; }
    .chat-factos dt { font-size: 12px; color: var(--nota); }
    .chat-factos dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chat-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
    .chat-acoes .chat-chip { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
    @container (max-width: 640px) { .chat-rank-detalhe { margin-left: 0; } }

    /* Tabela: cabeçalhos que ordenam, filtro e total */
    .chat-ordenar { display: inline-flex; align-items: center; gap: 2px; min-height: 28px; padding: 0; border: 0; background: none; font-weight: 600; }
    .chat-tabela th[aria-sort] .chat-ordenar { color: var(--texto); }
    .chat-tabela tfoot td { padding-top: 8px; border-top: 1px solid var(--borda); border-bottom: 0; font-weight: 700; }
    .chat-tabela-vazia { color: var(--nota); }
    .chat-filtrar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--nota); }
    .chat-filtrar input { min-height: 36px; padding: 0 10px; border: 1px solid var(--borda-controlo); border-radius: 8px; background: var(--cartao); width: min(260px, 100%); }

    .chat-kpi--acao { cursor: pointer; }
    .chat-kpi--acao:hover { border-color: var(--ligacao); }

    /* Como li a pergunta, editar e repetir, destaque, feedback */
    .chat-filtro--botao { border-color: var(--borda-controlo); font-size: 12.5px; cursor: pointer; }
    .chat-filtro--botao:hover { border-color: var(--ligacao); }
    .chat-periodos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chat-periodos .chat-chip { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    .chat-area > .chat-pergunta-bloco {
      align-self: flex-end; width: auto; max-width: min(85%, 816px);
      margin-right: max(0px, calc(100% - 960px));
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    }
    .chat-pergunta-bloco .chat-pergunta { max-width: 100%; }
    .chat-pergunta-acoes { display: flex; gap: 14px; }
    .chat-pergunta-acoes .chat-acao { min-height: 28px; font-size: 12.5px; }
    .chat-destaque { margin: 0; font-size: 14.5px; line-height: 1.5; }
    .chat-feedback { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-left: 42px; font-size: 13px; color: var(--nota); }
    .chat-feedback .chat-acao { min-height: 32px; font-size: 13px; }
    .chat-feedback .chat-acoes { flex-basis: 100%; }

    /* =========================================================
       7f. Conversa em balões: avatar, nome e hora dos dois lados
       ========================================================= */
    .chat-area { background: var(--cartao); }
    .chat-msg { display: flex; gap: 10px; }
    .chat-msg-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .chat-msg-nome { font-size: 12.5px; font-weight: 600; color: var(--suave); }
    .chat-msg-meta { display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--nota); }
    .chat-msg-meta .chat-acao { min-height: 28px; font-size: 12.5px; }
    /* Quem pergunta: à direita, balão escuro, avatar à direita */
    .chat-area > .chat-msg--eu { align-self: flex-end; width: auto; max-width: min(85%, 816px); margin-right: max(0px, calc(100% - 960px)); align-items: flex-end; }
    .chat-msg--eu .chat-msg-corpo { align-items: flex-end; }
    .chat-balao-eu { margin: 0; padding: 10px 16px; border-radius: 18px 18px 4px 18px; background: var(--balao-eu); color: var(--balao-eu-texto); overflow-wrap: anywhere; }
    .chat-avatar-eu { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--selecionado); color: var(--ligacao); }
    /* Assistente: à esquerda, nome por cima, resposta num balão claro */
    .chat-msg--agente > .chat-avatar { width: 32px; height: 32px; flex: none; }
    .chat-msg--agente .chat-folha, .chat-msg--agente .chat-folha--painel { background: var(--fundo); border: 0; border-radius: 4px 18px 18px 18px; padding: 14px 16px; }
    .chat-msg--agente .chat-folha--erro { border: 1px solid var(--erro); }

    /* =========================================================
       7h. Gráfico circular (partes de um total)
       ========================================================= */
    .chat-circulo { display: flex; flex-direction: row; align-items: center; gap: 32px; flex-wrap: wrap; }
    .chat-circulo-roda { position: relative; width: 180px; height: 180px; flex: none; }
    .chat-circulo-roda svg { width: 100%; height: 100%; transform: none; }
    .chat-circulo-roda circle { fill: none; stroke-width: 20; }
    .chat-circulo-centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px; }
    .chat-circulo-centro strong { font-size: 20px; }
    .chat-circulo-centro span { font-size: 12px; color: var(--nota); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .chat-circulo-legenda { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 240px; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
    .chat-circulo-legenda li { display: grid; grid-template-columns: 12px 1fr max-content 52px; align-items: center; gap: 10px; }
    .chat-circulo-cor { width: 12px; height: 12px; border-radius: 3px; }
    .chat-circulo-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-circulo-legenda small { text-align: right; color: var(--nota); font-size: 12.5px; }
    /* =========================================================
       7g. Proposta A: dados ao centro em separadores, conversa à direita
       ========================================================= */
    .chat-dados { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--fundo); }
    .chat-abas { display: flex; align-items: flex-end; gap: 8px; padding: 10px 20px 0; background: var(--lateral); border-bottom: 1px solid var(--borda); }
    .chat-abas-lista { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
    .chat-aba { display: flex; align-items: center; flex: none; margin-bottom: -1px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; }
    .chat-aba--ativa { background: var(--fundo); border-color: var(--borda); }
    .chat-aba-abrir { max-width: 220px; padding: 9px 4px 9px 12px; border: 0; background: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--suave); font-size: 13.5px; }
    .chat-aba--ativa .chat-aba-abrir { color: var(--texto); font-weight: 600; }
    .chat-aba-fechar { width: 28px; height: 28px; margin-right: 4px; border: 0; border-radius: 6px; background: none; color: var(--nota); font-size: 16px; }
    .chat-aba-fechar:hover { background: var(--linha); }
    .chat-mostrar-conversa { margin-bottom: 4px; }
    .chat-painel:not(.chat-painel--sem-conversa) .chat-mostrar-conversa { display: none; }
    .chat-painel-dados { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; }
    .chat-painel-dados > .chat-folha { max-width: 1100px; }
    /* painel vazio: o texto fica ao centro, na horizontal e na vertical */
    .chat-painel-dados:has(> .chat-painel-vazio) { display: grid; place-items: center; }
    .chat-painel-vazio { max-width: 52ch; text-align: center; display: flex; flex-direction: column; gap: 8px; color: var(--suave); }
    /* esqueleto enquanto o agente responde: o mesmo desenho de uma resposta (título, cartões, gráfico) */
    .chat-painel-esqueleto { max-width: 1100px; display: flex; flex-direction: column; gap: 16px; }
    .chat-painel-esqueleto :is(.chat-esq-linha, .chat-esq-cartao, .chat-esq-grafico span) { display: block; border-radius: 6px; background: var(--linha); animation: chat-pulsar 1.2s infinite ease-in-out; }
    .chat-esq-linha { height: 22px; width: 40%; }
    .chat-esq-linha--curta { height: 14px; width: 24%; }
    .chat-esq-cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .chat-esq-cartao { height: 76px; }
    .chat-esq-grafico { height: 220px; display: flex; align-items: flex-end; gap: 4%; padding: 12px; border: 1px solid var(--linha); border-radius: 8px; }
    .chat-esq-grafico span { flex: 1; }
    .chat-painel-vazio h2 { margin: 0; font-size: 18px; color: var(--texto); }
    .chat-painel-vazio p { margin: 0; }

    .chat-conversa { width: 380px; flex: none; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--borda); background: var(--cartao); }
    .chat-painel--sem-conversa .chat-conversa { display: none; }
    .chat-conversa-cab { padding: 12px 16px; border-bottom: 1px solid var(--linha); display: flex; flex-direction: column; gap: 10px; }
    .chat-conversa-topo { display: flex; align-items: center; justify-content: space-between; }
    .chat-conversa-titulo { margin: 0; font-size: 14px; font-weight: 700; }
    .chat-esconder { width: 32px; height: 32px; border: 0; border-radius: 6px; background: none; color: var(--nota); font-size: 16px; }
    .chat-esconder:hover { background: var(--linha); }
    .chat-conversa .chat-temas { flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .chat-conversa .chat-tema { min-height: 30px; padding: 4px 12px; border: 1px solid var(--borda-controlo); border-radius: 99px; background: var(--cartao); font-size: 13px; }
    .chat-conversa .chat-tema[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: var(--marca-texto); }
    .chat-conversa .chat-area { padding: 16px; gap: 14px; }
    .chat-conversa .chat-folha { gap: 10px; }
    .chat-conversa .chat-msg--agente ~ .chat-sugestoes, .chat-conversa .chat-feedback { margin-left: 0; padding-left: 42px; box-sizing: border-box; }
    .chat-cartao { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--borda-controlo); border-radius: 8px; background: var(--cartao); text-align: left; color: var(--ligacao); }
    .chat-cartao[aria-current="true"] { padding: 7px 9px; border: 2px solid var(--ligacao); }
    .chat-cartao-texto { display: flex; flex-direction: column; min-width: 0; color: var(--texto); }
    .chat-cartao-texto b { font-size: 13px; }
    .chat-cartao-texto small { font-size: 12px; color: var(--nota); }

    /* Janela estreita: os dados em cima, a conversa em baixo */
    @container (max-width: 820px) {
      .chat-corpo { flex-direction: column; }
      .chat-conversa { width: auto; flex: 1; border-left: 0; border-top: 1px solid var(--borda); }
    }

    /* =========================================================
       7i. Layout C: conversa numa janela flutuante, estilo widget de chat
       ========================================================= */
    .chat-corpo { position: relative; }
    /* os dados e os separadores não ficam por baixo da janela */
    .chat-painel:not(.chat-painel--sem-conversa) :is(.chat-abas, .chat-painel-dados) { padding-right: 408px; }
    .chat-conversa {
      position: absolute; z-index: 5; top: 16px; right: 20px; bottom: 84px; width: 368px;
      border: 1px solid var(--borda); border-radius: 18px; overflow: hidden;
      box-shadow: 0 12px 32px rgb(22 33 58 / .18);
      font-size: 13.5px;
    }
    .chat-conversa-cab { padding: 0; gap: 0; }
    .chat-conversa-topo { gap: 10px; padding: 12px 10px 12px 14px; border-bottom: 1px solid var(--linha); }
    .chat-conversa-topo .chat-avatar { width: 32px; height: 32px; }
    .chat-conversa-nome { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .chat-conversa .chat-estado { font-size: 12px; color: var(--suave); }
    .chat-conversa .chat-ponto { width: 7px; height: 7px; background: #1f9d62; }
    .chat-conversa .chat-temas { padding: 8px 14px; border-bottom: 1px solid var(--linha); }
    .chat-conversa .chat-tema { min-height: 28px; padding: 3px 11px; font-size: 12.5px; }
    .chat-conversa .chat-tema[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--cartao); }

    /* Balões compactos, sem avatar em cada mensagem */
    .chat-conversa .chat-area { padding: 12px 14px; gap: 10px; }
    .chat-conversa .chat-msg > .chat-avatar, .chat-conversa .chat-avatar-eu { display: none; }
    .chat-conversa .chat-msg-corpo { gap: 3px; }
    .chat-conversa .chat-msg--agente .chat-folha, .chat-conversa .chat-msg--agente .chat-folha--painel { max-width: 88%; padding: 8px 12px; border-radius: 16px; gap: 8px; }
    .chat-conversa .chat-balao-eu { padding: 8px 12px; border-radius: 16px; line-height: 1.45; }
    .chat-conversa .chat-area > .chat-msg--eu { max-width: 82%; }
    .chat-conversa .chat-msg-meta { gap: 10px; }
    .chat-conversa .chat-intro-ola { font-size: 13.5px; }
    .chat-conversa .chat-cartao { padding: 7px 10px; border-radius: 12px; }
    .chat-conversa .chat-msg--agente ~ .chat-sugestoes, .chat-conversa .chat-feedback { padding-left: 0; }
    .chat-conversa .chat-sugestoes .chat-chip { padding: 6px 11px; border-radius: 99px; font-size: 12.5px; }
    .chat-conversa .chat-opcoes .chat-chip { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
    .chat-conversa .chat-acao, .chat-conversa .chat-vazio-titulo { font-size: 13.5px; }

    /* Caixa de escrita com contorno, botão de enviar redondo */
    .chat-conversa .chat-rodape { margin: 0 12px 10px; padding: 8px 8px 8px 12px; border: 1.5px solid var(--texto); border-radius: 14px; gap: 4px; }
    .chat-conversa .chat-rodape:focus-within { outline: 2px solid var(--ligacao); outline-offset: 2px; }
    .chat-conversa .chat-campo { min-height: 32px; padding: 0; border: 0; background: none; font-size: 13.5px; }
    .chat-conversa .chat-campo:focus-visible { outline: none; }   /* o contorno vai na caixa toda */
    .chat-conversa .chat-enviar { width: 32px; height: 32px; border-radius: 50%; }
    .chat-conversa .chat-rodape-texto { font-size: 11.5px; }

    /* Botão redondo: mostra e esconde a janela */
    .chat-lancador {
      position: absolute; z-index: 6; right: 20px; bottom: 20px; width: 52px; height: 52px;
      display: grid; place-items: center; border: 0; border-radius: 50%;
      background: var(--texto); color: var(--cartao); box-shadow: 0 6px 16px rgb(22 33 58 / .25);
    }
    .chat-lancador[aria-expanded="true"] .chat-lancador-abrir, .chat-lancador[aria-expanded="false"] .chat-lancador-fechar { display: none; }

    /* Janela estreita: a conversa ocupa o painel todo quando está aberta */
    @container (max-width: 820px) {
      .chat-painel:not(.chat-painel--sem-conversa) :is(.chat-abas, .chat-painel-dados) { padding-right: 20px; }
      .chat-conversa { top: 8px; left: 8px; right: 8px; bottom: 80px; width: auto; }
    }
    /* =========================================================
       7j. Painel de dados: uma só escala de letra e o mesmo espaçamento
       15px títulos · 13,5px texto e valores (igual à conversa) · 12px notas · 20px cartões
       ========================================================= */
    .chat-painel-dados { font-size: 13.5px; line-height: 1.45; }
    .chat-painel-dados :is(.chat-item-nome, .chat-item-valor, .chat-destaque, .chat-rank-nome, .chat-rank-valor, .chat-folha-total, .chat-seg button, .chat-texto, .chat-ficha, .chat-acao) { font-size: 13.5px; }
    .chat-painel-dados :is(.chat-item-pos, .chat-item-codigo, .chat-item-rotulo, .chat-item-pct, .chat-folha-meta, .chat-filtro, .chat-chip, .chat-kpi-cab, .chat-kpi-detalhe, .chat-rank-pos, .chat-rank-nome small, .chat-rank-valor small, .chat-filtrar) { font-size: 12px; }
    .chat-painel-dados .chat-item { padding: 7px 0; gap: 2px 10px; }
    .chat-painel-dados .chat-item-nome { line-height: 1.4; }
    .chat-painel-dados :is(.chat-item-valor strong, .chat-ficha dd) { font-weight: 600; }
    .chat-painel-dados .chat-barra { width: 100%; min-width: 64px; max-width: 200px; }   /* a barra da tabela usa a coluna toda */

    /* =========================================================
       7k. REDESIGN 11/2026 — Inforap Flow
       Separador Resumo, só depois de pedido (dados de GET /resumo, geral ou de um cliente), barra fixa,
       voltar ao topo e gráfico mensal em barras. A conversa NÃO muda.
       ========================================================= */
    .chat-titulo { font-size: 16px; font-weight: 800; }

    /* Barra fixa no topo do painel ao fazer scroll */
    .res-barra {
      position: sticky; top: -20px; z-index: 4;
      margin: -20px -24px 14px; padding: 14px 24px 10px;
      background: var(--fundo); border-bottom: 1px solid var(--borda);
      display: flex; flex-direction: column; gap: 8px;
    }
    .res-linha { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; }
    .res-titulo { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .res-icone { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--marca); color: var(--marca-texto); }
    .res-titulo h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .res-data { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 99px; background: var(--selecionado); color: var(--texto); font-size: 13.5px; font-weight: 600; }
    .res-btn { min-height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--borda-controlo); border-radius: 8px; background: var(--cartao); font-size: 13.5px; font-weight: 700; }
    .res-btn[aria-expanded="true"] { border: 2px solid var(--ligacao); background: var(--selecionado); }
    .res-btn--primario { border-color: var(--marca); background: var(--marca); color: var(--marca-texto); }
    .res-contador { min-width: 20px; height: 20px; padding: 0 5px; display: inline-grid; place-items: center; border-radius: 99px; background: var(--marca); color: var(--marca-texto); font-size: 12px; }
    .res-info { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--nota); }
    .res-aviso { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; background: var(--aviso-fundo); border: 1px solid var(--aviso-borda); color: var(--aviso-texto); font-weight: 600; }
    .res-filtro-ativo { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border: 2px solid var(--ligacao); border-radius: 8px; background: var(--selecionado); font-size: 13px; }

    /* Menu Filtros */
    .res-menu-wrap { position: relative; }
    .res-menu {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: 7; width: 340px;
      padding: 14px; display: flex; flex-direction: column; gap: 12px;
      background: var(--cartao); border: 1px solid var(--borda-cartao); border-radius: 12px;
      box-shadow: 0 12px 32px rgb(22 33 58 / .18);
    }
    .res-menu h3 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
    .res-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .res-chip { min-height: 34px; padding: 0 12px; border: 1px solid var(--borda-controlo); border-radius: 99px; background: var(--cartao); font-size: 13px; }
    .res-chip[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: var(--marca-texto); font-weight: 700; }
    .res-menu-rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--linha); }
    .res-cliente { display: flex; gap: 6px; margin: 0; }
    .res-cliente input { flex: 1; min-width: 0; min-height: 38px; padding: 0 10px; border: 1px solid var(--borda-controlo); border-radius: 8px; background: var(--lateral); }
    .res-nota { margin: 0; font-size: 12.5px; color: var(--nota); }

    /* Conteúdo do Resumo */
    .res-conteudo { display: flex; flex-direction: column; gap: 14px; max-width: 1400px; font-variant-numeric: tabular-nums; }
    .res-grelha { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
    .res-cartao { flex: 1 1 420px; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--cartao); border: 1px solid var(--borda-cartao); border-radius: 8px; }
    .res-cartao--largo { flex: 2 1 520px; }
    .res-cartao--atencao { flex: 1 1 280px; border-top: 3px solid #b45309; }
    .res-cartao h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .res-sub { margin: 2px 0 0; font-size: 12px; color: var(--nota); }
    .res-cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .res-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .res-kpis .chat-kpi-valor { font-size: 19px; }
    .res-legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--suave); }
    .res-legenda span { display: inline-flex; align-items: center; gap: 6px; }

    .res-grafico { position: relative; margin-left: 54px; }
    .res-grafico svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .res-y { position: absolute; left: -58px; width: 52px; text-align: right; font-size: 11px; color: var(--nota); white-space: nowrap; transform: translateY(-50%); }
    .res-x { position: relative; height: 18px; margin-left: 54px; font-size: 12px; }
    .res-x span { position: absolute; transform: translateX(-50%); font-weight: 600; }
    .res-ponto { position: absolute; transform: translate(-50%, -50%); }
    .res-rotulo { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11px; font-weight: 700; }
    .res-zona { position: absolute; top: 0; height: 100%; padding: 0; border: 0; background: transparent; cursor: crosshair; }
    .res-tooltip { position: absolute; top: 4px; z-index: 3; transform: translateX(-50%); padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--cartao); border: 1px solid var(--borda-controlo); border-radius: 8px; box-shadow: 0 6px 16px rgb(22 33 58 / .15); font-size: 12.5px; white-space: nowrap; pointer-events: none; }

    .res-alertas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .res-alertas li { display: flex; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--linha); }
    .res-alerta-ic { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 6px; font-size: 12px; font-weight: 800; }
    .res-alerta-tag { font-size: 11.5px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }

    .res-tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .res-tabela th, .res-tabela td { padding: 6px; }
    .res-tabela thead th { font-size: 12px; font-weight: 600; color: var(--nota); text-align: right; }
    .res-tabela thead th:first-child, .res-tabela tbody th { text-align: left; }
    .res-tabela tbody tr { border-top: 1px solid var(--linha); }
    .res-tabela tbody th { font-weight: 600; }
    .res-tabela td { text-align: right; white-space: nowrap; color: var(--suave); }
    .res-tabela td.forte { font-weight: 700; color: var(--texto); }
    .res-pista { display: block; height: 6px; max-width: 220px; margin-top: 4px; border-radius: 3px; background: var(--barra-fundo); }
    .res-pista > span { display: block; height: 100%; border-radius: 3px; }
    .res-destaques { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .res-destaque { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--borda-cartao); border-radius: 8px; font-size: 12.5px; color: var(--suave); }
    .res-destaque strong { font-size: 13.5px; color: var(--texto); }
    .res-sobe { color: var(--sobe); font-weight: 700; } .res-desce { color: var(--desce); font-weight: 700; }

    .res-locais { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }   /* sempre numa linha */
    .res-local { width: 100%; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--linha); border-radius: 8px; background: var(--cartao); }
    .res-local[aria-pressed="true"] { border: 2px solid var(--ligacao); background: var(--selecionado); }
    .res-local-area { width: 100%; height: 160px; display: flex; align-items: flex-end; justify-content: center; border-bottom: 2px solid var(--borda-forte); }
    .res-local-barra { width: 70%; max-width: 54px; border-radius: 5px 5px 0 0; background: var(--anterior-linha); }
    .res-local[aria-pressed="true"] .res-local-barra { background: var(--marca); }

    .res-clientes { list-style: none; margin: 0; padding: 0; }
    .res-clientes li { display: grid; grid-template-columns: 22px minmax(0, 1fr) 96px 70px; align-items: center; gap: 8px; min-height: 34px; border-top: 1px solid var(--linha); font-size: 13.5px; }
    .res-clientes .chat-acao { display: block; width: 100%; min-height: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }

    .res-pedir { margin: 40px auto; gap: 14px; }
    .res-exemplo { display: inline-flex; padding: 2px 8px; border: 1px dashed var(--borda-controlo); border-radius: 6px; font-size: 12px; color: var(--nota); }
    .res-esqueleto span { display: block; border-radius: 6px; background: var(--linha); animation: chat-pulsar 1.2s infinite ease-in-out; }

    /* Voltar ao topo: ao lado do botão redondo da conversa */
    .res-topo {
      position: absolute; z-index: 6; right: 26px; bottom: 84px; width: 40px; height: 40px;   /* por cima do botão da conversa */
      display: grid; place-items: center; border: 1px solid var(--borda-controlo); border-radius: 50%;
      background: var(--cartao); color: var(--texto); box-shadow: 0 4px 12px rgb(22 33 58 / .15);
    }

    /* Gráfico mensal em barras (substitui a linha nas respostas por mês) */
    .chat-barra-mes { position: absolute; bottom: 0; transform: translateX(-50%); border-radius: 4px 4px 0 0; background: var(--marca); pointer-events: none; }
    .chat-barra-mes--ant { background: var(--anterior); }
    .chat-barra-mes--parcial { background: repeating-linear-gradient(135deg, var(--aviso-borda) 0 5px, var(--cartao) 5px 10px); border: 2px dashed #c2410c; border-bottom: 0; }
    .chat-barra-valor { position: absolute; transform: translate(-50%, -100%); padding: 0 3px; border-radius: 3px; background: var(--cartao); font-size: 11px; font-weight: 700; white-space: nowrap; pointer-events: none; }
    .chat-legenda-barra { width: 10px !important; height: 10px !important; border-radius: 2px !important; background: var(--marca); }
    .chat-legenda-barra--ant { background: var(--anterior); }
    .chat-legenda-barra--parcial { background: repeating-linear-gradient(135deg, var(--aviso-borda) 0 3px, var(--cartao) 3px 6px); outline: 1px dashed #c2410c; }
    .chat-linha-area .chat-ponto-mes span { opacity: 0; }
    .chat-linha-area .chat-ponto-mes:hover span, .chat-linha-area .chat-ponto-mes[aria-pressed="true"] span { opacity: 1; width: 10px; height: 10px; background: var(--texto); box-shadow: 0 0 0 2px var(--cartao); }

    @container (max-width: 820px) { .res-destaques { grid-template-columns: 1fr; } }

    /* Posição e alinhamento do modelo "Resumo — chat minimizado" */
    /* Separadores e Resumo centrados na mesma coluna em ecrã largo (com a conversa aberta fica o padding de 408px) */
    .chat-dados:has(.res-barra, .res-pedir) :is(.chat-abas, .chat-painel-dados) { padding-left: max(20px, calc((100% - 1520px) / 2)); }
    .chat-painel.chat-painel--sem-conversa .chat-dados:has(.res-barra, .res-pedir) :is(.chat-abas, .chat-painel-dados) { padding-right: max(20px, calc((100% - 1520px) / 2)); }
    .res-conteudo, .chat-painel-dados > .chat-folha:has(> .res-barra) { max-width: none; }
    /* Indicadores: todos numa linha, mesma largura; valor, variação e frase por baixo uns dos outros */
    .res-kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .res-kpis .chat-kpi { gap: 4px; padding: 12px 14px; border-left: 1px solid var(--borda-cartao); }
    .res-var { font-size: 12.5px; }
    .res-aviso svg { flex: none; }
    .chat-painel:not(.chat-painel--sem-conversa) .res-topo { right: 84px; bottom: 26px; }   /* conversa aberta: ao lado, não por cima da janela */
    /* Balão flutuante à esquerda do botão da conversa, com a ponta virada para ele */
    .res-balao {
      position: absolute; z-index: 6; right: 84px; bottom: 26px;
      display: flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px;
      background: var(--cartao); border: 1px solid var(--borda-controlo); border-radius: 18px 18px 4px 18px;
      box-shadow: 0 6px 16px rgb(22 33 58 / .18); animation: chat-entrar .18s ease-out;
    }
    .res-balao-abrir { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 4px; border: 0; background: none; color: var(--ligacao); font-size: 13.5px; font-weight: 700; }
    .res-balao-abrir:hover { text-decoration: underline; text-underline-offset: 3px; }
    .res-balao-fechar { width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--nota); font-size: 16px; }
    .res-balao-fechar:hover { background: var(--linha); }
    .res-contagem { padding: 2px 10px; border-radius: 99px; background: #fde7cf; color: #9a3412; font-size: 12px; font-weight: 700; }
    .res-tabela--maiusculas thead th { text-transform: uppercase; letter-spacing: .04em; font-size: 11.5px; }

    /* =========================================================
       8. Rodapé: pergunta + só leitura
       ========================================================= */
    .chat-rodape { flex: none; background: var(--cartao); border-top: 1px solid var(--borda); padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
    .chat-rodape:focus-within { border-top-color: var(--marca); }
    .chat-escrever { margin: 0; display: flex; gap: 8px; }
    .chat-campo {
      flex: 1; min-width: 0; min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--borda-controlo); border-radius: 8px;
      background: var(--lateral);
    }
    .chat-campo::placeholder { color: var(--nota); }
    .chat-enviar {
      width: 44px; height: 44px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: 8px;
      background: var(--marca); color: var(--marca-texto);
    }
    .chat-enviar:hover { background: var(--marca-escura); }
    .chat-rodape-texto { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--nota); }

    /* =========================================================
       9. Movimento
       ========================================================= */

    @keyframes chat-entrar { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes chat-pulsar { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) {
      .chat-folha, .chat-esqueleto span, .chat-pontos span, .chat-painel-esqueleto *, .res-balao { animation: none; }
    }
  </style>
</head>
<body>
  <div class="chat-painel">

    <header class="chat-topo">
      <!-- REDESIGN 11/2026: nome do produto, sem logótipo -->
      <h1 class="chat-titulo">Inforap Flow</h1>
    </header>

    <div class="chat-corpo">
      <!-- Proposta A: os dados ao centro, em separadores; a conversa numa aba à direita -->
      <main class="chat-dados" aria-label="Dados">
        <div class="chat-abas">
          <nav class="chat-abas-lista" id="separadores" aria-label="Resultados abertos"></nav>
        </div>
        <div class="chat-painel-dados" id="painel"></div>
      </main>

      <aside class="chat-conversa" aria-label="Conversa">
        <div class="chat-conversa-cab">
          <!-- Cabeçalho da janela: avatar, nome e estado do agente -->
          <div class="chat-conversa-topo">
            <img class="chat-avatar" id="avatar" src="{{AVATAR}}" alt=""
                 onerror="this.onerror = null; this.src = '../logo/avatar-assistente-vendas.svg';">
            <div class="chat-conversa-nome">
              <h2 class="chat-conversa-titulo">Assistente de vendas</h2>
              <!-- role="status": o leitor de ecrã anuncia quando muda -->
              <p class="chat-estado" id="estado" role="status">
                <span class="chat-ponto" aria-hidden="true"></span>
                <span id="estado-texto">Pronto</span>
              </p>
            </div>
            <button class="chat-esconder" id="esconder-conversa" type="button" aria-label="Esconder a conversa">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13"/></svg>
            </button>
          </div>
          <div class="chat-temas" id="temas" role="group" aria-label="Tema"></div>
        </div>
        <div class="chat-area" id="area"></div>
        <p class="so-leitor" id="anuncio" role="status"></p>

        <footer class="chat-rodape">
          <form class="chat-escrever" id="form">
            <label for="pergunta" class="so-leitor">Pergunta</label>
            <input class="chat-campo" id="pergunta" maxlength="500" autocomplete="off"
                   placeholder="Escreva a sua pergunta…" required>
            <button class="chat-enviar" aria-label="Enviar pergunta">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>
          </form>
          <p class="chat-rodape-texto">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>
            </svg>
            Só leitura. O assistente não altera a base de dados.
          </p>
        </footer>
      </aside>

      <!-- REDESIGN 11/2026: voltar ao topo do painel de dados -->
      <button class="res-topo" id="voltar-topo" type="button" aria-label="Voltar ao topo" title="Voltar ao topo" hidden>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
      </button>

      <!-- Balão flutuante junto ao botão da conversa: sugere o Resumo enquanto a conversa está escondida -->
      <div class="res-balao" id="balao-resumo" role="complementary" aria-label="Sugestão" hidden>
        <button class="res-balao-abrir" id="balao-resumo-abrir" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2v12h12M5 10l3-3 2 2 4-5"/></svg>
          Faça um resumo das vendas
        </button>
        <button class="res-balao-fechar" id="balao-resumo-fechar" type="button" aria-label="Fechar sugestão">×</button>
      </div>

      <!-- Botão redondo no canto: mostra e esconde a conversa -->
      <button class="chat-lancador" id="mostrar-conversa" type="button" aria-expanded="true" aria-label="Esconder a conversa">
        <svg class="chat-lancador-fechar" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3.5 6 4.5 4.5L12.5 6"/></svg>
        <svg class="chat-lancador-abrir" width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    /* ---------- Temas e sugestões (editar aqui) ---------- */
    const TEMAS = [
      { id: 'clientes', nome: 'Clientes', descricao: 'Quantos são, onde estão, quem compra mais e quem deixou de comprar.',
        perguntas: ['Quantos clientes há por zona?', 'Quais são os 5 melhores clientes este ano?', 'Clientes que não compram há 90 dias?'] },
      { id: 'faturacao', nome: 'Faturação', descricao: 'Vendas por mês, por zona e por período.',
        perguntas: ['Como evoluíram as vendas mês a mês este ano?', 'Qual foi a faturação por zona este ano?',
          'Como está a faturação deste ano face ao ano passado?', 'Qual foi o ticket médio em cada mês deste ano?',
          'Quanto faturámos no último trimestre?'] },
      { id: 'artigos', nome: 'Artigos', descricao: 'O que vende mais, por artigo, família e marca.',
        perguntas: ['Que família de artigos vendeu mais no mês passado?', 'Quais são os 10 artigos mais vendidos este ano?',
          'Que marca faturou mais este ano?', 'Qual foi o artigo mais vendido em cada distrito?'] }
    ];

    /* ---------- Elementos e estado ---------- */
    const form = document.getElementById('form');
    const campo = document.getElementById('pergunta');
    const botao = form.querySelector('.chat-enviar');
    const estado = document.getElementById('estado');
    const estadoTexto = document.getElementById('estado-texto');
    const area = document.getElementById('area');
    const temasEl = document.getElementById('temas');

    // Mensagem curta para o leitor de ecrã ("Copiado", "Resposta pronta"), sem ler a resposta inteira
    const anuncio = document.getElementById('anuncio');
    function anunciar(texto) {
      anuncio.textContent = '';
      setTimeout(() => { anuncio.textContent = texto; }, 50);   // limpar e voltar a escrever: repete o anúncio
    }
    // Escreve a pergunta no campo para a pessoa rever; não envia
    function prepararPergunta(texto) {
      campo.value = texto;
      campo.focus();
      anunciar('Pergunta escrita no campo. Carregue em Enter para enviar.');
    }

    let temaAtual = TEMAS[0].id;
    const historico = [];   
    let atual = -1;         
    let ocupado = false;

    /* ---------- Utilitários ---------- */
    function el(tag, classe, texto) {
      const e = document.createElement(tag);
      if (classe) e.className = classe;
      if (texto) e.textContent = texto;   
      return e;
    }
    function botaoEl(classe, texto, aoClicar) {
      const b = el('button', classe, texto);
      b.type = 'button';
      b.addEventListener('click', aoClicar);
      return b;
    }
    const maiuscula = s => s ? s[0].toUpperCase() + s.slice(1) : s;
    const semPonto = s => s.replace(/\.\s*$/, '');
    const paraNumero = s => parseFloat(s.replace(/[^\d,-]/g, '').replace(',', '.'));
    const icone = (d, t = 16) => {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', t); svg.setAttribute('height', t); svg.setAttribute('viewBox', '0 0 16 16');
      svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '1.6');
      svg.setAttribute('aria-hidden', 'true');
      const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.append(p);
      return svg;
    };

    // Tira o markdown que o modelo às vezes acrescenta: "# Título" e "**negrito**".
    // O marcador de lista ("- ") fica: lerLista() precisa dele para saber o que é item.
    const limparMarkdown = l => l
      .replace(/^(\s*)#{1,6}\s+/, '$1')                         // "# Título"
      .replace(/(\*{1,3}|_{2,3})(\S(?:.*?\S)?)\1/g, '$2')       // **negrito**, *itálico*, ***os dois***, __negrito__
      .replace(/\*{2,}|_{2,}/g, '');                              // ** ou __ que ficaram sem par
    const MARCADOR = /^[-*•]\s+/;
    const semAcento = s => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
    // "ALDEIA DE PAIO PIRES" -> "Aldeia de Paio Pires" (só mexe em texto todo em maiúsculas)
    const nomeProprio = s => s !== s.toUpperCase() ? s
      : s.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (_, a, b) => a + b.toUpperCase())
         .replace(/ (Da|De|Do|Das|Dos|E) /g, w => w.toLowerCase());
    // Quantas letras é preciso mudar para passar de a para b ("montija" -> "montijo" = 1)
    function distancia(a, b) {
      const d = Array.from({ length: b.length + 1 }, (_, j) => j);
      for (let i = 1; i <= a.length; i++) {
        let diagonal = d[0];
        d[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cima = d[j];
          d[j] = Math.min(d[j] + 1, d[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
          diagonal = cima;
        }
      }
      return d[b.length];
    }

    /* ---------- Estado no topo ---------- */
    
    function mostrarEstado(tipo) {   
      estado.className = 'chat-estado' + (tipo === 'pronto' ? '' : ' chat-estado--' + tipo);
      estadoTexto.textContent = { pronto: 'Pronto', ocupado: 'A consultar', desligado: 'Sem ligação' }[tipo];
    }
    function bloquear(sim) {
      ocupado = sim;
      campo.disabled = botao.disabled = sim;
      document.querySelectorAll('.chat-temas button, .chat-chip').forEach(b => b.disabled = sim);
      if (sim) mostrarEstado('ocupado');
    }

    /* =========================================================
       Leitura das respostas
       ========================================================= */

    // A) Bloco CSV: "Zona, clientes, percentagem" + linhas. Vírgula+espaço separa colunas.
    // shortcut: lê a tabela do texto; quando o agente devolver colunas e linhas em JSON, trocar por isso.
    // sep = ', ' (vírgula e espaço, o formato antigo) ou ',' (CSV sem espaços: "Balcão,103,27.2")
    function partir(linha, sep = ', ') {
      const campos = [];
      let atualC = '', aspas = false;
      for (let i = 0; i < linha.length; i++) {
        const c = linha[i];
        if (c === '"') aspas = !aspas;
        else if (!aspas && linha.startsWith(sep, i)) { campos.push(atualC.trim()); atualC = ''; i += sep.length - 1; }
        else atualC += c;
      }
      campos.push(atualC.trim());
      return campos;
    }
    const eNumero = s => /^-?\d[\d.]*(,\d+)?%?$/.test(s);
    function lerTabela(texto) {
      const linhas = texto.trim().split('\n').map(l => l.trim());
      for (let i = 0; i < linhas.length; i++) {
        const l = linhas[i];
        // Cabeçalho: tem vírgulas e não é item de lista, item numerado nem frase com ":"
        if (!l.includes(',') || MARCADOR.test(l) || /^\d+\.\s/.test(l) || /:\s/.test(l)) continue;
        // Com "Zona, clientes" separa em ", "; com "Zona,clientes" separa em ","
        const sep = l.includes(', ') ? ', ' : ',';
        const n = partir(l, sep).length;
        if (n < 2) continue;
        if (!partir(l, sep).every(c => /^\p{L}[\p{L}\d _.%º/-]{0,30}$/u.test(c))) continue;   // cabeçalho = nomes de colunas curtos
        const bloco = [];
        let j = i;
        for (; j < linhas.length; j++) {
          if (!linhas[j]) continue;                 // linhas em branco no meio do CSV
          const campos = partir(linhas[j], sep);
          if (campos.length !== n) break;
          bloco.push(campos);
        }
        if (bloco.length < 2) continue;            // cabeçalho + pelo menos 1 linha (1 linha = ficha)
        const [cabecalho, ...dados] = bloco;
        const numericas = cabecalho.map((_, c) => dados.every(d => eNumero(d[c])));
        return { antes: linhas.slice(0, i).join('\n').trim(), depois: linhas.slice(j).join('\n').trim(), cabecalho, linhas: dados, numericas };
      }
      return null;
    }

    // B) Texto com título, factos, avisos e lista numerada (o formato atual do agente)
    function lerItem(pos, s) {
      // Travessão separa nome e valor: o último seguido de um número. "· 2025: –" (não vendeu no ano anterior)
      // também tem travessão; com lastIndexOf partia a linha aí e o valor ficava NaN (lista sem barras).
      const seps = [...s.matchAll(/ [–-] (?=[-−]?\d)/g)];
      let i = seps.length ? seps[seps.length - 1].index : s.lastIndexOf(' – ');   // sem número: "– última compra a…", "– nunca comprou"
      if (i < 0) i = s.lastIndexOf(' - ');
      const esq = i < 0 ? s : s.slice(0, i);
      let dir = i < 0 ? '' : s.slice(i + 3).trim(), media = '';
      // "… · média 73,40 €" no fim (meses e trimestres): valor médio por documento
      const med = dir.match(/^(.*?)\s*·\s*média\s+(.+)$/);
      if (med) { dir = med[1]; media = med[2]; }
      let nome = esq.trim(), codigo = '';
      const c = esq.match(/^(.*\S)\s*\(([^()]+)\)\s*$/);   // último parêntesis = código
      if (c) { nome = c[1]; codigo = c[2]; }
      let sub = '';
      const par = nome.match(/^(.+?):\s+(.+)$/);   // "FERNAO FERRO: CARV" (melhor marca em cada localidade)
      if (par) { nome = par[1]; sub = par[2]; }
      let valor = dir, pct = '', rotulo = '', anterior = null, delta = null;
      // "255 348,78 € · 2025: 265 396,36 € (-3,8%)": valor, ano anterior e variação.
      // Sem "(%)" quando o ano anterior foi 0 ou negativo; "· 2025: –" quando o artigo não vendeu no ano anterior.
      const cmp = dir.match(/^(.*?)\s*·\s*(\d{4}|um ano antes):\s*(.*?)(?:\s*\(([+\-−]?[\d.,]+)\s*%\))?$/);
      if (cmp) {
        valor = cmp[1];
        if (!/^[–—-]?$/.test(cmp[3])) anterior = { ano: cmp[2], valor: cmp[3] };
        if (cmp[4]) delta = parseFloat(cmp[4].replace('−', '-').replace(',', '.'));
      } else {
        const p = dir.match(/^(.*\S)\s*\(([\d.,]+\s*%)(?:\s+([^)]+))?\)$/);  // "(1,9%)" ou "(10,6% da localidade)"
        if (p) { valor = p[1]; pct = p[2] + (p[3] ? ' ' + p[3] : ''); }
        const d = valor.match(/^(.*?)\s*(\d{2}-\d{2}-\d{4})$/); // "última compra a 23-12-2025"
        if (d && d[1]) { rotulo = d[1].replace(/\s+(a|em)$/i, ''); valor = d[2]; }
      }
      // "1 234 unidades (255 348,78 €)" (ordenar=Quantidade): as unidades são o valor, os euros vão por baixo.
      // Sem isto o paraNumero juntava os dois números (1 234 255 348,78).
      const un = valor.match(/^(.*\d)\s+unidades\s*\((.+)\)$/);
      if (un) { valor = un[1] + ' unidades'; pct = un[2]; }
      const num = un ? paraNumero(un[1]) : /^-?[\d\s.\u00a0\u202f]+(,\d+)?\s*€?$/.test(valor) ? paraNumero(valor) : NaN;
      return { pos, nome, codigo, sub, valor, pct, rotulo, num, anterior, delta, media, unidades: !!un };
    }
    function lerLista(texto) {
      const r = { titulo: '', periodo: '', resumo: '', factos: [], avisos: [], itens: [], paragrafos: [], nota: '' };
      const ls = texto.split('\n').map(l => limparMarkdown(l.trim())).filter(Boolean);
      const eFacto = s => /^[^:]{3,40}:\s/.test(s);   // "Rótulo: valor"
      let grupo = '';                                  // "Clientes em Odivelas:" por cima de uma lista
      ls.forEach((linha, i) => {
        const marcador = MARCADOR.test(linha);         // a linha começa por "- ", "* " ou "• "
        const l = linha.replace(MARCADOR, '');
        const seguinte = ls[i + 1] || '';
        let m;
        if ((m = l.match(/^(\d+)\.\s+(.+)$/))) r.itens.push({ ...lerItem(m[1], m[2]), grupo });
        else if (marcador && !eFacto(l)) r.itens.push({ pos: '', nome: l, codigo: '', valor: '', pct: '', rotulo: '', num: NaN, grupo });
        else if (!marcador && l.endsWith(':') && MARCADOR.test(seguinte) && !eFacto(seguinte.replace(MARCADOR, ''))) grupo = l.slice(0, -1);
        else if ((m = l.match(/^Aten[çc][ãa]o:\s*(.+)$/i))) r.avisos.push(m[1]);
        else if ((m = l.match(/^Mostr[oa]\s+(.+)$/i))) r.nota = 'Mostra ' + semPonto(m[1]);
        else if (i === 0 && !marcador && !/^lista completa/i.test(l) && (m = l.match(/^(.+?):\s+(.+)$/)) && /\s/.test(m[1])) { r.titulo = m[1]; r.resumo = m[2]; }
        else if ((m = l.match(/^([^:]{3,40}):\s+(.+)$/))) r.factos.push([m[1], semPonto(m[2])]);
        else r.paragrafos.push(l);
      });
      const p = r.titulo.match(/\s*\((\d{2}-\d{2}-\d{4} a \d{2}-\d{2}-\d{4})\)/);
      if (p) { r.periodo = p[1]; r.titulo = r.titulo.replace(p[0], ''); }
      return r;
    }

    /* =========================================================
       Desenho das respostas
       ========================================================= */
    // Colunas que só têm células vazias não vão para o Excel
    function semColunasVazias(linhas) {
      const manter = linhas[0].map((_, c) => linhas.slice(1).some(l => String(l[c] ?? '').trim() !== ''));
      return linhas.map(l => l.filter((_, c) => manter[c]));
    }

    // "15 373,55 €" -> "15373,55" e o cabeçalho ganha "(€)": o Excel em pt-PT lê como número e soma
    const EUROS = /^-?[\d\s  .]+(,\d+)?\s*€$/;
    function paraFolha(linhas) {
      const [cab, ...dados] = linhas;
      const emEuros = cab.map((_, c) => dados.some(l => l[c]) && dados.every(l => !l[c] || EUROS.test(String(l[c]).trim())));
      return [
        cab.map((h, c) => emEuros[c] && !String(h).includes('€') ? h + ' (€)' : h),
        ...dados.map(l => l.map((v, c) => emEuros[c] && v ? String(v).replace(/[^\d,-]/g, '') : v))
      ];
    }

    async function copiarTexto(texto) {
      try { await navigator.clipboard.writeText(texto); return true; } catch { /* segue para o plano B */ }
      // Sem localhost nem HTTPS não há navigator.clipboard: copia por uma caixa de texto escondida
      const antes = document.activeElement;
      const caixa = el('textarea');
      caixa.value = texto;
      caixa.setAttribute('readonly', '');
      caixa.style.position = 'fixed'; caixa.style.opacity = '0';
      document.body.append(caixa);
      caixa.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      caixa.remove();
      if (antes) antes.focus();
      return ok;
    }

    // conteudo: texto simples, ou linhas [[cabeçalho...], [valores...], ...]
    function botaoCopiar(conteudo) {
      // Tabulações: cola em colunas no Excel
      const texto = typeof conteudo === 'string' ? conteudo : paraFolha(conteudo).map(l => l.join('\t')).join('\n');
      const b = botaoEl('chat-acao', 'Copiar', async () => {
        b.textContent = await copiarTexto(texto) ? 'Copiado' : 'Não foi possível copiar';
        anunciar(b.textContent);
        setTimeout(() => { b.textContent = 'Copiar'; }, 2000);
      });
      return b;
    }

    function botaoExportar(linhas, titulo) {
      return botaoEl('chat-acao', 'Exportar CSV', () => {
        // ";" e BOM: o Excel em pt-PT abre em colunas e com acentos certos
        const campo = v => /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        const csv = '﻿' + paraFolha(linhas).map(l => l.map(v => campo(String(v ?? ''))).join(';')).join('\r\n');
