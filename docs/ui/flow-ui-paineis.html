<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow · Protótipo dos painéis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--blue:#1F5BF5;--blue-deep:#1443C9;--blue-pale:#E4EBFF;--blue-mist:#F4F7FE;--ink2:#3A404C;--ink3:#6B7280;--line:#DCE2ED}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Onest',system-ui,sans-serif;color:#000;background:#fff;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
b,strong{font-weight:600}
.num{font-variant-numeric:tabular-nums}
p b{white-space:nowrap}
.up{color:var(--blue);font-weight:600}.dn{color:#000;font-weight:600}
.muted{color:var(--ink3)}

.app{display:grid;grid-template-columns:64px 1fr 380px;grid-template-rows:60px 1fr;height:100vh}
.rail{grid-row:1/3;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px}
.rail .mark{margin-bottom:18px}
.rail a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);position:relative}
.rail a:hover{background:var(--blue-mist);color:#000}
.rail a[aria-current=page]{background:var(--blue-mist);color:var(--blue)}
.rail a .bd{position:absolute;top:4px;right:3px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.rail a .tip{position:absolute;left:48px;background:#000;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.rail a:hover .tip,.rail a:focus-visible .tip{opacity:1}
.rail .av{margin-top:8px;width:34px;height:34px;border-radius:50%;background:#000;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}

.topbar{grid-column:2;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;color:var(--ink3);flex:1}
.search input{border:0;outline:0;background:none;flex:1}
.fresh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--blue);display:block}
.iconbtn{position:relative;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center}
.iconbtn .bd{position:absolute;top:-6px;right:-6px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center}

main{grid-column:2;overflow:auto;padding:28px 32px 40px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.head p{color:var(--ink2);margin-top:6px}
.head p.iva{font-size:13px;color:var(--ink3);margin-top:2px}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:#000;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:#000}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-deep)}
.example{margin-top:14px;font-size:12.5px;color:var(--ink2);background:var(--blue-mist);border-radius:8px;padding:7px 12px;display:inline-block}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.k{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;min-width:0}
.k .v{font-size:28px;font-weight:600;color:var(--blue);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v.long{font-size:20px;line-height:1.2;white-space:normal;min-height:34px;display:flex;align-items:center}
.k .l{font-size:14px;margin-top:4px}
.k .s{font-size:12.5px;color:var(--ink3);margin-top:8px}
.panel{border:1px solid var(--line);border-radius:12px;margin-top:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;display:block;border-top:2px solid var(--blue)}
.legend i.o{border-top:2px dashed var(--ink3)}
.legend i.f{border-top:2px dashed var(--blue)}
.chart-wrap{padding:8px 20px 16px}
.sel-row{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:baseline;padding:14px 20px;border-top:1px solid var(--line);background:var(--blue-mist);border-radius:0 0 12px 12px}
.sel-row .t{font-weight:600;font-size:15px}.sel-row .v{font-size:20px;font-weight:600}.sel-row .o{color:var(--ink2);font-size:13.5px}
.sel-row .btn{margin-left:auto}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.link{color:var(--blue);font-size:13px;text-decoration:none;font-weight:500;border:0;background:none}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:300px;color:var(--ink3)}
.field input{border:0;outline:0;flex:1;color:#000;min-width:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:#fff;color:var(--ink2)}
.chip[aria-pressed=true]{background:#000;color:#fff;border-color:#000}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--ink3);text-align:left;padding:12px 20px 8px;font-size:12.5px;white-space:nowrap}
td{padding:11px 20px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--blue-mist)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;color:var(--ink2)}
.tag.b{border-color:var(--blue);color:var(--blue)}
.tag.k{border-color:#000;color:#000}
.empty{padding:28px 20px;color:var(--ink2);text-align:center}
.hbar{height:8px;background:var(--blue-pale);border-radius:4px;overflow:hidden;min-width:80px}
.hbar i{display:block;height:100%;background:var(--blue)}
.hbar.neg i{background:#000}

.alerts{list-style:none;padding:6px 20px 14px}
.alerts li{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.alerts li:first-child{border-top:0}
.alerts .ic{grid-row:1/3;color:var(--ink2);padding-top:2px}
.alerts .t{font-weight:500}
.alerts .d{grid-column:2;color:var(--ink3);font-size:12.5px;line-height:1.4}
.alerts .acts{grid-row:1/3;grid-column:3;display:flex;gap:12px;align-self:center}

/* gaveta de briefing */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.2)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer-b{padding:22px;overflow:auto;flex:1}
.drawer-b h3{font-size:20px;font-weight:600}
.drawer-b p{color:var(--ink2);line-height:1.55;margin-top:10px}
.facts{list-style:none;margin-top:18px}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.facts li>span:first-child{color:var(--ink3)}
.bh{font-size:14px;font-weight:600;margin-top:24px}
.facts.arts{margin-top:8px}.facts.arts li{align-items:center}
.drawer-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}

/* Flow */
.flow{grid-column:3;grid-row:1/3;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.flow-h{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.flow-h .n{font-weight:600}
.flow-h .ctx{margin-left:auto;font-size:12px;color:var(--ink2);background:var(--blue-mist);border-radius:999px;padding:4px 10px;white-space:nowrap}
.flow-b{flex:1;overflow:auto;padding:18px}
.q{margin-left:auto;width:max-content;max-width:85%;background:var(--blue-pale);border-radius:10px;padding:8px 12px;font-size:14px}
.flow-b .hello{background:var(--blue-mist);border-radius:12px;padding:14px 16px;line-height:1.5}
.flow-b .hello b{display:block;margin-bottom:4px}
.flow-b h2{font-size:16px;font-weight:600;margin-top:18px}
.flow-b p{font-size:14px;line-height:1.55;color:var(--ink2);margin-top:8px}
.flow-b p b{color:#000}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.m{background:var(--blue-mist);border-radius:10px;padding:12px}
.m .l{font-size:12.5px;color:var(--ink3)}.m .v{font-size:18px;font-weight:600;margin-top:6px}
.more{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.more h3{font-size:12.5px;color:var(--ink3);font-weight:500}
.more button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 0;font-size:14px;font-weight:500}
.more button:hover{color:var(--blue)}
.flow-f{padding:14px 18px 16px;flex-shrink:0}
.box{border:1.5px solid #000;border-radius:12px;background:#fff;padding:12px 12px 10px 14px}
.box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-pale)}
.box input{width:100%;border:0;outline:0;font-size:15px;background:none}
.box .row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink3)}
.send{width:34px;height:34px;border:0;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center}
.send:hover{background:var(--blue-deep)}
.flow-min{display:none}


.tabbtn{border:0;background:none;padding:8px 2px;margin-right:18px;font-size:14.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent}
.tabbtn[aria-selected=true]{color:#000;border-bottom-color:var(--blue)}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 20px 20px}
.tplc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;min-height:148px}
.tplc:hover{border-color:var(--blue)}
.tplc .tn{font-weight:600}
.tplc .td{color:var(--ink2);font-size:13.5px;line-height:1.45}
.tplc .tu{margin-top:auto;color:var(--blue);font-size:13px;font-weight:500}
tr.off td{color:var(--ink3)}
.sw{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;vertical-align:middle}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--blue)}.sw[aria-checked=true] i{left:19px}
.fgrid{display:grid;gap:14px;margin-top:18px}
.fgrid label{display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.fgrid input:not([type=checkbox]),.fgrid select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;background:#fff;width:100%}
.fgrid input:focus,.fgrid select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.fgrid .inl{display:flex;gap:10px;align-items:center}.fgrid .inl input{width:110px!important}
.fgrid .chk{display:flex;align-items:center;gap:8px;color:#000;font-size:14px}
.sentence{margin-top:18px;background:var(--blue-mist);border-radius:12px;padding:12px 14px}
.sentence p{margin-top:4px;color:#000;line-height:1.5}
.sentence.pv{background:#fff;border:1px solid var(--line)}
.totop{position:fixed;right:404px;bottom:24px;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -12px rgba(20,40,90,.35);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .15s,transform .15s;z-index:10}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop:hover{border-color:#000}
.menu{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px -14px rgba(20,40,90,.35);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--blue-mist)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;z-index:40}

.ansacts{display:flex;gap:8px;margin-top:16px}
.ansacts .btn{padding:6px 10px;font-size:13px}
.ansacts .btn:disabled{color:var(--blue);border-color:var(--blue-pale);cursor:default}
.rail a .bd.sv{background:#000}
.drawer.doc{width:540px}
.sheet{border:1px solid var(--line);border-radius:12px;padding:24px;background:#fff}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start}
.sh-top h3{font-size:20px;font-weight:600}
.sh-to{display:grid;gap:3px;margin-top:22px;font-size:13.5px}
.sh-t{margin-top:20px}.sh-t th{padding:8px 0;font-size:12px}.sh-t td{padding:10px 0;font-size:13px}.sh-t th.r,.sh-t td.r{padding-left:10px}
.sh-sum{list-style:none;margin-top:14px;margin-left:auto;width:65%}
.sh-sum li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.sh-sum li span{color:var(--ink3)}
.sh-sum li.tot{border-top:1.5px solid #000}.sh-sum li.tot span{color:#000;font-weight:500}.sh-sum li.tot b{font-size:20px}

.fgrid textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;resize:vertical;font-family:inherit}
.fgrid textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.fgrid input.ro{background:var(--blue-mist);color:#000}
.fl{display:grid;gap:6px;font-size:13px;color:var(--ink2)}.fl .seg{width:max-content}
.row3{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}.row3 label:first-child{grid-column:1/-1}
.emails{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:42px;cursor:text}
.emails:focus-within{outline:2px solid var(--blue);border-color:var(--blue)}
.emails input{border:0!important;outline:0!important;flex:1;min-width:160px;padding:4px!important;width:auto!important}
.em{display:inline-flex;align-items:center;gap:4px;background:var(--blue-pale);color:#000;border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.em button{border:0;background:none;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--ink2)}
.em button:hover{background:#fff}
.err{color:#B42318;font-size:12.5px;min-height:0}

.row2c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:13px}
.btn.fon{border-color:var(--blue);color:var(--blue)}
.btn .fn{background:var(--blue);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
fieldset{border:0;display:grid;gap:8px}
legend{font-size:13px;color:var(--ink2);margin-bottom:8px}
.cbs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.cb{display:flex!important;align-items:center;gap:8px;color:#000!important;font-size:14px!important}
.cb input{width:16px;height:16px;accent-color:var(--blue)}
@media (max-width:1280px){.totop{right:24px}.tpl{grid-template-columns:1fr 1fr}}
@media (max-width:1280px){.app{grid-template-columns:64px 1fr}.flow{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Menu principal"></nav>
  <div class="topbar">
    <label class="search"><span data-i="search"></span><input placeholder="Procurar cliente…" aria-label="Procurar cliente" id="gsearch"></label>
    <span class="fresh"><i></i>Dados até 4 de setembro. Setembro ainda incompleto</span>
    <a class="iconbtn" href="#alertas" aria-label="Alertas, 4 novos"><span data-i="bell"></span><span class="bd">4</span></a>
  </div>
  <main id="main"></main>
  <aside class="flow" aria-label="Flow">
    <div class="flow-h"><span data-i="mark"></span><span class="n">Flow</span><span class="ctx" id="flow-ctx"></span></div>
    <div class="flow-b" id="flow-b" aria-live="polite"></div>
    <div class="flow-f">
      <form class="box" id="flow-form">
        <input id="flow-in" autocomplete="off" placeholder="Pergunte sobre esta vista…" aria-label="Pergunta ao Flow">
        <div class="row2"><span>Só leitura. Não altera a base de dados.</span><button class="send" aria-label="Enviar pergunta"><span data-i="arrowup"></span></button></div>
      </form>
    </div>
  </aside>
</div>
<div id="drawer-root"></div>
<button class="totop" id="totop" aria-label="Voltar ao topo" title="Voltar ao topo"><span data-i="top"></span></button>
<div id="menu-root"></div>

<script>
/* ================= ícones ================= */
const P={
 search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
 bell:'<path d="M4 11V7a4 4 0 018 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 003 0"/>',
 home:'<rect x="2.5" y="2.5" width="4.5" height="4.5"/><rect x="9" y="2.5" width="4.5" height="4.5"/><rect x="2.5" y="9" width="4.5" height="4.5"/><rect x="9" y="9" width="4.5" height="4.5"/>',
 users:'<circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><path d="M10.5 3.2a2.5 2.5 0 010 4.6M12 9.8c1.6.5 2.5 1.8 2.5 3.7"/>',
 doc:'<path d="M4 1.5h5.5l3 3v10H4z"/><path d="M6 8h5M6 11h4"/>',
 box:'<path d="M2 5l6-3 6 3v6.5l-6 3-6-3z"/><path d="M2 5l6 3 6-3M8 8v6.5"/>',
 pin:'<path d="M8 14.5s-4.5-4-4.5-7.5a4.5 4.5 0 019 0c0 3.5-4.5 7.5-4.5 7.5z"/><circle cx="8" cy="7" r="1.6"/>',
 trend:'<path d="M2 12l4-4 3 3 5-6"/><path d="M10 5h4v4"/>',
 alert:'<circle cx="8" cy="8" r="6.2"/><path d="M8 4.8v3.8M8 11v.2"/>',
 down:'<path d="M2 4l4.5 4.5 3-3L14 10"/><path d="M14 6.5V10h-3.5"/>',
 usersx:'<circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><path d="M11 4l3 3M14 4l-3 3"/>',
 filter:'<path d="M2 4h12M4.5 8h7M7 12h2"/>',
 download:'<path d="M8 2v8M4.5 7L8 10.5 11.5 7M2.5 13.5h11"/>',
 cal:'<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/>',

/* ================= gráfico ================= */
function lineChart({serA,serB,sel=-1,partial=-1,forecast=null,band=null,max=300,id='ch'}){
 const W=900,H=250,L=48,R=20,T=16,B=34,n=12;
 const cols=Math.max(serB?serB.length:0,serA.length,forecast?forecast.from+forecast.v.length:0);
 const x=i=>L+i*(W-L-R)/(cols-1), y=v=>T+(1-v/max)*(H-T-B);
 let s='';
 [0,100,200,300].filter(g=>g<=max).forEach(g=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#DCE2ED"/><text x="${L-10}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="#6B7280">${g?g+' mil':'0'}</text>`});
 if(sel>=0) s+=`<rect x="${x(sel)-26}" y="${T}" width="52" height="${H-T-B}" fill="#F4F7FE" rx="6"/>`;
 if(band){const up=band.map((b,i)=>`${x(forecast.from+i)},${y(b[1])}`), lo=band.map((b,i)=>`${x(forecast.from+i)},${y(b[0])}`).reverse(); s+=`<polygon points="${up.concat(lo).join(' ')}" fill="#E4EBFF" opacity=".8"/>`}
 if(serB) s+=`<polyline points="${serB.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 5"/>`;
 const full=partial>=0?serA.slice(0,partial):serA;
 s+=`<polyline points="${full.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#1F5BF5" stroke-width="2.5" stroke-linejoin="round"/>`;
 if(forecast){const pts=[[forecast.from-1,full[full.length-1]],...forecast.v.map((v,i)=>[forecast.from+i,v])]; s+=`<polyline points="${pts.map(([i,v])=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#1F5BF5" stroke-width="2" stroke-dasharray="6 5"/>`;
   forecast.v.forEach((v,i)=>s+=`<circle cx="${x(forecast.from+i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="#1F5BF5" stroke-width="1.5"/>`)}
 full.forEach((v,i)=>{const on=i===sel;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${on?6:4}" fill="${on?'#1F5BF5':'#fff'}" stroke="#1F5BF5" stroke-width="2"/>`});
 if(partial>=0&&!forecast){s+=`<circle cx="${x(partial)}" cy="${y(serA[partial])}" r="${sel===partial?6:4}" fill="#fff" stroke="#000" stroke-width="2"/><text x="${x(partial)}" y="${y(serA[partial])-14}" text-anchor="end" font-size="11" fill="#3A404C">até dia 4</text>`}
 for(let i=0;i<cols;i++){const on=i===sel;s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="${on?'#1F5BF5':'#3A404C'}" font-weight="${on?600:400}">${MESES[i]}${i===partial?'*':''}</text>`;
   if(sel>=0&&i<serA.length) s+=`<rect x="${x(i)-26}" y="${T}" width="52" height="${H-T}" fill="transparent" style="cursor:pointer" data-m="${i}"><title>${MF[i]}</title></rect>`}
 return `<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico por mês">${s}</svg>`;
}

 after(){document.querySelectorAll('[data-gf]').forEach(b=>b.onclick=()=>{this.f=b.dataset.gf;show('guardados')});
  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{const i=SAVED.findIndex(x=>x.id==b.dataset.gdel);const n=SAVED[i].nome;SAVED.splice(i,1);refreshSavedBadge();show('guardados');toast(`"${n}" removido de Guardados.`)});
  document.querySelectorAll('[data-gopen]').forEach(b=>b.onclick=()=>{const x=SAVED.find(y=>y.id==b.dataset.gopen);
   if(x.tipo==='Vista'){Object.assign(VIEWS[x.k],x.state||{});go(x.k)}
   else{lastAns={q:x.nome,html:x.html};flowSet(x.html);paintIcons(fb)}})}};
function guardarVista(){const v=VIEWS[cur];const segOn=document.querySelector('#main [data-seg] [aria-pressed=true]');
 let nome=v.nome+(segOn?', '+segOn.textContent:'');
 if(cur==='clientes'&&v.f!=='Todos')nome=v.nome+', '+({ativo:'ativos',desvio:'com desvio',sem:'sem compras'}[v.f]);
 if(cur==='alertas')nome=v.nome+(v.tab==='meus'?', personalizados':', '+v.f.toLowerCase());
 if(SAVED.some(x=>x.tipo==='Vista'&&x.nome===nome)){toast('Esta vista já está em Guardados.');return}
 SAVED.unshift({id:Date.now(),tipo:'Vista',nome,k:cur,state:cur==='clientes'?{f:v.f,q:v.q}:cur==='alertas'?{f:v.f,tab:v.tab}:{},quando:'Agora'});
 refreshSavedBadge();toast(`Vista "${nome}" guardada em Guardados.`)}

/* ================= pré-visualização de documento ================= */
function openDoc(i){const d=DOCS[i],nc=d[4]==='Nota de crédito',root=document.getElementById('drawer-root'),prev=document.activeElement;
 const total=Math.abs(d[5]);const a1=ARTIGOS[i%ARTIGOS.length],a2=ARTIGOS[(i+3)%ARTIGOS.length];
 const p1=+(a1.f/a1.q).toFixed(2),p2=+(a2.f/a2.q).toFixed(2);
 let lines;if(nc||total<80){const q=Math.max(1,Math.round(total/p1));lines=[{n:nc?'Devolução: '+a1.n:a1.n,q,p:+(total/q).toFixed(2)}]}
 else{const q1=Math.max(1,Math.round(total*.6/p1)),r=+(total-q1*p1).toFixed(2),q2=Math.max(1,Math.round(r/p2));lines=[{n:a1.n,q:q1,p:p1},{n:a2.n,q:q2,p:+(r/q2).toFixed(2)}]}
 const sub=lines.reduce((t,l)=>t+l.q*l.p,0)*(nc?-1:1),iva=sub*.23;
 root.innerHTML=`<div class="drawer-bg" data-close></div><div class="drawer doc" role="dialog" aria-modal="true" aria-labelledby="dct">
 <div class="drawer-h"><span class="muted" style="font-size:13px">Pré-visualização</span><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>
 <div class="drawer-b"><div class="sheet">
  <div class="sh-top"><div><h3 id="dct">${d[4]}</h3><div class="muted num" style="margin-top:6px;font-size:12.5px">N.º ${d[1]}<br>Data: ${d[0]}/2026</div></div>${ic('mark')}</div>
  <div class="sh-to"><span class="muted">Cliente</span><b style="font-weight:500">${esc(d[2])}</b><span class="muted">${d[3]}</span></div>
  <table class="sh-t"><thead><tr><th>Artigo</th><th class="r">Qtd.</th><th class="r">Preço</th><th class="r">Total</th></tr></thead><tbody>
  ${lines.map(l=>`<tr><td>${esc(l.n)}</td><td class="r num">${l.q}</td><td class="r num">${eur2(l.p)}</td><td class="r num">${eur2(l.q*l.p*(nc?-1:1))}</td></tr>`).join('')}</tbody></table>
  <ul class="sh-sum"><li><span>Total sem IVA</span><b class="num">${eur2(sub)}</b></li><li><span>IVA (23%)</span><b class="num">${eur2(iva)}</b></li><li class="tot"><span>Total</span><b class="num">${eur2(sub+iva)}</b></li></ul>
 </div><p class="muted" style="font-size:12.5px;margin-top:12px">Pré-visualização de exemplo. No produto, as linhas vêm do documento real e só se podem consultar.</p></div>
 <div class="drawer-f"><button class="btn" data-close>Fechar</button><button class="btn" id="dexp"><span data-i="download"></span>Exportar PDF</button><button class="btn pri" id="dask2"><span data-i="spark"></span>Perguntar ao Flow</button></div></div>`;
 paintIcons(root);const close=()=>{root.innerHTML='';prev&&prev.focus()};
 root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
 root.querySelector('#dexp').onclick=()=>toast(`${d[1]} exportado em PDF.`);
 root.querySelector('#dask2').onclick=()=>{close();flowAsk('O que comprou '+d[2]+' neste documento ('+d[1]+')?')};
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
 root.querySelector('.drawer button').focus()}


/* ================= agendar envio ================= */
const ENVIOS=[{id:1,vista:'Resumo das vendas',fmt:'PDF',para:['direcao@empresa.pt'],freq:'Todas as semanas',dia:'segunda-feira',hora:'08:00'}];
const DIAS=['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira'];
function fraseEnvio(e){const quando=e.freq==='Todas as semanas'?`Todas as ${e.dia==='segunda-feira'?'segundas-feiras':e.dia.replace('-feira','s-feiras')}`:e.freq==='Todos os meses'?`No dia ${e.dia} de cada mês`:`Uma vez, ${e.dia}`;
 return `${quando}, às ${e.hora}, envia "${e.vista}" em ${e.fmt} para ${e.para.length===1?e.para[0]:e.para.length+' pessoas'}.`}
function openSchedule(){const root=document.getElementById('drawer-root'),prev=document.activeElement,v=VIEWS[cur];
 const segOn=document.querySelector('#main [data-seg] [aria-pressed=true]');
 const st={vista:v.nome+(segOn?', '+segOn.textContent:''),fmt:'PDF',para:[],freq:'Todas as semanas',dia:'segunda-feira',hora:'08:00',msg:''};
 const diaOpts=()=>st.freq==='Todos os meses'?['1','5','10','15','último dia']:st.freq==='Uma vez'?['amanhã','próxima segunda-feira','fim do mês']:DIAS;
 root.innerHTML=`<div class="drawer-bg" data-close></div><form class="drawer" role="dialog" aria-modal="true" aria-labelledby="sct" id="sf" novalidate>
 <div class="drawer-h"><span class="muted" style="font-size:13px">Agendar envio</span><button type="button" class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>
 <div class="drawer-b"><h3 id="sct">Enviar esta vista por email</h3>
  <div class="fgrid">
   <label>O que enviar<input value="${esc(st.vista)}" readonly class="ro"></label>
   <div class="fl"><span>Formato</span><div class="seg" id="sf-fmt">${['PDF','Excel'].map(f=>`<button type="button" aria-pressed="${f===st.fmt}">${f}</button>`).join('')}</div></div>
   <label>Para<div class="emails" id="sf-em"><input id="sf-in" type="email" placeholder="Escreva um email e carregue em Enter"></div><span class="err" id="sf-err" role="alert"></span></label>
   <div class="row3">
    <label>Repetir<select id="sf-freq">${['Todas as semanas','Todos os meses','Uma vez'].map(f=>`<option${f===st.freq?' selected':''}>${f}</option>`).join('')}</select></label>
    <label>Dia<select id="sf-dia"></select></label>
    <label>Hora<select id="sf-h">${['07:00','08:00','09:00','12:00','18:00'].map(h=>`<option${h===st.hora?' selected':''}>${h}</option>`).join('')}</select></label>
   </div>
   <label>Mensagem <span class="muted">(opcional)</span><textarea id="sf-msg" rows="3" placeholder="Ex.: Segue o resumo semanal das vendas."></textarea></label>
  </div>
  <div class="sentence"><span class="muted" style="font-size:12.5px">O envio fica assim</span><p id="sf-sent"></p></div>
  ${ENVIOS.length?`<h4 class="bh">Envios agendados <span class="muted" style="font-weight:400">${ENVIOS.length}</span></h4><ul class="facts arts" id="sf-list">${ENVIOS.map(e=>`<li><div style="font-size:13.5px;line-height:1.45">${esc(fraseEnvio(e))}</div><button type="button" class="link" style="color:var(--ink2)" data-rm="${e.id}">Cancelar</button></li>`).join('')}</ul>`:''}
 </div>
 <div class="drawer-f"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit"><span data-i="cal"></span>Agendar envio</button></div></form>`;
 paintIcons(root);const $=q=>root.querySelector(q);
 const paintDia=()=>{const o=diaOpts();if(!o.includes(st.dia))st.dia=o[0];$('#sf-dia').innerHTML=o.map(d=>`<option${d===st.dia?' selected':''}>${d}</option>`).join('')};
 const paintEm=()=>{root.querySelectorAll('.em').forEach(x=>x.remove());st.para.forEach((m,i)=>$('#sf-in').insertAdjacentHTML('beforebegin',`<span class="em">${esc(m)}<button type="button" aria-label="Remover ${esc(m)}" data-ei="${i}">${ic('x',11)}</button></span>`));
   root.querySelectorAll('[data-ei]').forEach(b=>b.onclick=()=>{st.para.splice(+b.dataset.ei,1);paintEm();paint()})};
 const paint=()=>{$('#sf-sent').textContent=st.para.length?fraseEnvio(st):fraseEnvio({...st,para:['…']}).replace('para ….','para quem escolher.')};
 const addEm=()=>{const v=$('#sf-in').value.trim().replace(/[,;]$/,'');if(!v)return true;
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){$('#sf-err').textContent='Este email não parece válido. Confirme e tente outra vez.';return false}
   if(!st.para.includes(v))st.para.push(v);$('#sf-in').value='';$('#sf-err').textContent='';paintEm();paint();return true};
 $('#sf-in').onkeydown=e=>{if(e.key==='Enter'||e.key===','||e.key===';'){e.preventDefault();addEm()}else if(e.key==='Backspace'&&!e.target.value&&st.para.length){st.para.pop();paintEm();paint()}};
 $('#sf-in').onblur=addEm;
 $('#sf-em').onclick=()=>$('#sf-in').focus();
 root.querySelectorAll('#sf-fmt button').forEach(b=>b.onclick=()=>{st.fmt=b.textContent;root.querySelectorAll('#sf-fmt button').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()});
 $('#sf-freq').onchange=e=>{st.freq=e.target.value;paintDia();paint()};
 $('#sf-dia').onchange=e=>{st.dia=e.target.value;paint()};
 $('#sf-h').onchange=e=>{st.hora=e.target.value;paint()};
 root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const i=ENVIOS.findIndex(x=>x.id==b.dataset.rm);ENVIOS.splice(i,1);b.closest('li').remove();toast('Envio agendado cancelado.')});
 const close=()=>{root.innerHTML='';prev&&prev.focus()};
 root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
 $('#sf').onsubmit=e=>{e.preventDefault();if(!addEm())return;if(!st.para.length){$('#sf-err').textContent='Indique pelo menos um email.';$('#sf-in').focus();return}
  ENVIOS.unshift({id:Date.now(),...st});close();toast(fraseEnvio(st).replace(/\.$/,'')+'. Envio agendado.')};
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
 paintDia();paint();$('#sf-in').focus()}


/* ================= filtros transversais ================= */
const F={zonas:[],cliente:'',familias:[],tipos:[],de:'2026-01-01',ate:'2026-09-04',comparar:'Mesmo período de 2025'};
const FAMS=[...new Set(ARTIGOS.map(a=>a.fam))], TIPOSDOC=['Fatura','Fatura simplificada','Nota de crédito'];
const fCli=l=>l.filter(c=>(!F.zonas.length||F.zonas.includes(c.z))&&(!F.cliente||c.n.toLowerCase().includes(F.cliente.toLowerCase())));
const fDoc=d=>(!F.zonas.length||F.zonas.includes(d[3]))&&(!F.tipos.length||F.tipos.includes(d[4]))&&(!F.cliente||d[2].toLowerCase().includes(F.cliente.toLowerCase()));
const fArt=l=>l.filter(a=>!F.familias.length||F.familias.includes(a.fam));
const fZon=l=>l.filter(z=>!F.zonas.length||F.zonas.includes(z.n));
const dfmt=d=>{const [y,m,dd]=d.split('-');return `${+dd} ${MESES[+m-1]} ${y}`};
function activeF(){const a=[];F.zonas.forEach(z=>a.push(['zonas',z,z]));if(F.cliente)a.push(['cliente',F.cliente,'Cliente: '+F.cliente]);
 F.familias.forEach(f=>a.push(['familias',f,f]));F.tipos.forEach(t=>a.push(['tipos',t,t]));
 if(F.de!=='2026-01-01'||F.ate!=='2026-09-04')a.push(['datas','',`${dfmt(F.de)} a ${dfmt(F.ate)}`]);
 if(F.comparar!=='Mesmo período de 2025')a.push(['comparar','','Comparar com: '+F.comparar.toLowerCase()]);return a}
function rmF(k,v){if(k==='cliente')F.cliente='';else if(k==='datas'){F.de='2026-01-01';F.ate='2026-09-04'}else if(k==='comparar')F.comparar='Mesmo período de 2025';else F[k]=F[k].filter(x=>x!==v)}
function openFilters(){const root=document.getElementById('drawer-root'),prev=document.activeElement;const D=JSON.parse(JSON.stringify(F));
 const zonas=[...new Set([...ZONAS.map(z=>z.n),...CLIENTES.map(c=>c.z)])].sort((a,b)=>a.localeCompare(b,'pt'));
 const cbs=(key,list)=>list.map(v=>`<label class="cb"><input type="checkbox" data-k="${key}" value="${esc(v)}"${D[key].includes(v)?' checked':''}> ${esc(v)}</label>`).join('');
 root.innerHTML=`<div class="drawer-bg" data-close></div><form class="drawer" role="dialog" aria-modal="true" aria-labelledby="fft" id="ff">
 <div class="drawer-h"><span class="muted" style="font-size:13px">Aplica-se a todos os painéis</span><button type="button" class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>
 <div class="drawer-b"><h3 id="fft">Filtros</h3>
  <div class="fgrid">
   <div class="row2c"><label>De<input type="date" id="ff-de" value="${D.de}" min="2025-01-01" max="2026-09-04"></label><label>Até<input type="date" id="ff-ate" value="${D.ate}" min="2025-01-01" max="2026-09-04"></label></div>
   <label>Comparar com<select id="ff-cmp">${['Mesmo período de 2025','Período anterior','Sem comparação'].map(o=>`<option${o===D.comparar?' selected':''}>${o}</option>`).join('')}</select></label>
   <label>Cliente<input id="ff-cli" value="${esc(D.cliente)}" placeholder="Nome ou parte do nome"></label>
   <fieldset><legend>Zona</legend><div class="cbs">${cbs('zonas',zonas)}</div></fieldset>
   <fieldset><legend>Família de artigos</legend><div class="cbs">${cbs('familias',FAMS)}</div></fieldset>
   <fieldset><legend>Tipo de documento</legend><div class="cbs">${cbs('tipos',TIPOSDOC)}</div></fieldset>
  </div>
  <p class="err" id="ff-err" role="alert"></p>
 </div>
 <div class="drawer-f"><button type="button" class="btn" id="ff-clear">Limpar filtros</button><button class="btn pri" type="submit" style="margin-left:auto">Aplicar filtros</button></div></form>`;
 paintIcons(root);const $=q=>root.querySelector(q);
 const close=()=>{root.innerHTML='';prev&&prev.focus()};
 root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
 $('#ff-clear').onclick=()=>{root.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);$('#ff-cli').value='';$('#ff-de').value='2026-01-01';$('#ff-ate').value='2026-09-04';$('#ff-cmp').value='Mesmo período de 2025'};
 $('#ff').onsubmit=e=>{e.preventDefault();const de=$('#ff-de').value,ate=$('#ff-ate').value;
  if(!de||!ate||de>ate){$('#ff-err').textContent='A data "De" tem de ser anterior à data "Até".';$('#ff-de').focus();return}

  close();const n=activeF().length;show(cur);toast(n?`${n} ${n>1?'filtros aplicados':'filtro aplicado'} a todos os painéis.`:'Filtros limpos.')};
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
 $('#ff-de').focus()}
function filterBar(){const a=activeF();if(!a.length)return '';
 return `<div class="fbar"><span class="muted">Filtros:</span>${a.map(([k,v,l])=>`<span class="em">${esc(l)}<button type="button" aria-label="Remover filtro ${esc(l)}" data-rf="${k}|${esc(v)}">${ic('x',11)}</button></span>`).join('')}<button class="link" data-rfall>Limpar tudo</button></div>`}

/* ================= navegação ================= */
const ORDER=['resumo','alertas','clientes','faturacao','artigos','zonas','previsoes','guardados'];
document.getElementById('rail').innerHTML=`<span class="mark" aria-label="Flow">${ic('mark')}</span>`+
 ORDER.map(k=>`<a href="#${k}" data-k="${k}">${ic(VIEWS[k].icon,18)}${VIEWS[k].badge?`<span class="bd">${VIEWS[k].badge}</span>`:''}${k==='guardados'?`<span class="bd sv">${SAVED.length}</span>`:''}<span class="tip">${VIEWS[k].nome}</span></a>`).join('')+
 `<a href="#" style="margin-top:auto" onclick="event.preventDefault()">${ic('gear',18)}<span class="tip">Definições</span></a><span class="av" title="Diana Silva">DS</span>`;
function show(k){if(!VIEWS[k])k='resumo';document.getElementById('drawer-root').innerHTML='';cur=k;const v=VIEWS[k],m=document.getElementById('main');
 m.innerHTML=v.render();
 if(k!=='guardados'){const c=m.querySelector('.head .ctrl')||(()=>{const d=document.createElement('div');d.className='ctrl';m.querySelector('.head').appendChild(d);return d})();c.insertAdjacentHTML('afterbegin','<button class="btn" data-savevista><span data-i="bookmark"></span>Guardar vista</button>');c.querySelector('[data-savevista]').onclick=guardarVista}

 m.querySelectorAll('[data-schedule]').forEach(b=>b.onclick=openSchedule);
 m.querySelectorAll('[data-doc]').forEach(r=>{r.onclick=()=>openDoc(+r.dataset.doc);r.onkeydown=e=>{if(e.key==='Enter')openDoc(+r.dataset.doc)}});
 paintIcons(m);v.after&&v.after();
 m.querySelectorAll('table').forEach(t=>{const tb=t.tBodies[0];if(tb&&!tb.rows.length)tb.innerHTML=`<tr><td colspan="${t.tHead.rows[0].cells.length}" class="empty">Nenhum resultado com os filtros atuais.</td></tr>`});
 m.querySelectorAll('[data-seg]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))));
 m.querySelectorAll('[data-fq]').forEach(b=>b.onclick=()=>flowAsk(b.dataset.fq));
 bindCli(m);
 document.querySelectorAll('#rail a[data-k]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.k===k)||a.dataset.k===k&&a.setAttribute('aria-current','page'));
 document.querySelectorAll('#rail a[data-k]').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 document.getElementById('flow-ctx').textContent='A ver: '+v.nome;
 document.title='Flow · '+v.nome;
 k==='resumo'?flowAgosto():flowHello();
 m.scrollTop=0;topB.classList.remove('on');closeMenu();
}
function go(k){show(k);try{history.replaceState(null,'','#'+k)}catch(e){}}
/* o visualizador pode intercetar links: a navegação interna é feita aqui */
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();const k=a.getAttribute('href').slice(1);if(k&&VIEWS[k])go(k)},true);
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.getElementById('gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){VIEWS.clientes.q=e.target.value;go('clientes')}});
paintIcons(document);
show(location.hash.slice(1)||'resumo');
