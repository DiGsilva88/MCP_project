name: Build

on:
  push:
    branches: [ main, Fase-2 ]
  pull_request:
    branches: [ main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vendas.slnx

      - name: Build
        run: dotnet build Vendas.slnx --no-restore --configuration Release --warnaserror

      - name: Test
        run: dotnet test Vendas.slnx --no-restore --configuration Release --filter "Categoria!=Integração"


        